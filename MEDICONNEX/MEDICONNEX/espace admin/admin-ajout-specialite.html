<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des patients - MédiConnex</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --admin: #ffaa33;
            --admin-light: rgba(255,170,51,0.2);
            --admin-dark: #cc8800;
            --danger: #ff3366;
            --success: #00ff88;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .gestion-wrapper {
            display: flex;
            width: 100%;
            max-width: 1400px;
            min-height: 90vh;
            background: rgba(26,26,46,0.7);
            border: 2px solid var(--admin);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            overflow: hidden;
            box-shadow: 0 0 50px var(--admin);
        }

        .sidebar {
            width: 280px;
            background: rgba(0,0,0,0.3);
            border-right: 2px solid var(--admin);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 40px;
        }

        .sidebar-logo i {
            font-size: 2.5rem;
            color: var(--admin);
            filter: drop-shadow(0 0 10px var(--admin));
        }

        .sidebar-logo span {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--admin);
            letter-spacing: 2px;
        }

        .sidebar-menu {
            list-style: none;
            flex: 1;
        }

        .sidebar-menu li {
            margin-bottom: 8px;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 20px;
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            transition: 0.3s;
            font-size: 0.95rem;
        }

        .sidebar-menu a i {
            width: 25px;
            color: var(--admin);
            font-size: 1.2rem;
        }

        .sidebar-menu a:hover,
        .sidebar-menu .active a {
            background: var(--admin-light);
            border-left: 4px solid var(--admin);
            color: var(--admin);
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid var(--admin);
        }

        .sidebar-footer a {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 20px;
            color: var(--danger);
            text-decoration: none;
            transition: 0.3s;
        }

        .sidebar-footer a:hover {
            background: rgba(255,51,102,0.1);
            border-left: 4px solid var(--danger);
        }

        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .page-header h1 {
            color: var(--admin);
            font-size: 2rem;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-stats {
            display: flex;
            gap: 20px;
            background: rgba(0,0,0,0.2);
            padding: 10px 20px;
            border-radius: 40px;
            border: 1px solid var(--admin);
        }

        .header-stat {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #aaa;
            font-size: 0.9rem;
        }

        .header-stat span {
            color: var(--admin);
            font-weight: 700;
            font-size: 1.1rem;
        }

        .search-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .search-wrapper {
            flex: 1;
            position: relative;
        }

        .search-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--admin);
        }

        .search-wrapper input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--admin);
            border-radius: 40px;
            color: #fff;
            font-size: 1rem;
            transition: 0.3s;
        }

        .search-wrapper input:focus {
            outline: none;
            border-color: var(--admin);
            box-shadow: 0 0 15px var(--admin);
            background: rgba(255,255,255,0.1);
        }

        .btn-refresh {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--admin);
            border-radius: 40px;
            padding: 0 20px;
            color: var(--admin);
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-refresh:hover {
            background: var(--admin);
            color: #1a1a2e;
        }

        .table-container {
            overflow-x: auto;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--admin);
            border-radius: 15px;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            color: var(--admin);
            padding: 15px 10px;
            text-align: left;
            border-bottom: 2px solid var(--admin);
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        th:hover {
            color: var(--admin-dark);
        }

        th i {
            margin-left: 5px;
            font-size: 0.8rem;
            opacity: 0.6;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid rgba(255,170,51,0.2);
            transition: 0.3s;
            color: #ffffff;
        }

        tr:hover td {
            background: var(--admin-light);
        }

        .badge-id {
            background: rgba(255,170,51,0.15);
            color: var(--admin);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-family: monospace;
        }

        .action-icons {
            display: flex;
            gap: 15px;
        }

        .action-icons i {
            color: #aaa;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1.1rem;
            padding: 5px;
            border-radius: 50%;
        }

        .action-icons i:hover {
            transform: scale(1.1);
        }

        .action-icons .fa-trash:hover {
            color: var(--danger);
            background: rgba(255,51,102,0.2);
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .page-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--admin);
            border-radius: 50%;
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
        }

        .page-btn.active {
            background: var(--admin-light);
            border-color: var(--admin);
            color: var(--admin);
            box-shadow: 0 0 10px var(--admin);
        }

        .page-btn:hover:not(.active) {
            border-color: var(--admin);
            transform: translateY(-2px);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 15px 25px;
            border-radius: 10px;
            font-weight: 600;
            z-index: 1100;
            animation: slideInRight 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .toast.success {
            background: var(--success);
            color: #1a1a2e;
        }

        .toast.error {
            background: var(--danger);
            color: white;
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: var(--admin);
        }

        .loading-spinner i {
            font-size: 2rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: #aaa;
        }

        .empty-state i {
            font-size: 4rem;
            color: var(--admin);
            margin-bottom: 15px;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .gestion-wrapper { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 2px solid var(--admin); }
            .page-header { flex-direction: column; align-items: flex-start; }
            .header-stats { width: 100%; justify-content: center; }
            .search-bar { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="gestion-wrapper">
        <div class="sidebar">
            <div class="sidebar-logo">
                <i class="fa-solid fa-hospital-user"></i>
                <span>MédiConnex</span>
            </div>
            <ul class="sidebar-menu">
                <li><a href="admin-dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
                <li><a href="admin-medecins.html"><i class="fa-solid fa-user-md"></i> Médecins</a></li>
                <li><a href="admin-hopitaux.html"><i class="fa-solid fa-hospital"></i> Hôpitaux</a></li>
                <li><a href="admin-specialites.html"><i class="fa-solid fa-stethoscope"></i> Spécialités</a></li>
                <li class="active"><a href="admin-patients.html"><i class="fa-solid fa-users"></i> Patients</a></li>
                <li><a href="admin-statistiques.html"><i class="fa-solid fa-chart-line"></i> Statistiques</a></li>
                <li><a href="admin-logs.html"><i class="fa-solid fa-history"></i> Logs</a></li>
                <li><a href="admin-profil.html"><i class="fa-solid fa-user-cog"></i> Profil</a></li>
            </ul>
            <div class="sidebar-footer">
                <a href="admin-login.html"><i class="fa-solid fa-sign-out-alt"></i> Déconnexion</a>
            </div>
        </div>

        <div class="main-content">
            <div class="page-header">
                <h1><i class="fa-solid fa-users"></i> Gestion des patients</h1>
                <div class="header-stats">
                    <div class="header-stat">
                        <i class="fa-solid fa-user"></i>
                        Total: <span id="totalPatients">0</span>
                    </div>
                </div>
            </div>

            <div class="search-bar">
                <div class="search-wrapper">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Rechercher par nom, prénom, email ou téléphone...">
                </div>
                <button class="btn-refresh" onclick="chargerPatients()">
                    <i class="fa-solid fa-rotate-right"></i> Actualiser
                </button>
            </div>

            <div class="table-container">
                <table id="patientsTable">
                    <thead>
                        <tr>
                            <th onclick="trierPar('id_patient')">ID <i class="fa-solid fa-sort"></i></th>
                            <th onclick="trierPar('nom')">Nom <i class="fa-solid fa-sort"></i></th>
                            <th onclick="trierPar('prenom')">Prénom <i class="fa-solid fa-sort"></i></th>
                            <th onclick="trierPar('email')">Email <i class="fa-solid fa-sort"></i></th>
                            <th onclick="trierPar('telephone')">Téléphone <i class="fa-solid fa-sort"></i></th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="patientsBody">
                        <tr><td colspan="6" class="loading-spinner"><i class="fa-solid fa-spinner fa-spin"></i> Chargement...<\/td><\/tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Configuration Supabase
        const SUPABASE_URL = 'https://uuhdpvtnfaycqemhrelo.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_C-QCOapZ_QY92foN_Q-VRw_3WSoCos7';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Variables globales
        let tousPatients = [];
        let patientsFiltres = [];
        let currentPage = 1;
        let triColonne = 'nom';
        let triOrdre = 'asc';
        const itemsParPage = 10;

        function showToast(message, type) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fa-solid fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i> ${message}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        async function chargerPatients() {
            const tbody = document.getElementById('patientsBody');
            tbody.innerHTML = '<tr><td colspan="6" class="loading-spinner"><i class="fa-solid fa-spinner fa-spin"></i> Chargement...<\/td><\/tr>';
            
            const { data, error } = await supabaseClient
                .from('patients')
                .select('*')
                .order('nom', { ascending: true });
            
            if (error) {
                tbody.innerHTML = `<tr><td colspan="6" class="loading-spinner">❌ Erreur: ${error.message}<\/td><\/tr>`;
                showToast('Erreur: ' + error.message, 'error');
                return;
            }
            
            tousPatients = data || [];
            document.getElementById('totalPatients').innerText = tousPatients.length;
            filtrerEtAfficher();
        }

        function filtrerEtAfficher() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            
            patientsFiltres = tousPatients.filter(p => {
                return search === '' || 
                    p.nom?.toLowerCase().includes(search) ||
                    p.prenom?.toLowerCase().includes(search) ||
                    p.email?.toLowerCase().includes(search) ||
                    p.telephone?.includes(search);
            });
            
            trierEtAfficher();
        }

        function trierEtAfficher() {
            patientsFiltres.sort((a, b) => {
                let valA = a[triColonne] || '';
                let valB = b[triColonne] || '';
                
                if (typeof valA === 'number') {
                    return triOrdre === 'asc' ? valA - valB : valB - valA;
                }
                return triOrdre === 'asc' ? 
                    String(valA).localeCompare(String(valB)) : 
                    String(valB).localeCompare(String(valA));
            });
            
            currentPage = 1;
            afficherPage();
        }

        function trierPar(colonne) {
            if (triColonne === colonne) {
                triOrdre = triOrdre === 'asc' ? 'desc' : 'asc';
            } else {
                triColonne = colonne;
                triOrdre = 'asc';
            }
            trierEtAfficher();
        }

        function afficherPage() {
            const start = (currentPage - 1) * itemsParPage;
            const end = start + itemsParPage;
            const pageData = patientsFiltres.slice(start, end);
            const tbody = document.getElementById('patientsBody');
            
            if (pageData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="empty-state"><i class="fa-solid fa-user-slash"></i><p>Aucun patient trouvé</p><\/td><\/tr>`;
                document.getElementById('pagination').innerHTML = '';
                return;
            }
            
            tbody.innerHTML = '';
            pageData.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td><span class="badge-id">${p.id_patient || p.id}</span><\/td>
                        <td><strong>${p.nom || '-'}</strong><\/td>
                        <td>${p.prenom || '-'}<\/td>
                        <td>${p.email || '-'}<\/td>
                        <td>${p.telephone || '-'}<\/td>
                        <td class="action-icons">
                            <i class="fa-solid fa-trash" title="Supprimer" onclick="supprimerPatient(${p.id_patient || p.id})"><\/i>
                        <\/td>
                    <\/tr>
                `;
            });
            
            afficherPagination();
        }

        function afficherPagination() {
            const totalPages = Math.ceil(patientsFiltres.length / itemsParPage);
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';
            
            if (totalPages <= 1) return;
            
            if (currentPage > 1) {
                pagination.innerHTML += `<div class="page-btn" onclick="changerPage(${currentPage - 1})"><i class="fa-solid fa-chevron-left"></i></div>`;
            }
            
            for (let i = 1; i <= Math.min(totalPages, 5); i++) {
                pagination.innerHTML += `<div class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changerPage(${i})">${i}</div>`;
            }
            
            if (currentPage < totalPages) {
                pagination.innerHTML += `<div class="page-btn" onclick="changerPage(${currentPage + 1})"><i class="fa-solid fa-chevron-right"></i></div>`;
            }
        }

        function changerPage(page) {
            currentPage = page;
            afficherPage();
        }

        async function supprimerPatient(id) {
            if (!confirm('Supprimer ce patient ?')) return;
            
            const { error } = await supabaseClient.from('patients').delete().eq('id_patient', id);
            if (error) {
                showToast('Erreur: ' + error.message, 'error');
            } else {
                showToast('Patient supprimé', 'success');
                chargerPatients();
            }
        }

        document.getElementById('searchInput').addEventListener('input', () => {
            filtrerEtAfficher();
        });

        chargerPatients();
    </script>
</body>
</html>
