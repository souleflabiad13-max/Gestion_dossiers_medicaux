<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des hôpitaux - MédiConnex</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --admin: #ffaa33;
            --admin-light: rgba(255,170,51,0.2);
            --admin-dark: #cc8800;
            --danger: #ff3366;
            --success: #00ff88;
            --info: #00d4ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #ffffff;
        }

        /* SCROLLBAR PERSONNALISÉE */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a2e; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--admin); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--admin-dark); }

        .gestion-wrapper {
            display: flex;
            width: 100%;
            max-width: 1400px;
            min-height: 90vh;
            background: rgba(26,26,46,0.7);
            border: 2px solid var(--admin);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            overflow: hidden;
            box-shadow: 0 0 50px var(--admin);
        }

        /* SIDEBAR */
        .sidebar {
            width: 280px;
            background: rgba(0,0,0,0.3);
            border-right: 2px solid var(--admin);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 40px;
        }

        .sidebar-logo i {
            font-size: 2.5rem;
            color: var(--admin);
            filter: drop-shadow(0 0 10px var(--admin));
        }

        .sidebar-logo span {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--admin);
            letter-spacing: 2px;
        }

        .sidebar-menu {
            list-style: none;
            flex: 1;
        }

        .sidebar-menu li {
            margin-bottom: 8px;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 20px;
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            transition: 0.3s;
            font-size: 0.95rem;
        }

        .sidebar-menu a i {
            width: 25px;
            color: var(--admin);
            font-size: 1.2rem;
        }

        .sidebar-menu a:hover, .sidebar-menu .active a {
            background: var(--admin-light);
            border-left: 4px solid var(--admin);
            color: var(--admin);
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid var(--admin);
        }

        .sidebar-footer a {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 20px;
            color: var(--danger);
            text-decoration: none;
            transition: 0.3s;
        }

        .sidebar-footer a:hover {
            background: rgba(255,51,102,0.1);
            border-left: 4px solid var(--danger);
        }

        /* MAIN CONTENT */
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        /* HEADER */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .page-header h1 {
            color: var(--admin);
            font-size: 2rem;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-stats {
            display: flex;
            gap: 20px;
            background: rgba(0,0,0,0.2);
            padding: 10px 20px;
            border-radius: 40px;
            border: 1px solid var(--admin);
        }

        .header-stat {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #aaa;
            font-size: 0.9rem;
        }

        .header-stat span {
            color: var(--admin);
            font-weight: 700;
            font-size: 1.1rem;
        }

        .btn-add {
            background: rgba(0,0,0,0.2);
            border: 2px solid var(--admin);
            border-radius: 40px;
            padding: 12px 25px;
            color: var(--admin);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
            cursor: pointer;
        }

        .btn-add:hover {
            background: var(--admin);
            color: #1a1a2e;
            box-shadow: 0 0 30px var(--admin);
            transform: translateY(-2px);
        }

        /* BARRE DE RECHERCHE */
        .search-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .search-wrapper {
            flex: 1;
            position: relative;
        }

        .search-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--admin);
        }

        .search-wrapper input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--admin);
            border-radius: 40px;
            color: #fff;
            font-size: 1rem;
            transition: 0.3s;
        }

        .search-wrapper input:focus {
            outline: none;
            border-color: var(--admin);
            box-shadow: 0 0 15px var(--admin);
            background: rgba(255,255,255,0.1);
        }

        .btn-refresh {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--admin);
            border-radius: 40px;
            padding: 0 20px;
            color: var(--admin);
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-refresh:hover {
            background: var(--admin);
            color: #1a1a2e;
        }

        /* TABLEAU */
        .table-container {
            overflow-x: auto;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--admin);
            border-radius: 15px;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            color: var(--admin);
            padding: 15px 10px;
            text-align: left;
            border-bottom: 2px solid var(--admin);
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        th:hover {
            color: var(--admin-dark);
        }

        th i {
            margin-left: 5px;
            font-size: 0.8rem;
            opacity: 0.6;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid rgba(255,170,51,0.2);
            transition: 0.3s;
            color: #ffffff;
        }

        tr:hover td {
            background: var(--admin-light);
        }

        /* BADGES */
        .badge-id {
            background: rgba(255,170,51,0.15);
            color: #ffaa33;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-family: monospace;
        }

        /* ACTIONS */
        .action-icons {
            display: flex;
            gap: 15px;
        }

        .action-icons i {
            color: #aaa;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1.1rem;
            padding: 5px;
            border-radius: 50%;
        }

        .action-icons i:hover {
            transform: scale(1.1);
        }

        .action-icons .fa-pen:hover {
            color: var(--admin);
            background: var(--admin-light);
        }

        .action-icons .fa-trash:hover {
            color: var(--danger);
            background: rgba(255,51,102,0.2);
        }

        /* PAGINATION */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .page-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--admin);
            border-radius: 50%;
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
        }

        .page-btn.active {
            background: var(--admin-light);
            border-color: var(--admin);
            color: var(--admin);
            box-shadow: 0 0 10px var(--admin);
        }

        .page-btn:hover:not(.active) {
            border-color: var(--admin);
            transform: translateY(-2px);
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: linear-gradient(145deg, #16213e, #1a1a2e);
            border: 2px solid var(--admin);
            border-radius: 30px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            animation: modalFadeIn 0.3s ease;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: var(--admin);
        }

        .close-modal {
            color: #aaa;
            font-size: 2rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .close-modal:hover {
            color: var(--danger);
            transform: rotate(90deg);
        }

        .modal-field {
            margin-bottom: 20px;
        }

        .modal-field label {
            color: var(--admin);
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .modal-field input,
        .modal-field select {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--admin);
            border-radius: 10px;
            color: #ffffff;
            font-size: 1rem;
            transition: 0.3s;
        }

        .modal-field input::placeholder {
            color: rgba(255,255,255,0.5);
        }

        .modal-field input:focus,
        .modal-field select:focus {
            outline: none;
            border-color: var(--admin);
            box-shadow: 0 0 15px var(--admin);
        }

        .modal-field select option {
            background: #1a1a2e;
            color: #ffffff;
        }

        .modal-actions {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            border: 2px solid;
            background: transparent;
            transition: 0.3s;
        }

        .modal-btn.save {
            border-color: var(--admin);
            color: var(--admin);
        }

        .modal-btn.save:hover {
            background: var(--admin);
            color: #1a1a2e;
            box-shadow: 0 0 20px var(--admin);
        }

        .modal-btn.cancel {
            border-color: var(--danger);
            color: var(--danger);
        }

        .modal-btn.cancel:hover {
            background: var(--danger);
            color: #1a1a2e;
        }

        /* TOAST NOTIFICATION */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 15px 25px;
            border-radius: 10px;
            font-weight: 600;
            z-index: 1100;
            animation: slideInRight 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .toast.success {
            background: var(--success);
            color: #1a1a2e;
        }

        .toast.error {
            background: var(--danger);
            color: white;
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* LOADING */
        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: var(--admin);
        }

        .loading-spinner i {
            font-size: 2rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: #aaaaaa;
        }

        .empty-state i {
            font-size: 4rem;
            color: var(--admin);
            margin-bottom: 15px;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .gestion-wrapper { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 2px solid var(--admin); }
            .page-header { flex-direction: column; align-items: flex-start; }
            .header-stats { width: 100%; justify-content: center; }
            .search-bar { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="gestion-wrapper">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-logo">
                <i class="fa-solid fa-hospital-user"></i>
                <span>MédiConnex</span>
            </div>
            <ul class="sidebar-menu">
                <li><a href="admin-dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
                <li><a href="admin-medecins.html"><i class="fa-solid fa-user-md"></i> Médecins</a></li>
                <li class="active"><a href="admin-hopitaux.html"><i class="fa-solid fa-hospital"></i> Hôpitaux</a></li>
                <li><a href="admin-specialites.html"><i class="fa-solid fa-stethoscope"></i> Spécialités</a></li>
                <li><a href="admin-patients.html"><i class="fa-solid fa-users"></i> Patients</a></li>
                <li><a href="admin-statistiques.html"><i class="fa-solid fa-chart-line"></i> Statistiques</a></li>
                <li><a href="admin-logs.html"><i class="fa-solid fa-history"></i> Logs</a></li>
                <li><a href="admin-profil.html"><i class="fa-solid fa-user-cog"></i> Profil</a></li>
            </ul>
            <div class="sidebar-footer">
                <a href="admin-login.html"><i class="fa-solid fa-sign-out-alt"></i> Déconnexion</a>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <div class="page-header">
                <h1><i class="fa-solid fa-hospital"></i> Gestion des hôpitaux</h1>
                <div class="header-stats">
                    <div class="header-stat">
                        <i class="fa-solid fa-building"></i>
                        Total: <span id="totalHopitaux">0</span>
                    </div>
                </div>
                <button class="btn-add" onclick="ouvrirModalAjout()">
                    <i class="fa-solid fa-plus"></i> Ajouter un hôpital
                </button>
            </div>

            <!-- BARRE DE RECHERCHE -->
            <div class="search-bar">
                <div class="search-wrapper">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Rechercher par nom, wilaya ou adresse...">
                </div>
                <button class="btn-refresh" onclick="rafraichirDonnees()">
                    <i class="fa-solid fa-rotate-right"></i> Actualiser
                </button>
            </div>

            <!-- TABLEAU -->
            <div class="table-container">
                <table id="hopitauxTable">
                    <thead>
                        <tr>
                            <th onclick="trierPar('id_hopital')">ID <i class="fa-solid fa-sort"></i></th>
                            <th onclick="trierPar('nom_hopital')">Nom hôpital <i class="fa-solid fa-sort"></i></th>
                            <th onclick="trierPar('wilaya')">Wilaya <i class="fa-solid fa-sort"></i></th>
                            <th onclick="trierPar('adresse')">Adresse <i class="fa-solid fa-sort"></i></th>
                            <th onclick="trierPar('telephone')">Téléphone <i class="fa-solid fa-sort"></i></th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="hopitauxBody">
                        <tr><td colspan="6" class="loading-spinner"><i class="fa-solid fa-spinner fa-spin"></i> Chargement...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- PAGINATION -->
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <!-- MODAL AJOUT -->
    <div id="modalAjout" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fa-solid fa-plus"></i> Ajouter un hôpital</h2>
                <span class="close-modal" onclick="fermerModal('modalAjout')">&times;</span>
            </div>
            <div class="modal-field">
                <label>Nom de l'hôpital *</label>
                <input type="text" id="ajoutNom" placeholder="Ex: CHU Mustapha" required>
            </div>
            <div class="modal-field">
                <label>Wilaya *</label>
                <select id="ajoutWilaya" required>
                    <option value="">-- Sélectionner --</option>
                </select>
            </div>
            <div class="modal-field">
                <label>Adresse</label>
                <input type="text" id="ajoutAdresse" placeholder="Adresse complète">
            </div>
            <div class="modal-field">
                <label>Téléphone</label>
                <input type="tel" id="ajoutTel" placeholder="Ex: 023 45 67 89">
            </div>
            <div class="modal-actions">
                <button class="modal-btn cancel" onclick="fermerModal('modalAjout')">Annuler</button>
                <button class="modal-btn save" onclick="ajouterHopital()">Ajouter</button>
            </div>
        </div>
    </div>

    <!-- MODAL MODIFICATION -->
    <div id="modalModif" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fa-solid fa-pen"></i> Modifier hôpital</h2>
                <span class="close-modal" onclick="fermerModal('modalModif')">&times;</span>
            </div>
            <input type="hidden" id="editId">
            <div class="modal-field">
                <label>Nom de l'hôpital *</label>
                <input type="text" id="editNom" required>
            </div>
            <div class="modal-field">
                <label>Wilaya *</label>
                <select id="editWilaya" required>
                    <option value="">-- Sélectionner --</option>
                </select>
            </div>
            <div class="modal-field">
                <label>Adresse</label>
                <input type="text" id="editAdresse">
            </div>
            <div class="modal-field">
                <label>Téléphone</label>
                <input type="tel" id="editTel">
            </div>
            <div class="modal-actions">
                <button class="modal-btn cancel" onclick="fermerModal('modalModif')">Annuler</button>
                <button class="modal-btn save" onclick="enregistrerModification()">Enregistrer</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ========== CONFIGURATION ==========
        const SUPABASE_URL = 'https://uuhdpvtnfaycqemhrelo.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_C-QCOapZ_QY92foN_Q-VRw_3WSoCos7';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ========== VARIABLES GLOBALES ==========
        let tousHopitaux = [];
        let hopitauxFiltres = [];
        let currentPage = 1;
        const rowsPerPage = 10;
        let triColonne = 'nom_hopital';
        let triOrdre = 'asc';
        let wilayasList = [];

        // ========== NOTIFICATIONS ==========
        function showToast(message, type = 'success') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fa-solid fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i> ${message}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // ========== CHARGEMENT DES WILAYAS ==========
        async function chargerWilayas() {
            const { data: wilayas } = await supabaseClient
                .from('wilayas')
                .select('id_wilaya, nom_wilaya')
                .order('nom_wilaya');
            
            if (wilayas) {
                wilayasList = wilayas;
                const selectAjout = document.getElementById('ajoutWilaya');
                const selectEdit = document.getElementById('editWilaya');
                
                selectAjout.innerHTML = '<option value="">-- Sélectionner --</option>';
                selectEdit.innerHTML = '<option value="">-- Sélectionner --</option>';
                
                wilayas.forEach(w => {
                    selectAjout.innerHTML += `<option value="${w.id_wilaya}">${w.nom_wilaya}</option>`;
                    selectEdit.innerHTML += `<option value="${w.id_wilaya}">${w.nom_wilaya}</option>`;
                });
            }
        }

        // ========== CHARGEMENT DES HÔPITAUX ==========
        async function chargerHopitaux() {
            const tbody = document.getElementById('hopitauxBody');
            tbody.innerHTML = '<tr><td colspan="6" class="loading-spinner"><i class="fa-solid fa-spinner fa-spin"></i> Chargement...</td></tr>';
            
            const { data: hopitaux, error } = await supabaseClient
                .from('hopitaux')
                .select('*')
                .order('nom_hopital', { ascending: true });
            
            if (error) {
                tbody.innerHTML = `<tr><td colspan="6" class="loading-spinner">❌ Erreur: ${error.message}</td></tr>`;
                return;
            }
            
            tousHopitaux = hopitaux.map(h => ({
                ...h,
                wilaya_nom: wilayasList.find(w => w.id_wilaya === h.id_wilaya)?.nom_wilaya || 'Non défini'
            }));
            
            document.getElementById('totalHopitaux').innerText = tousHopitaux.length;
            appliquerFiltres();
        }

        // ========== FILTRES ET TRI ==========
        function appliquerFiltres() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            hopitauxFiltres = tousHopitaux.filter(h => {
                return !searchTerm || 
                    h.nom_hopital?.toLowerCase().includes(searchTerm) ||
                    h.wilaya_nom?.toLowerCase().includes(searchTerm) ||
                    h.adresse?.toLowerCase().includes(searchTerm) ||
                    h.telephone?.includes(searchTerm);
            });
            
            trierHopitaux();
        }

        function trierHopitaux() {
            hopitauxFiltres.sort((a, b) => {
                let valA = a[triColonne] || a.wilaya_nom;
                let valB = b[triColonne] || b.wilaya_nom;
                
                if (triColonne === 'wilaya') {
                    valA = a.wilaya_nom;
                    valB = b.wilaya_nom;
                }
                
                if (typeof valA === 'number') {
                    return triOrdre === 'asc' ? valA - valB : valB - valA;
                }
                return triOrdre === 'asc' ? 
                    String(valA).localeCompare(String(valB)) : 
                    String(valB).localeCompare(String(valA));
            });
            
            currentPage = 1;
            afficherPage();
        }

        function trierPar(colonne) {
            if (triColonne === colonne) {
                triOrdre = triOrdre === 'asc' ? 'desc' : 'asc';
            } else {
                triColonne = colonne;
                triOrdre = 'asc';
            }
            trierHopitaux();
        }

        // ========== AFFICHAGE PAGE ==========
        function afficherPage() {
            const start = (currentPage - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const hopitauxPage = hopitauxFiltres.slice(start, end);
            const tbody = document.getElementById('hopitauxBody');
            
            if (hopitauxPage.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="empty-state"><i class="fa-solid fa-building"></i><p>Aucun hôpital trouvé</p></td></tr>`;
                document.getElementById('pagination').innerHTML = '';
                return;
            }
            
            tbody.innerHTML = '';
            hopitauxPage.forEach(h => {
                const ligne = document.createElement('tr');
                ligne.innerHTML = `
                    <td><span class="badge-id">${h.id_hopital}</span></td>
                    <td><strong>${h.nom_hopital}</strong></td>
                    <td><i class="fa-solid fa-location-dot" style="color:var(--admin); margin-right:5px;"></i>${h.wilaya_nom}</td>
                    <td>${h.adresse || '-'}</td>
                    <td>${h.telephone || '-'}</td>
                    <td class="action-icons">
                        <i class="fa-solid fa-pen" title="Modifier" onclick="ouvrirModalModif(${h.id_hopital})"></i>
                        <i class="fa-solid fa-trash" title="Supprimer" onclick="supprimerHopital(${h.id_hopital})"></i>
                    </td>
                `;
                tbody.appendChild(ligne);
            });
            
            afficherPagination();
        }

        function afficherPagination() {
            const totalPages = Math.ceil(hopitauxFiltres.length / rowsPerPage);
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';
            
            if (totalPages <= 1) return;
            
            if (currentPage > 1) {
                pagination.innerHTML += `<div class="page-btn" onclick="changerPage(${currentPage - 1})"><i class="fa-solid fa-chevron-left"></i></div>`;
            }
            
            for (let i = 1; i <= Math.min(totalPages, 5); i++) {
                pagination.innerHTML += `<div class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changerPage(${i})">${i}</div>`;
            }
            
            if (currentPage < totalPages) {
                pagination.innerHTML += `<div class="page-btn" onclick="changerPage(${currentPage + 1})"><i class="fa-solid fa-chevron-right"></i></div>`;
            }
        }

        function changerPage(page) {
            currentPage = page;
            afficherPage();
        }

        function rafraichirDonnees() {
            chargerHopitaux();
            showToast('Données actualisées', 'success');
        }

        // ========== CRUD ==========
        function ouvrirModalAjout() {
            document.getElementById('ajoutNom').value = '';
            document.getElementById('ajoutAdresse').value = '';
            document.getElementById('ajoutTel').value = '';
            document.getElementById('ajoutWilaya').value = '';
            document.getElementById('modalAjout').style.display = 'flex';
        }

        async function ajouterHopital() {
            const nom = document.getElementById('ajoutNom').value.trim();
            const wilaya = document.getElementById('ajoutWilaya').value;
            const adresse = document.getElementById('ajoutAdresse').value.trim();
            const telephone = document.getElementById('ajoutTel').value.trim();
            
            if (!nom || !wilaya) {
                showToast('Veuillez remplir le nom et la wilaya', 'error');
                return;
            }
            
            const data = {
                nom_hopital: nom,
                id_wilaya: parseInt(wilaya),
                adresse: adresse || null,
                telephone: telephone || null
            };
            
            const { error } = await supabaseClient.from('hopitaux').insert([data]);
            if (error) {
                showToast('Erreur: ' + error.message, 'error');
            } else {
                showToast('Hôpital ajouté avec succès', 'success');
                fermerModal('modalAjout');
                chargerHopitaux();
            }
        }

        async function ouvrirModalModif(id) {
            const hopital = tousHopitaux.find(h => h.id_hopital === id);
            if (!hopital) return;
            
            document.getElementById('editId').value = hopital.id_hopital;
            document.getElementById('editNom').value = hopital.nom_hopital;
            document.getElementById('editAdresse').value = hopital.adresse || '';
            document.getElementById('editTel').value = hopital.telephone || '';
            document.getElementById('editWilaya').value = hopital.id_wilaya || '';
            document.getElementById('modalModif').style.display = 'flex';
        }

        async function enregistrerModification() {
            const id = document.getElementById('editId').value;
            const nom = document.getElementById('editNom').value.trim();
            const wilaya = document.getElementById('editWilaya').value;
            const adresse = document.getElementById('editAdresse').value.trim();
            const telephone = document.getElementById('editTel').value.trim();
            
            if (!nom || !wilaya) {
                showToast('Veuillez remplir le nom et la wilaya', 'error');
                return;
            }
            
            const data = {
                nom_hopital: nom,
                id_wilaya: parseInt(wilaya),
                adresse: adresse || null,
                telephone: telephone || null
            };
            
            const { error } = await supabaseClient.from('hopitaux').update(data).eq('id_hopital', id);
            if (error) {
                showToast('Erreur: ' + error.message, 'error');
            } else {
                showToast('Hôpital modifié avec succès', 'success');
                fermerModal('modalModif');
                chargerHopitaux();
            }
        }

        async function supprimerHopital(id) {
            if (!confirm('🗑️ Êtes-vous sûr de vouloir supprimer cet hôpital ? Cette action est irréversible.')) return;
            
            const { error } = await supabaseClient.from('hopitaux').delete().eq('id_hopital', id);
            if (error) {
                showToast('Erreur: ' + error.message, 'error');
            } else {
                showToast('Hôpital supprimé avec succès', 'success');
                chargerHopitaux();
            }
        }

        // ========== FERMETURE MODAL ==========
        function fermerModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = 'none';
            }
        };

        // ========== ÉCOUTEURS ==========
        document.getElementById('searchInput').addEventListener('input', () => {
            appliquerFiltres();
        });

        // ========== INITIALISATION ==========
        async function init() {
            await chargerWilayas();
            await chargerHopitaux();
        }
        
        init();
    </script>
</body>
</html>
