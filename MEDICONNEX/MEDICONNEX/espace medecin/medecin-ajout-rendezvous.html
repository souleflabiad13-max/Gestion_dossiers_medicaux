<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau rendez-vous - MédiConnex</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .rdv-container {
            max-width: 700px;
            width: 100%;
            background: linear-gradient(145deg, rgba(0,212,255,0.05), rgba(26,26,46,0.95));
            border: 1px solid #00d4ff33;
            border-radius: 30px;
            padding: 40px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
        }

        .rdv-container:hover {
            box-shadow: 0 0 30px rgba(0,212,255,0.2);
        }

        h1 {
            color: #00d4ff;
            font-size: 2rem;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 30px;
            font-size: 0.9rem;
            border-left: 3px solid #00d4ff;
            padding-left: 12px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #00d4ff;
            font-size: 0.9rem;
            margin-bottom: 8px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #00d4ff99;
            font-size: 1.1rem;
        }

        input, select {
            width: 100%;
            padding: 14px 15px 14px 45px;
            background: rgba(255,255,255,0.03);
            border: 2px solid #00d4ff33;
            border-radius: 15px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #00d4ff;
            background: rgba(0,212,255,0.05);
            box-shadow: 0 0 15px #00d4ff33;
        }

        select option {
            background: #1a1a2e;
            color: #fff;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00d4ff22, #00d4ff11);
            border: 2px solid #00d4ff;
            border-radius: 50px;
            color: #00d4ff;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-submit:hover {
            background: #00d4ff;
            color: #1a1a2e;
            box-shadow: 0 0 30px #00d4ff;
            transform: translateY(-2px);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #aaa;
            text-decoration: none;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        .back-link:hover {
            color: #00d4ff;
        }

        .loading-spinner {
            text-align: center;
            color: #00d4ff;
            padding: 20px;
            font-size: 0.9rem;
        }

        .error-msg {
            color: #ff3366;
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
        }

        @media (max-width: 600px) {
            .rdv-container {
                padding: 25px;
            }
            h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="rdv-container">
        <a href="medecin-rendezvous.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Retour
        </a>

        <h1>
            <i class="fas fa-calendar-plus"></i>
            Nouveau rendez-vous
        </h1>
        <div class="subtitle">Planifiez une consultation avec un patient</div>

        <form id="rdvForm">
            <div class="form-group">
                <label><i class="fas fa-user-injured"></i> Patient</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <select id="patientId" required>
                        <option value="">Chargement des patients...</option>
                    </select>
                </div>
                <div id="patientError" class="error-msg">Veuillez sélectionner un patient</div>
            </div>

            <div class="form-group">
                <label><i class="fas fa-calendar-alt"></i> Date et heure</label>
                <div class="input-wrapper">
                    <i class="fas fa-calendar"></i>
                    <input type="datetime-local" id="dateRdv" required>
                </div>
                <div id="dateError" class="error-msg">Veuillez choisir une date et heure</div>
            </div>

            <div class="form-group">
                <label><i class="fas fa-stethoscope"></i> Motif</label>
                <div class="input-wrapper">
                    <i class="fas fa-notes-medical"></i>
                    <input type="text" id="motif" placeholder="Ex: Consultation de suivi, urgence...">
                </div>
            </div>

            <div class="form-group">
                <label><i class="fas fa-tag"></i> Statut</label>
                <div class="input-wrapper">
                    <i class="fas fa-circle"></i>
                    <select id="statut">
                        <option value="en_attente">⏳ En attente</option>
                        <option value="confirme">✅ Confirmé</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fas fa-save"></i> Enregistrer le rendez-vous
            </button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://uuhdpvtnfaycqemhrelo.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_C-QCOapZ_QY92foN_Q-VRw_3WSoCos7'; // ⚠️ Remplace par TA clé

        const medecin = JSON.parse(localStorage.getItem('medecin') || '{}');
        const medecinId = medecin.id_medecin || 1;

        async function chargerPatients() {
            const select = document.getElementById('patientId');
            select.innerHTML = '<option>⏳ Chargement des patients...</option>';
            
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/patients?select=id_patient,nom,prenom&order=nom.asc`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                const patients = await response.json();
                
                if (patients.length === 0) {
                    select.innerHTML = '<option>⚠️ Aucun patient trouvé. Créez-en un d\'abord.</option>';
                    return;
                }
                
                select.innerHTML = '<option value="">-- Sélectionnez un patient --</option>';
                patients.forEach(p => {
                    const option = document.createElement('option');
                    option.value = p.id_patient;
                    option.textContent = `${p.prenom} ${p.nom}`;
                    select.appendChild(option);
                });
            } catch (err) {
                console.error(err);
                select.innerHTML = '<option>❌ Erreur de chargement</option>';
            }
        }

        document.getElementById('rdvForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const patientId = document.getElementById('patientId').value;
            const dateRdv = document.getElementById('dateRdv').value;
            
            let isValid = true;
            
            if (!patientId) {
                document.getElementById('patientError').style.display = 'block';
                isValid = false;
            } else {
                document.getElementById('patientError').style.display = 'none';
            }
            
            if (!dateRdv) {
                document.getElementById('dateError').style.display = 'block';
                isValid = false;
            } else {
                document.getElementById('dateError').style.display = 'none';
            }
            
            if (!isValid) return;

            const newRdv = {
                id_patient: parseInt(patientId),
                id_medecin: medecinId,
                date_rdv: new Date(dateRdv).toISOString(),
                motif: document.getElementById('motif').value,
                statut: document.getElementById('statut').value
            };

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/rendez_vous`, {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(newRdv)
                });

                if (res.ok) {
                    alert('✅ Rendez-vous ajouté avec succès');
                    window.location.href = 'medecin-rendezvous.html';
                } else {
                    const error = await res.text();
                    alert('❌ Erreur : ' + error);
                }
            } catch (err) {
                alert('❌ Erreur réseau : ' + err.message);
            }
        });

        chargerPatients();
    </script>
</body>
</html>
