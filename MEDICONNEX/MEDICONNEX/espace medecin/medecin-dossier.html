<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dossier patient - MédiConnex</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #1a1a2e; color: #fff; padding: 30px; display: flex; justify-content: center; align-items: center; }
        .dossier-container { max-width: 1200px; width: 100%; background: rgba(26,26,46,0.7); border-radius: 30px; padding: 30px; backdrop-filter: blur(10px); border: 2px solid #00d4ff33; box-shadow: 0 0 50px rgba(0,212,255,0.2); }
        h1 { color: #00d4ff; margin-bottom: 20px; }
        h2 { color: #00d4ff; margin: 20px 0 10px; font-size: 1.3rem; border-left: 4px solid #00d4ff; padding-left: 10px; }
        .grid-2 { display: grid; grid-template-columns: repeat(2,1fr); gap: 20px; margin-bottom: 20px; }
        .info-card { background: rgba(0,212,255,0.03); border: 1px solid #00d4ff33; border-radius: 20px; padding: 20px; }
        .info-item { padding: 8px 0; border-bottom: 1px solid #00d4ff22; display: flex; justify-content: space-between; }
        .label { color: #aaa; font-weight: 500; }
        .value { color: #fff; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #00d4ff22; }
        th { color: #00d4ff; }
        .btn { background: rgba(0,212,255,0.1); border: 2px solid #00d4ff; border-radius: 40px; padding: 10px 20px; color: #00d4ff; cursor: pointer; text-decoration: none; display: inline-block; margin: 5px 5px 0 0; transition: 0.3s; }
        .btn:hover { background: #00d4ff; color: #1a1a2e; box-shadow: 0 0 20px #00d4ff; }
        .btn-red { border-color: #ff3366; color: #ff3366; }
        .btn-red:hover { background: #ff3366; color: #1a1a2e; }
        .flex-right { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .back-link { color: #aaa; text-decoration: none; display: inline-block; margin-bottom: 20px; }
        .badge { background: #00d4ff22; border-radius: 20px; padding: 5px 12px; display: inline-block; margin: 3px; font-size: 0.8rem; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="dossier-container" id="dossierContainer">
    <div style="text-align:center; padding:50px;">Chargement du dossier...</div>
</div>

<script>
    const SUPABASE_URL = 'https://uuhdpvtnfaycqemhrelo.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_C-QCOapZ_QY92foN_Q-VRw_3WSoCos7'; // ⚠️ Remplace par TA vraie clé

    const params = new URLSearchParams(window.location.search);
    const patientId = params.get('id');

    if (!patientId) {
        document.getElementById('dossierContainer').innerHTML = '<p style="color:red;">❌ Aucun patient sélectionné</p>';
    } else {
        chargerPatient(patientId);
    }

    async function chargerPatient(id) {
        try {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/patients?id_patient=eq.${id}`, {
                headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
            });
            const patient = await res.json();
            if (!patient.length) throw new Error("Patient introuvable");
            afficherDossier(patient[0]);
        } catch (err) {
            document.getElementById('dossierContainer').innerHTML = `<p style="color:red;">❌ ${err.message}</p>`;
        }
    }

    function afficherDossier(p) {
        const html = `
            <a href="medecin-patients.html" class="back-link"><i class="fas fa-arrow-left"></i> Retour à la liste</a>
            <h1><i class="fas fa-folder-open"></i> Dossier patient</h1>

            <!-- 1️⃣ Informations personnelles -->
            <div class="grid-2">
                <div class="info-card">
                    <h2><i class="fas fa-user"></i> Informations personnelles</h2>
                    <div class="info-item"><span class="label">Nom complet</span><span class="value">${p.prenom || ''} ${p.nom || ''}</span></div>
                    <div class="info-item"><span class="label">Date naissance / Âge</span><span class="value">${p.date_naissance || '-'} (${p.age || '?'} ans)</span></div>
                    <div class="info-item"><span class="label">Sexe</span><span class="value">${p.sexe === 'M' ? 'Masculin' : (p.sexe === 'F' ? 'Féminin' : '-')}</span></div>
                    <div class="info-item"><span class="label">Téléphone</span><span class="value">${p.telephone || '-'}</span></div>
                    <div class="info-item"><span class="label">ID / N° dossier</span><span class="value">${p.id_national || p.id_patient}</span></div>
                </div>

                <!-- 2️⃣ Antécédents médicaux -->
                <div class="info-card">
                    <h2><i class="fas fa-notes-medical"></i> Antécédents médicaux</h2>
                    <div class="info-item"><span class="label">Maladies chroniques</span><span class="value">${p.maladies_chroniques || 'Aucune'}</span></div>
                    <div class="info-item"><span class="label">Allergies</span><span class="value">${p.allergies || 'Aucune'}</span></div>
                    <div class="info-item"><span class="label">Chirurgies</span><span class="value">${p.chirurgies || 'Aucune'}</span></div>
                </div>
            </div>

            <!-- 3️⃣ Motif de consultation (exemple fixe ou à remplir) -->
            <div class="info-card">
                <h2><i class="fas fa-stethoscope"></i> Motif de consultation</h2>
                <div class="info-item"><span class="label">Raison de la visite</span><span class="value">Consultation de suivi</span></div>
                <div class="info-item"><span class="label">Symptômes actuels</span><span class="value">Aucun signalement récent</span></div>
            </div>

            <!-- 4️⃣ Historique des consultations (depuis Supabase) -->
            <h2><i class="fas fa-history"></i> Historique des consultations</h2>
            <div id="consultationsList">Chargement...</div>

        

            <!-- 6️⃣ Documents médicaux -->
            <h2><i class="fas fa-file-alt"></i> Documents médicaux</h2>
            <div id="documentsList">Chargement...</div>

            <!-- 7️⃣ Action principale -->
            <div class="flex-right">
                <a href="medecin-consultation.html?patient=${p.id_patient}" class="btn btn-red"><i class="fas fa-calendar-plus"></i> Ajouter nouvelle consultation</a>
            </div>
        `;
        document.getElementById('dossierContainer').innerHTML = html;
        chargerConsultations(p.id_patient);
        chargerOrdonnances(p.id_patient);
        chargerDocuments(p.id_patient);
    }

    async function chargerConsultations(patientId) {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/consultations?id_patient=eq.${patientId}&select=*`, {
            headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
        });
        const consultations = await res.json();
        if (!consultations.length) {
            document.getElementById('consultationsList').innerHTML = '<p>Aucune consultation</p>';
            return;
        }
        let html = '<table><tr><th>Date</th><th>Diagnostic</th><th>Traitement</th></tr>';
        consultations.forEach(c => {
            html += `<tr><td>${c.date_consultation?.slice(0,10) || '-'}</td><td>${c.diagnostic || '-'}</td><td>${c.traitement || '-'}</td></tr>`;
        });
        html += '</table>';
        document.getElementById('consultationsList').innerHTML = html;
    }

    async function chargerOrdonnances(patientId) {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/prescriptions?patient_id=eq.${patientId}&select=*`, {
            headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
        });
        const ordos = await res.json();
        if (!ordos.length) {
            document.getElementById('ordonnancesList').innerHTML = '<p>Aucune ordonnance</p>';
            return;
        }
        let html = '<table><tr><th>Médicament</th><th>Posologie</th><th>Durée</th></tr>';
        ordos.forEach(o => {
            html += `<tr><td>${o.medicament || '-'}</td><td>${o.dosage || '-'}</td><td>${o.duree || '-'}</td></tr>`;
        });
        html += '</table>';
        document.getElementById('ordonnancesList').innerHTML = html;
    }

    async function chargerDocuments(patientId) {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/documents?id_patient=eq.${patientId}&select=*`, {
            headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
        });
        const docs = await res.json();
        if (!docs.length) {
            document.getElementById('documentsList').innerHTML = '<p>Aucun document</p>';
            return;
        }
        let html = '<table><tr><th>Type</th><th>Nom</th><th>Date</th></tr>';
        docs.forEach(d => {
            html += `<tr><td>${d.type_document || '-'}</td><td>${d.nom_fichier || '-'}</td><td>${d.date_upload?.slice(0,10) || '-'}</td></tr>`;
        });
        html += '</table>';
        document.getElementById('documentsList').innerHTML = html;
    }
</script>
</body>
</html>
