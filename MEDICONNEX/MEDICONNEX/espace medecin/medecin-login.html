<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Médecin - MédiConnex</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="background-shape"></div>
        <div class="secondary-shape"></div>

        <div class="credentials-panel signin">
            <h2>Connexion Médecin</h2>
            
            <form id="loginForm">
                <div class="field-wrapper">
                    <input type="text" id="code" required>
                    <label>Code médecin</label>
                    <i class="fa-solid fa-id-card"></i>
                </div>
                
                <div class="field-wrapper">
                    <input type="text" id="nom" required>
                    <label>Nom</label>
                    <i class="fa-solid fa-user"></i>
                </div>
                
                <div class="field-wrapper">
                    <input type="password" id="password" required>
                    <label>Mot de passe</label>
                    <i class="fa-solid fa-lock"></i>
                </div>
                
                <div class="field-wrapper">
                    <button class="submit-button" type="submit">Se connecter</button>
                </div>
            </form>
        </div>

        <div class="welcome-section signin">
            <h2>ESPACE MÉDECIN</h2>
            <p>Accès sécurisé à vos patients et dossiers</p>
        </div>
    </div>

    <script>
        async function login() {
            const code = document.getElementById('code').value.trim();
            const nom = document.getElementById('nom').value.trim();
            const password = document.getElementById('password').value;
            
            if (!code || !nom || !password) {
                alert('❌ Tous les champs sont requis');
                return;
            }
            
            const url = 'https://uuhdpvtnfaycqemhrelo.supabase.co/rest/v1/medecins?select=*&code_medecin=eq.' + code + '&nom=eq.' + nom + '&mot_de_passe=eq.' + password;
            const apikey = 'sb_publishable_C-QCOapZ_QY92foN_Q-VRw_3WSoCos7'; // ← TA VRAIE CLÉ
            
            try {
                const response = await fetch(url, {
                    headers: {
                        'apikey': apikey,
                        'Authorization': 'Bearer ' + apikey
                    }
                });
                const data = await response.json();
                
                if (data && data.length > 0) {
                    localStorage.setItem('medecin', JSON.stringify(data[0]));
                    window.location.href = 'medecin-dashboard.html';
                } else {
                    alert('❌ Code, nom ou mot de passe incorrect');
                }
            } catch (erreur) {
                alert('❌ Erreur de connexion');
            }
        }
        
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            login();
        });
    </script>
</body>
</html>
