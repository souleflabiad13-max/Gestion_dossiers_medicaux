<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des patients - MédiConnex</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .patients-wrapper {
            max-width: 1200px;
            width: 100%;
            background: rgba(26,26,46,0.7);
            border: 2px solid #00d4ff33;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            padding: 30px;
            margin: 30px auto;
            box-shadow: 0 0 50px rgba(0,212,255,0.2);
        }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 20px; }
        .page-header h1 { color: #00d4ff; font-size: 2rem; display: flex; align-items: center; gap: 15px; }
        .btn-add { background: rgba(0,212,255,0.1); border: 2px solid #00d4ff; border-radius: 40px; padding: 12px 25px; color: #00d4ff; text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 10px; transition: 0.3s; }
        .btn-add:hover { background: #00d4ff; color: #1a1a2e; }
        .search-section { background: rgba(0,212,255,0.03); border: 1px solid #00d4ff33; border-radius: 20px; padding: 20px; margin-bottom: 30px; }
        .search-grid { display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: 15px; align-items: end; }
        .search-field label { color: #aaa; font-size: 0.85rem; margin-bottom: 5px; display: block; }
        .search-field input { width: 100%; padding: 12px 15px; background: rgba(255,255,255,0.05); border: 1px solid #00d4ff33; border-radius: 10px; color: #fff; }
        .search-btn { background: rgba(0,212,255,0.1); border: 2px solid #00d4ff; border-radius: 40px; padding: 12px 25px; color: #00d4ff; font-weight: 600; cursor: pointer; height: 45px; }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px 10px; color: #00d4ff; border-bottom: 2px solid #00d4ff33; }
        td { padding: 12px 10px; border-bottom: 1px solid #00d4ff22; }
        tr:hover td { background: rgba(0,212,255,0.05); }
        .action-icons { display: flex; gap: 15px; }
        .action-icons i { color: #aaa; cursor: pointer; transition: 0.3s; font-size: 1.1rem; }
        .action-icons i:hover { color: #00d4ff; }
        .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 30px; }
        .page-btn { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: rgba(0,212,255,0.05); border: 1px solid #00d4ff33; border-radius: 50%; color: #fff; cursor: pointer; }
        .page-btn.active { background: #00d4ff22; border-color: #00d4ff; color: #00d4ff; }
        .loading { text-align: center; padding: 20px; color: #00d4ff; }
    </style>
</head>
<body>
    <div class="patients-wrapper">
        <div class="page-header">
            <h1><i class="fa-solid fa-users"></i> Liste des patients</h1>
            <a href="medecin-ajout-patient.html" class="btn-add"><i class="fa-solid fa-plus"></i> Ajouter un patient</a>
        </div>

        <div class="search-section">
            <div class="search-grid">
                <div class="search-field"><label>Nom</label><input type="text" id="searchNom" placeholder="Ex: Benali"></div>
                <div class="search-field"><label>ID patient</label><input type="text" id="searchId" placeholder="Ex: DZ-2503-042"></div>
                <div class="search-field"><label>Téléphone</label><input type="text" id="searchTel" placeholder="Ex: 0550 12 34 56"></div>
                <button class="search-btn" onclick="filtrerPatients()">Rechercher</button>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead><tr><th>ID</th><th>Nom</th><th>Prénom</th><th>Téléphone</th><th>Actions</th></tr></thead>
                <tbody id="patientsBody"><tr><td colspan="5" class="loading">Chargement...</td></tr></tbody>
            </table>
        </div>
        <div id="pagination" class="pagination"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://uuhdpvtnfaycqemhrelo.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_C-QCOapZ_QY92foN_Q-VRw_3WSoCos7'; // ⚠️ Remplace par ta clé

        let patients = [], filtres = [], currentPage = 1;
        const rowsPerPage = 5;

        async function chargerPatients() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/patients?select=*`, {
                    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
                });
                patients = await res.json();
                filtres = [...patients];
                afficherPatients();
            } catch (err) {
                document.getElementById('patientsBody').innerHTML = '<tr><td colspan="5">❌ Erreur de chargement</td></tr>';
            }
        }

        function afficherPatients() {
            const start = (currentPage-1)*rowsPerPage, end = start+rowsPerPage;
            const pageData = filtres.slice(start, end);
            const tbody = document.getElementById('patientsBody');
            tbody.innerHTML = '';
            if(!pageData.length) { tbody.innerHTML = '<tr><td colspan="5">Aucun patient</td></tr>'; return; }

            pageData.forEach(p => {
                const row = tbody.insertRow();
                row.insertCell(0).innerText = p.id_national || p.id_patient;
                row.insertCell(1).innerText = p.nom || '';
                row.insertCell(2).innerText = p.prenom || '';
                row.insertCell(3).innerText = p.telephone || '-';
                const actions = row.insertCell(4);
                actions.className = 'action-icons';
                actions.innerHTML = `
                    <i class="fa-solid fa-eye" data-id="${p.id_patient}" data-action="voir"></i>
                    <i class="fa-solid fa-trash" data-id="${p.id_patient}" data-action="supprimer"></i>
                `;
            });

            document.querySelectorAll('.action-icons i').forEach(icon => {
                icon.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = icon.dataset.id, action = icon.dataset.action;
                    if(action === 'voir') {
                        window.location.href = `medecin-dossier.html?id=${id}`;
                    } else if(action === 'supprimer') {
                        supprimerPatient(id);
                    }
                });
            });

            afficherPagination();
        }

        async function supprimerPatient(id) {
            if(!confirm('🗑️ Supprimer ce patient ?')) return;
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/patients?id_patient=eq.${id}`, {
                    method: 'DELETE',
                    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
                });
                alert('✅ Patient supprimé');
                chargerPatients();
            } catch(err) {
                alert('❌ Erreur lors de la suppression');
            }
        }

        function afficherPagination() {
            const total = Math.ceil(filtres.length/rowsPerPage);
            const div = document.getElementById('pagination');
            div.innerHTML = '';
            for(let i=1;i<=total;i++) {
                const btn = document.createElement('div');
                btn.className = `page-btn ${i===currentPage ? 'active' : ''}`;
                btn.innerText = i;
                btn.onclick = () => { currentPage = i; afficherPatients(); };
                div.appendChild(btn);
            }
        }

        window.filtrerPatients = function() {
            const nom = document.getElementById('searchNom').value.toLowerCase();
            const id = document.getElementById('searchId').value.toLowerCase();
            const tel = document.getElementById('searchTel').value.toLowerCase();
            filtres = patients.filter(p => 
                (nom === '' || (p.nom && p.nom.toLowerCase().includes(nom))) &&
                (id === '' || (p.id_national && p.id_national.toLowerCase().includes(id))) &&
                (tel === '' || (p.telephone && p.telephone.includes(tel)))
            );
            currentPage = 1;
            afficherPatients();
        };

        chargerPatients();
    </script>
</body>
</html>
