<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion des rendez-vous - MédiConnex</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .container { max-width: 1000px; margin: 40px auto; background: rgba(26,26,46,0.7); border-radius: 30px; padding: 30px; border: 2px solid #00d4ff33; backdrop-filter: blur(10px); }
        h1 { color: #00d4ff; text-align: center; margin-bottom: 30px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #00d4ff33; }
        th { color: #00d4ff; }
        .statut { padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; display: inline-block; }
        .statut-attente { background: #ffaa3322; color: #ffaa33; border: 1px solid #ffaa33; }
        .statut-confirme { background: #00d4ff22; color: #00d4ff; border: 1px solid #00d4ff; }
        .statut-termine { background: #00ff8822; color: #00ff88; border: 1px solid #00ff88; }
        select { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid #00d4ff33; border-radius: 8px; padding: 5px; cursor: pointer; }
        .btn-add { background: rgba(0,212,255,0.1); border: 2px solid #00d4ff; border-radius: 40px; padding: 10px 20px; color: #00d4ff; text-decoration: none; display: inline-block; margin-bottom: 20px; }
        .btn-add:hover { background: #00d4ff; color: #1a1a2e; }
        .back-link { color: #aaa; text-decoration: none; display: inline-block; margin-bottom: 20px; margin-right: 20px; }
    </style>
</head>
<body>
<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1><i class="fas fa-calendar-check"></i> Gestion des rendez-vous</h1>
        <div>
            <a href="medecin-dashboard.html" class="back-link"><i class="fas fa-arrow-left"></i> Retour</a>
            <a href="medecin-ajout-rendezvous.html" class="btn-add"><i class="fas fa-plus"></i> Nouveau rendez-vous</a>
        </div>
    </div>

    <div style="overflow-x: auto;">
        <table id="rdvTable">
            <thead>
                <tr><th>Patient</th><th>Date</th><th>Heure</th><th>Motif</th><th>Statut</th></tr>
            </thead>
            <tbody id="rdvBody">
                <tr><td colspan="5" style="text-align:center;">Chargement...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://uuhdpvtnfaycqemhrelo.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_C-QCOapZ_QY92foN_Q-VRw_3WSoCos7'; // ⚠️ Remplace par TA clé

    const medecin = JSON.parse(localStorage.getItem('medecin') || '{}');
    const medecinId = medecin.id_medecin || 1;

    async function chargerRendezVous() {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/rendez_vous?id_medecin=eq.${medecinId}&select=*,patients(nom,prenom)`, {
            headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
        });
        const rdvs = await res.json();
        const tbody = document.getElementById('rdvBody');
        if (!rdvs.length) {
            tbody.innerHTML = '<tr><td colspan="5">Aucun rendez-vous</td></tr>';
            return;
        }
        tbody.innerHTML = rdvs.map(rdv => `
            <tr>
                <td>${rdv.patients?.prenom || ''} ${rdv.patients?.nom || ''}</td>
                <td>${rdv.date_rdv?.slice(0,10) || ''}</td>
                <td>${rdv.date_rdv?.slice(11,16) || ''}</td>
                <td>${rdv.motif || '-'}</td>
                <td><select class="statut statut-${rdv.statut}" data-id="${rdv.id_rdv}" data-statut="${rdv.statut}" onchange="changerStatut(this)">
                    <option value="en_attente" ${rdv.statut === 'en_attente' ? 'selected' : ''}>⏳ En attente</option>
                    <option value="confirme" ${rdv.statut === 'confirme' ? 'selected' : ''}>✅ Confirmé</option>
                    <option value="termine" ${rdv.statut === 'termine' ? 'selected' : ''}>✔️ Terminé</option>
                </select></td>
            <tr>
        `).join('');
    }

    window.changerStatut = async function(select) {
        const newStatut = select.value;
        const rdvId = select.dataset.id;
        const oldStatut = select.dataset.statut;
        if (newStatut === oldStatut) return;

        const res = await fetch(`${SUPABASE_URL}/rest/v1/rendez_vous?id_rdv=eq.${rdvId}`, {
            method: 'PATCH',
            headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ statut: newStatut })
        });

        if (res.ok) {
            select.dataset.statut = newStatut;
            select.className = `statut statut-${newStatut}`;
            alert('Statut mis à jour');
        } else {
            alert('Erreur lors de la mise à jour');
        }
    };

    chargerRendezVous();
</script>
</body>
</html>
