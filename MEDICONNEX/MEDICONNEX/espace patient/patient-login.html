<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Patient - MédiConnex</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* Couleur patient (vert) */
        :root {
            --patient: #00ff88;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: url('https://images.pexels.com/photos/7579831/pexels-photo-7579831.jpeg?auto=compress&cs=tinysrgb&w=1600') center/cover no-repeat fixed;
            position: relative;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 0;
        }

        .auth-wrapper {
            position: relative;
            z-index: 1;
            border-color: var(--patient);
            box-shadow: 0 0 25px var(--patient);
        }

        .background-shape {
            background: linear-gradient(45deg, #1a1a2e, var(--patient));
        }

        .secondary-shape {
            border-top-color: var(--patient);
        }

        .field-wrapper input:focus,
        .field-wrapper input:valid {
            border-bottom-color: var(--patient);
        }

        .field-wrapper input:focus ~ label,
        .field-wrapper input:valid ~ label {
            color: var(--patient);
        }

        .field-wrapper input:focus ~ i,
        .field-wrapper input:valid ~ i {
            color: var(--patient);
        }

        .submit-button {
            border-color: var(--patient);
        }

        .submit-button::before {
            background: linear-gradient(#1a1a2e, var(--patient), #1a1a2e, var(--patient));
        }

        .submit-button:hover {
            background: var(--patient);
            color: #1a1a2e;
        }

        .welcome-section h2,
        .welcome-section p {
            color: var(--patient);
        }

        /* Message d'erreur */
        .error-message {
            color: #ff4444;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: var(--patient);
        }
        
        .success-message {
            color: #00ff88;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }
        
        /* ============================================ */
        /* AMÉLIORATION : MOT DE PASSE OUBLIÉ           */
        /* ============================================ */
        .forgot-password {
            text-align: right;
            margin-top: 8px;
            margin-bottom: 5px;
        }
        
        .forgot-password a {
            color: var(--patient);
            text-decoration: none;
            font-size: 12px;
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        
        .forgot-password a:hover {
            opacity: 1;
            text-decoration: underline;
        }
        
        /* Modal pour réinitialisation */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            border: 1px solid var(--patient);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
        }
        
        .modal-content h3 {
            color: var(--patient);
            margin-bottom: 20px;
            text-align: center;
        }
        
        .modal-content .field-wrapper {
            margin-bottom: 20px;
        }
        
        .modal-content input {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-bottom: 2px solid #333;
            padding: 12px;
            color: white;
            font-size: 14px;
            outline: none;
        }
        
        .modal-content input:focus {
            border-bottom-color: var(--patient);
        }
        
        .modal-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        
        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .modal-btn-confirm {
            background: var(--patient);
            border: none;
            color: #1a1a2e;
        }
        
        .modal-btn-confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.3);
        }
        
        .modal-btn-cancel {
            background: transparent;
            border: 1px solid #ff4444;
            color: #ff4444;
        }
        
        .modal-btn-cancel:hover {
            background: rgba(255, 68, 68, 0.1);
        }
        
        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: white;
        }
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <div class="background-shape"></div>
        <div class="secondary-shape"></div>

        <div class="credentials-panel signin">
            <h2 class="slide-element">Connexion Patient</h2>

            <form id="loginForm">
                <div class="field-wrapper slide-element">
                    <input type="email" id="email" required>
                    <label>Adresse email</label>
                    <i class="fa-solid fa-envelope"></i>
                </div>

                <div class="field-wrapper slide-element">
                    <input type="password" id="motDePasse" required>
                    <label>Mot de passe</label>
                    <i class="fa-solid fa-lock"></i>
                </div>
                
                <!-- AMÉLIORATION : Lien mot de passe oublié -->
                <div class="forgot-password slide-element">
                    <a href="javascript:void(0)" onclick="openResetModal()">Mot de passe oublié ?</a>
                </div>

                <div class="field-wrapper slide-element">
                    <button class="submit-button" type="submit">Se connecter</button>
                </div>
                
                <div class="error-message" id="errorMessage"></div>
                <div class="success-message" id="successMessage"></div>
                <div class="loading" id="loading">Connexion en cours...</div>
            </form>
        </div>

        <div class="welcome-section signin">
            <h2 class="slide-element">ESPACE PATIENT</h2>
            <p class="slide-element">Accès à votre dossier médical</p>
        </div>
    </div>
    
    <!-- MODAL : Mot de passe oublié -->
    <div id="resetModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeResetModal()">&times;</span>
            <h3><i class="fa-solid fa-key"></i> Réinitialisation</h3>
            <div class="field-wrapper">
                <input type="email" id="resetEmail" placeholder="Entrez votre email">
                <label>Email du compte</label>
            </div>
            <div class="field-wrapper">
                <input type="password" id="newPassword" placeholder="Nouveau mot de passe">
                <label>Nouveau mot de passe</label>
            </div>
            <div class="field-wrapper">
                <input type="password" id="confirmPassword" placeholder="Confirmer le mot de passe">
                <label>Confirmer</label>
            </div>
            <div class="modal-buttons">
                <button class="modal-btn-confirm" onclick="resetPassword()">Réinitialiser</button>
                <button class="modal-btn-cancel" onclick="closeResetModal()">Annuler</button>
            </div>
            <div id="resetMessage" style="color: #00ff88; text-align: center; margin-top: 15px; font-size: 12px; display: none;"></div>
            <div id="resetError" style="color: #ff4444; text-align: center; margin-top: 15px; font-size: 12px; display: none;"></div>
        </div>
    </div>
   <script>
   // Configuration Supabase
const SUPABASE_URL = 'https://uuhdpvtnfaycqemhrelo.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_C-QCOapZ_QY92foN_Q-VRw_3WSoCos7';

// Initialiser Supabase
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Gérer la connexion
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('email').value.trim();
    const motDePasse = document.getElementById('motDePasse').value;
    const errorDiv = document.getElementById('errorMessage');
    const successDiv = document.getElementById('successMessage');
    const loadingDiv = document.getElementById('loading');
    
    loadingDiv.style.display = 'block';
    errorDiv.style.display = 'none';
    successDiv.style.display = 'none';
    
    try {
        // CORRECTION : On utilise la vraie méthode d'authentification Supabase
        const { data, error: authError } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: motDePasse,
        });

        if (authError) throw authError;

        successDiv.textContent = `Connexion réussie ! Redirection...`;
        successDiv.style.display = 'block';
        
        setTimeout(() => {
            window.location.href = 'patient-dashboard.html';
        }, 1000);
        
    } catch (error) {
        errorDiv.textContent = "Erreur : " + error.message;
        errorDiv.style.display = 'block';
        loadingDiv.style.display = 'none';
    }
});

// Fonctions Mot de passe oublié (Inchangées pour le style, mais attention : 
// l'update manuel en base ne change pas le mot de passe du système Auth)
function openResetModal() {
    document.getElementById('resetModal').style.display = 'flex';
}

function closeResetModal() {
    document.getElementById('resetModal').style.display = 'none';
}

async function resetPassword() {
    // Gardez votre logique actuelle pour la démo, 
    // mais sachez que pour la vraie sécurité, on utilise supabase.auth.resetPasswordForEmail()
    alert("Fonctionnalité de réinitialisation à configurer dans Supabase Auth.");
}

window.onclick = function(event) {
    const modal = document.getElementById('resetModal');
    if (event.target === modal) closeResetModal();
}
 </script>
</body>
</html>
