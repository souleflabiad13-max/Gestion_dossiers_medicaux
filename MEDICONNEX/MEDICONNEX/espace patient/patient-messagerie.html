<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Messagerie | MediConnex</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #00ff88;
      --primary-dark: #00cc6a;
      --bg-main: #05070f;
      --bg-card: rgba(15, 23, 42, 0.7);
      --text-primary: #ffffff;
      --text-secondary: #94a3b8;
      --border: rgba(0, 255, 136, 0.2);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text-primary); }
    body::before {
      content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 20% 50%, rgba(0, 255, 136, 0.03) 0%, transparent 50%);
      pointer-events: none; z-index: 0;
    }
    .sidebar {
      position: fixed; left: 0; top: 0; width: 280px; height: 100%;
      background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(20px);
      padding: 30px 20px; border-right: 1px solid var(--border); z-index: 100;
    }
    .sidebar-header { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
    .sidebar-header i { font-size: 32px; color: var(--primary); }
    .sidebar-header h2 { font-size: 22px; font-weight: 700; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .sidebar nav ul { list-style: none; }
    .sidebar nav ul li { margin-bottom: 8px; }
    .sidebar nav ul li a {
      color: var(--text-secondary); text-decoration: none; display: flex; align-items: center; gap: 14px;
      padding: 12px 16px; border-radius: 14px; transition: all 0.3s; font-weight: 500; font-size: 14px;
    }
    .sidebar nav ul li a i { width: 22px; }
    .sidebar nav ul li a:hover { background: rgba(0, 255, 136, 0.1); color: var(--primary); transform: translateX(5px); }
    .sidebar nav ul li a.active { background: linear-gradient(135deg, rgba(0, 255, 136, 0.15), rgba(0, 255, 136, 0.05)); color: var(--primary); border-left: 3px solid var(--primary); }
    .main-content { margin-left: 280px; padding: 30px 40px; position: relative; z-index: 1; }
    .top-bar {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;
      padding: 15px 25px; background: var(--bg-card); backdrop-filter: blur(12px);
      border-radius: 24px; border: 1px solid var(--border);
    }
    .greeting h1 { font-size: 22px; font-weight: 600; }
    .greeting p { color: var(--text-secondary); font-size: 13px; }
    .btn-back { background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 10px 20px; border-radius: 14px; color: var(--text-secondary); cursor: pointer; transition: 0.3s; }
    .btn-back:hover { background: var(--primary); color: var(--bg-main); }
    .section-card {
      background: var(--bg-card); backdrop-filter: blur(12px); border-radius: 28px;
      padding: 25px 30px; border: 1px solid var(--border);
    }
    .section-header { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
    .section-header h3 { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .section-header h3 i { color: var(--primary); }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; color: var(--text-secondary); font-size: 13px; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; padding: 14px; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border);
      border-radius: 16px; color: white; font-size: 14px; transition: 0.3s;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
      outline: none; border-color: var(--primary); box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
    }
    .btn-send {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: var(--bg-main); border: none; padding: 14px 28px;
      border-radius: 16px; font-weight: 700; cursor: pointer; transition: 0.3s; width: 100%;
    }
    .btn-send:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0, 255, 136, 0.3); }
    .success-message { background: rgba(0, 255, 136, 0.1); border: 1px solid var(--primary); border-radius: 16px; padding: 12px; margin-top: 20px; text-align: center; color: var(--primary); display: none; }
    @media (max-width: 768px) { .sidebar { left: -280px; } .sidebar.open { left: 0; } .main-content { margin-left: 0; padding: 20px; } .menu-toggle { display: block; position: fixed; top: 15px; left: 15px; z-index: 101; background: var(--primary); border: none; padding: 12px; border-radius: 14px; color: var(--secondary); cursor: pointer; } }
    @media (min-width: 769px) { .menu-toggle { display: none; } }
  </style>
</head>
<body>

  <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-header"><i class="fas fa-heartbeat"></i><h2>MediConnex</h2></div>
    <nav>
      <ul>
        <li><a href="patient-dashboard.html"><i class="fas fa-tachometer-alt"></i> Tableau de bord</a></li>
        <li><a href="patient-rendezvous.html"><i class="fas fa-calendar-alt"></i> Mes rendez-vous</a></li>
        <li><a href="patient-dossier.html"><i class="fas fa-folder-medical"></i> Dossier médical</a></li>
        <li><a href="patient-consultations.html"><i class="fas fa-history"></i> Consultations</a></li>
        <li><a href="patient-profil.html"><i class="fas fa-user"></i> Mon profil</a></li>
        <li><a href="patient-messagerie.html" class="active"><i class="fas fa-comments"></i> Messagerie</a></li>
      </ul>
    </nav>
  </div>

  <div class="main-content">
    <div class="top-bar">
      <div class="greeting"><h1>Messagerie</h1><p>Contactez votre médecin</p></div>
      <button class="btn-back" onclick="window.location.href='patient-dashboard.html'"><i class="fas fa-arrow-left"></i> Retour</button>
    </div>

    <div class="section-card">
      <div class="section-header"><h3><i class="fas fa-envelope"></i> Nouveau message</h3></div>
      <form id="messageForm">
        <div class="form-group">
          <label><i class="fas fa-user-md"></i> Destinataire</label>
          <select id="medecinId" required>
            <option value="">Sélectionnez un médecin</option>
          </select>
        </div>
        <div class="form-group">
          <label><i class="fas fa-tag"></i> Sujet</label>
          <input type="text" id="sujet" placeholder="Ex: Question sur mon traitement" required>
        </div>
        <div class="form-group">
          <label><i class="fas fa-comment"></i> Message</label>
          <textarea id="message" rows="5" placeholder="Décrivez votre demande..." required></textarea>
        </div>
        <button type="submit" class="btn-send"><i class="fas fa-paper-plane"></i> Envoyer le message</button>
        <div id="successMessage" class="success-message"></div>
      </form>
    </div>
  </div>

  <script>
    const _supabase = supabase.createClient('https://uuhdpvtnfaycqemhrelo.supabase.co', 'sb_publishable_C-QCOapZ_QY92foN_Q-VRw_3WSoCos7');
    let currentPatient = null;

    async function loadMedecins() {
      const { data: medecins } = await _supabase.from('medecins').select('id_medecin, nom, prenom');
      const select = document.getElementById('medecinId');
      if (medecins) {
        select.innerHTML = '<option value="">Sélectionnez un médecin</option>' + 
          medecins.map(m => `<option value="${m.id_medecin}">Dr. ${m.prenom} ${m.nom}</option>`).join('');
      }
    }

    async function init() {
      const { data: { user } } = await _supabase.auth.getUser();
      if (!user) return window.location.href = 'patient-login.html';
      
      const { data: patient } = await _supabase.from('patients').select('id_patient, nom, prenom').eq('email', user.email).single();
      if (patient) currentPatient = patient;
      
      await loadMedecins();
    }

    document.getElementById('messageForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const medecinId = document.getElementById('medecinId').value;
      const sujet = document.getElementById('sujet').value;
      const message = document.getElementById('message').value;
      
      if (!medecinId || !sujet || !message) {
        alert('Veuillez remplir tous les champs');
        return;
      }
      
      // Stockage du message (vous pouvez créer une table messages si besoin)
      // Ici simulation d'envoi
      document.getElementById('successMessage').style.display = 'block';
      document.getElementById('successMessage').innerHTML = '<i class="fas fa-check-circle"></i> Message envoyé avec succès ! Votre médecin vous répondra dans les plus brefs délais.';
      document.getElementById('messageForm').reset();
      setTimeout(() => {
        document.getElementById('successMessage').style.display = 'none';
      }, 5000);
    });
    
    document.addEventListener('DOMContentLoaded', init);
    document.getElementById('menuToggle')?.addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));
  </script>
</body>
</html>
