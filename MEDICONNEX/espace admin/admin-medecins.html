<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des médecins - MédiConnex</title>
    <link rel="stylesheet" href="style-admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="check-session.js"></script>
    <style>
        :root {
            --admin: #ffaa33;
            --admin-light: rgba(255,170,51,0.2);
            --admin-dark: #cc8800;
        }

        .gestion-wrapper {
            display: flex;
            width: 100%;
            max-width: 1400px;
            min-height: 90vh;
            background: rgba(26,26,46,0.7);
            border: 2px solid var(--admin);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            overflow: hidden;
            box-shadow: 0 0 50px var(--admin);
        }

        .sidebar {
            width: 280px;
            background: rgba(0,0,0,0.3);
            border-right: 2px solid var(--admin);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 40px;
            padding: 0 10px;
        }

        .sidebar-logo i {
            font-size: 2.5rem;
            color: var(--admin);
            filter: drop-shadow(0 0 10px var(--admin));
        }

        .sidebar-logo span {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--admin);
            letter-spacing: 2px;
        }

        .sidebar-menu {
            list-style: none;
            flex: 1;
        }

        .sidebar-menu li {
            margin-bottom: 8px;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 20px;
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            transition: 0.3s;
            font-size: 0.95rem;
        }

        .sidebar-menu a i {
            width: 25px;
            color: var(--admin);
            font-size: 1.2rem;
        }

        .sidebar-menu a:hover, .sidebar-menu .active a {
            background: var(--admin-light);
            border-left: 4px solid var(--admin);
            color: var(--admin);
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid var(--admin);
        }

        .sidebar-footer a {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 20px;
            color: #ff3366;
            text-decoration: none;
            transition: 0.3s;
            cursor: pointer;
        }

        .sidebar-footer a:hover {
            background: rgba(255,51,102,0.1);
            border-left: 4px solid #ff3366;
        }

        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .page-header h1 {
            color: var(--admin);
            font-size: 2rem;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-stats {
            display: flex;
            gap: 20px;
            background: rgba(0,0,0,0.2);
            padding: 10px 20px;
            border-radius: 40px;
            border: 1px solid var(--admin);
        }

        .header-stat {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #aaa;
            font-size: 0.9rem;
        }

        .header-stat span {
            color: var(--admin);
            font-weight: 700;
            font-size: 1.1rem;
        }

        .btn-add {
            background: rgba(0,0,0,0.2);
            border: 2px solid var(--admin);
            border-radius: 40px;
            padding: 12px 25px;
            color: var(--admin);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }

        .btn-add:hover {
            background: var(--admin);
            color: #1a1a2e;
            box-shadow: 0 0 30px var(--admin);
            transform: translateY(-2px);
        }

        .search-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .search-wrapper {
            flex: 1;
            position: relative;
        }

        .search-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--admin);
        }

        .search-wrapper input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--admin);
            border-radius: 40px;
            color: #fff;
            font-size: 1rem;
            transition: 0.3s;
        }

        .search-wrapper input:focus {
            outline: none;
            border-color: var(--admin);
            box-shadow: 0 0 15px var(--admin);
            background: rgba(255,255,255,0.1);
        }

        .filter-group {
            display: flex;
            gap: 10px;
        }

        .filter-group select {
            padding: 14px 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--admin);
            border-radius: 40px;
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-refresh {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--admin);
            border-radius: 40px;
            padding: 0 20px;
            color: var(--admin);
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-refresh:hover {
            background: var(--admin);
            color: #1a1a2e;
        }

        .table-container {
            overflow-x: auto;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--admin);
            border-radius: 15px;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            color: var(--admin);
            padding: 15px 10px;
            text-align: left;
            border-bottom: 2px solid var(--admin);
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        th:hover {
            color: #ffcc66;
        }

        th i {
            margin-left: 5px;
            font-size: 0.8rem;
            opacity: 0.6;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid rgba(255,170,51,0.2);
            transition: 0.3s;
            color: #fff;
        }

        tr:hover td {
            background: var(--admin-light);
        }

        .badge-specialite {
            background: rgba(255,170,51,0.15);
            color: var(--admin);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            border: 1px solid var(--admin);
            display: inline-block;
        }

        .action-icons {
            display: flex;
            gap: 15px;
        }

        .action-icons i {
            color: #aaa;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1.1rem;
            padding: 5px;
            border-radius: 50%;
        }

        .action-icons i:hover {
            transform: scale(1.1);
        }

        .action-icons .fa-eye:hover {
            color: #00d4ff;
            background: rgba(0,212,255,0.2);
        }

        .action-icons .fa-pen:hover {
            color: var(--admin);
            background: var(--admin-light);
        }

        .action-icons .fa-trash:hover {
            color: #ff3366;
            background: rgba(255,51,102,0.2);
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .page-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--admin);
            border-radius: 50%;
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
        }

        .page-btn.active {
            background: var(--admin-light);
            border-color: var(--admin);
            color: var(--admin);
            box-shadow: 0 0 10px var(--admin);
        }

        .page-btn:hover:not(.active) {
            border-color: var(--admin);
            transform: translateY(-2px);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: linear-gradient(145deg, #16213e, #1a1a2e);
            border: 2px solid var(--admin);
            border-radius: 30px;
            padding: 30px;
            width: 90%;
            max-width: 550px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: var(--admin);
        }

        .close-modal {
            color: #aaa;
            font-size: 2rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .close-modal:hover {
            color: #ff3366;
            transform: rotate(90deg);
        }

        .modal-field {
            margin-bottom: 20px;
        }

        .modal-field label {
            color: var(--admin);
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .modal-field input, .modal-field select {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--admin);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
        }

        .modal-actions {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            border: 2px solid;
            background: transparent;
            transition: 0.3s;
        }

        .modal-btn.save {
            border-color: var(--admin);
            color: var(--admin);
        }

        .modal-btn.save:hover {
            background: var(--admin);
            color: #1a1a2e;
            box-shadow: 0 0 20px var(--admin);
        }

        .modal-btn.cancel {
            border-color: #ff3366;
            color: #ff3366;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 15px 25px;
            border-radius: 10px;
            font-weight: 600;
            z-index: 1100;
            animation: slideInRight 0.3s ease;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .toast.success { background: #00ff88; color: #1a1a2e; }
        .toast.error { background: #ff3366; color: white; }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: var(--admin);
        }

        .loading-spinner i {
            font-size: 2rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: #aaa;
        }

        .empty-state i {
            font-size: 4rem;
            color: var(--admin);
            margin-bottom: 15px;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .gestion-wrapper { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 2px solid var(--admin); }
            .page-header { flex-direction: column; align-items: flex-start; }
            .header-stats { width: 100%; justify-content: center; }
            .search-bar { flex-direction: column; }
            .filter-group { justify-content: space-between; }
        }
    </style>
</head>
<body>
    <div class="gestion-wrapper">
        <div class="sidebar">
            <div class="sidebar-logo">
                <i class="fa-solid fa-hospital-user"></i>
                <span>MédiConnex</span>
            </div>
            <ul class="sidebar-menu">
                <li><a href="admin-dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
                <li class="active"><a href="admin-medecins.html"><i class="fa-solid fa-user-md"></i> Médecins</a></li>
                <li><a href="admin-hopitaux.html"><i class="fa-solid fa-hospital"></i> Hôpitaux</a></li>
                <li><a href="admin-specialites.html"><i class="fa-solid fa-stethoscope"></i> Spécialités</a></li>
                <li><a href="admin-patients.html"><i class="fa-solid fa-users"></i> Patients</a></li>
                <li><a href="admin-statistiques.html"><i class="fa-solid fa-chart-line"></i> Statistiques</a></li>
                <li><a href="admin-logs.html"><i class="fa-solid fa-history"></i> Logs</a></li>
                <li><a href="admin-profil.html"><i class="fa-solid fa-user-cog"></i> Profil</a></li>
            </ul>
            <div class="sidebar-footer">
                <a onclick="logout()"><i class="fa-solid fa-sign-out-alt"></i> Déconnexion</a>
            </div>
        </div>

        <div class="main-content">
            <div class="page-header">
                <h1><i class="fa-solid fa-user-md"></i> Gestion des médecins</h1>
                <div class="header-stats">
                    <div class="header-stat"><i class="fa-solid fa-users"></i> Total: <span id="totalMedecins">0</span></div>
                    <div class="header-stat"><i class="fa-solid fa-stethoscope"></i> Spécialités: <span id="totalSpecialites">0</span></div>
                </div>
                <a href="admin-ajout-medecin.html" class="btn-add"><i class="fa-solid fa-plus"></i> Ajouter un médecin</a>
            </div>

            <div class="search-bar">
                <div class="search-wrapper">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Rechercher par nom, prénom, spécialité ou hôpital...">
                </div>
                <div class="filter-group">
                    <select id="filterSpecialite"><option value="">Toutes les spécialités</option></select>
                    <select id="filterHopital"><option value="">Tous les hôpitaux</option></select>
                    <button class="btn-refresh" onclick="rafraichirDonnees()"><i class="fa-solid fa-rotate-right"></i></button>
                </div>
            </div>

            <div class="table-container">
                <table id="medecinsTable">
                    <thead>
                        <tr><th onclick="trierPar('id_medecin')">ID <i class="fa-solid fa-sort"></i></th>
                            <th onclick="trierPar('nom')">Nom <i class="fa-solid fa-sort"></i></th>
                            <th onclick="trierPar('prenom')">Prénom <i class="fa-solid fa-sort"></i></th>
                            <th onclick="trierPar('specialite')">Spécialité <i class="fa-solid fa-sort"></i></th>
                            <th onclick="trierPar('hopital')">Hôpital <i class="fa-solid fa-sort"></i></th>
                            <th onclick="trierPar('wilaya')">Wilaya <i class="fa-solid fa-sort"></i></th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="medecinsBody"><tr><td colspan="7" class="loading-spinner"><i class="fa-solid fa-spinner fa-spin"></i> Chargement...</td></tr></tbody>
                </table>
            </div>
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <div id="modalModif" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h2><i class="fa-solid fa-pen"></i> Modifier médecin</h2><span class="close-modal" onclick="fermerModal()">&times;</span></div>
            <input type="hidden" id="editId">
            <div class="modal-field"><label>Nom</label><input type="text" id="editNom"></div>
            <div class="modal-field"><label>Prénom</label><input type="text" id="editPrenom"></div>
            <div class="modal-field"><label>Spécialité</label><select id="editSpecialite"></select></div>
            <div class="modal-field"><label>Hôpital</label><select id="editHopital"></select></div>
            <div class="modal-field"><label>Wilaya</label><select id="editWilaya"></select></div>
            <div class="modal-actions"><button class="modal-btn save" onclick="enregistrerModification()">Enregistrer</button><button class="modal-btn cancel" onclick="fermerModal()">Annuler</button></div>
        </div>
    </div>

    <script>
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let tousMedecins = [], medecinsFiltres = [], currentPage = 1, rowsPerPage = 10, triColonne = 'nom', triOrdre = 'asc';
        let specialitesMap = new Map(), hopitauxMap = new Map(), wilayasMap = new Map(), specialitesList = [], hopitauxList = [], wilayasList = [];

        async function chargerReferences() {
            const [specialites, hopitaux, wilayas] = await Promise.all([
                supabaseClient.from('specialites').select('id_specialite, nom_specialite'),
                supabaseClient.from('hopitaux').select('id_hopital, nom_hopital'),
                supabaseClient.from('wilayas').select('id_wilaya, nom_wilaya')
            ]);
            specialites.data?.forEach(s => { specialitesMap.set(s.id_specialite, s.nom_specialite); specialitesList.push({ id: s.id_specialite, nom: s.nom_specialite }); });
            hopitaux.data?.forEach(h => { hopitauxMap.set(h.id_hopital, h.nom_hopital); hopitauxList.push({ id: h.id_hopital, nom: h.nom_hopital }); });
            wilayas.data?.forEach(w => { wilayasMap.set(w.id_wilaya, w.nom_wilaya); wilayasList.push({ id: w.id_wilaya, nom: w.nom_wilaya }); });
            
            const filterSpec = document.getElementById('filterSpecialite'), filterHop = document.getElementById('filterHopital');
            filterSpec.innerHTML = '<option value="">Toutes les spécialités</option>';
            filterHop.innerHTML = '<option value="">Tous les hôpitaux</option>';
            specialitesList.forEach(s => filterSpec.innerHTML += `<option value="${s.id}">${s.nom}</option>`);
            hopitauxList.forEach(h => filterHop.innerHTML += `<option value="${h.id}">${h.nom}</option>`);
        }

        async function chargerMedecins() {
            document.getElementById('medecinsBody').innerHTML = '<tr><td colspan="7" class="loading-spinner"><i class="fa-solid fa-spinner fa-spin"></i> Chargement...</td></tr>';
            const { data: medecins, error } = await supabaseClient.from('medecins').select('*').order('nom', { ascending: true });
            if (error) { document.getElementById('medecinsBody').innerHTML = `<tr><td colspan="7">❌ Erreur: ${error.message}</td></tr>`; return; }
            tousMedecins = medecins.map(m => ({ ...m, specialite_nom: specialitesMap.get(m.id_specialite) || 'Non renseignée', hopital_nom: hopitauxMap.get(m.id_hopital) || 'Non renseigné', wilaya_nom: wilayasMap.get(m.id_wilaya) || 'Non renseignée' }));
            document.getElementById('totalMedecins').innerText = tousMedecins.length;
            document.getElementById('totalSpecialites').innerText = specialitesList.length;
            appliquerFiltres();
        }

        function appliquerFiltres() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filterSpec = document.getElementById('filterSpecialite').value, filterHop = document.getElementById('filterHopital').value;
            medecinsFiltres = tousMedecins.filter(m => {
                const matchSearch = !searchTerm || m.nom?.toLowerCase().includes(searchTerm) || m.prenom?.toLowerCase().includes(searchTerm) || m.specialite_nom?.toLowerCase().includes(searchTerm) || m.hopital_nom?.toLowerCase().includes(searchTerm);
                const matchSpec = !filterSpec || m.id_specialite == filterSpec;
                const matchHop = !filterHop || m.id_hopital == filterHop;
                return matchSearch && matchSpec && matchHop;
            });
            trierMedecins();
        }

        function trierMedecins() {
            medecinsFiltres.sort((a, b) => {
                let valA = a[triColonne] || a[triColonne + '_nom'] || '', valB = b[triColonne] || b[triColonne + '_nom'] || '';
                if (typeof valA === 'number') return triOrdre === 'asc' ? valA - valB : valB - valA;
                return triOrdre === 'asc' ? String(valA).localeCompare(String(valB)) : String(valB).localeCompare(String(valA));
            });
            currentPage = 1; afficherPage();
        }

        function trierPar(colonne) { if (triColonne === colonne) triOrdre = triOrdre === 'asc' ? 'desc' : 'asc'; else { triColonne = colonne; triOrdre = 'asc'; } trierMedecins(); }

        function afficherPage() {
            const start = (currentPage - 1) * rowsPerPage, end = start + rowsPerPage, medecinsPage = medecinsFiltres.slice(start, end);
            const tbody = document.getElementById('medecinsBody');
            if (medecinsPage.length === 0) { tbody.innerHTML = '<tr><td colspan="7" class="empty-state"><i class="fa-solid fa-user-slash"></i><p>Aucun médecin trouvé</p></td></tr>'; document.getElementById('pagination').innerHTML = ''; return; }
            tbody.innerHTML = '';
            medecinsPage.forEach(m => { tbody.innerHTML += `<tr><td>${m.id_medecin}</td><td><strong>${m.nom || '-'}</strong></td><td>${m.prenom || '-'}</td><td><span class="badge-specialite">${m.specialite_nom}</span></td><td>${m.hopital_nom}</td><td>${m.wilaya_nom}</td><td class="action-icons"><i class="fa-solid fa-eye" onclick="voirMedecin(${m.id_medecin})"></i><i class="fa-solid fa-pen" onclick="ouvrirModal(${m.id_medecin})"></i><i class="fa-solid fa-trash" onclick="supprimerMedecin(${m.id_medecin})"></i></td></tr>`; });
            afficherPagination();
        }

        function afficherPagination() {
            const totalPages = Math.ceil(medecinsFiltres.length / rowsPerPage);
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';
            if (totalPages <= 1) return;
            if (currentPage > 1) pagination.innerHTML += `<div class="page-btn" onclick="changerPage(${currentPage - 1})"><i class="fa-solid fa-chevron-left"></i></div>`;
            for (let i = 1; i <= Math.min(totalPages, 5); i++) pagination.innerHTML += `<div class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changerPage(${i})">${i}</div>`;
            if (currentPage < totalPages) pagination.innerHTML += `<div class="page-btn" onclick="changerPage(${currentPage + 1})"><i class="fa-solid fa-chevron-right"></i></div>`;
        }

        function changerPage(page) { currentPage = page; afficherPage(); }
        function rafraichirDonnees() { chargerMedecins(); showToast('Données actualisées', 'success'); }
        function voirMedecin(id) { const m = tousMedecins.find(m => m.id_medecin === id); if (m) alert(`👨‍⚕️ Médecin: ${m.prenom} ${m.nom}\n🏥 Hôpital: ${m.hopital_nom}\n📋 Spécialité: ${m.specialite_nom}\n📍 Wilaya: ${m.wilaya_nom}`); }
        async function supprimerMedecin(id) { if (confirm('🗑️ Supprimer ce médecin ?')) { const { error } = await supabaseClient.from('medecins').delete().eq('id_medecin', id); if (error) showToast('Erreur lors de la suppression', 'error'); else { showToast('Médecin supprimé', 'success'); chargerMedecins(); } } }
        async function ouvrirModal(id) {
            const m = tousMedecins.find(m => m.id_medecin === id); if (!m) return;
            document.getElementById('editId').value = m.id_medecin;
            document.getElementById('editNom').value = m.nom || '';
            document.getElementById('editPrenom').value = m.prenom || '';
            const selectSpec = document.getElementById('editSpecialite'), selectHop = document.getElementById('editHopital'), selectWil = document.getElementById('editWilaya');
            selectSpec.innerHTML = ''; selectHop.innerHTML = ''; selectWil.innerHTML = '';
            specialitesList.forEach(s => selectSpec.innerHTML += `<option value="${s.id}" ${m.id_specialite === s.id ? 'selected' : ''}>${s.nom}</option>`);
            hopitauxList.forEach(h => selectHop.innerHTML += `<option value="${h.id}" ${m.id_hopital === h.id ? 'selected' : ''}>${h.nom}</option>`);
            wilayasList.forEach(w => selectWil.innerHTML += `<option value="${w.id}" ${m.id_wilaya === w.id ? 'selected' : ''}>${w.nom}</option>`);
            document.getElementById('modalModif').style.display = 'flex';
        }
        function fermerModal() { document.getElementById('modalModif').style.display = 'none'; }
        async function enregistrerModification() {
            const id = document.getElementById('editId').value;
            const data = { nom: document.getElementById('editNom').value, prenom: document.getElementById('editPrenom').value, id_specialite: parseInt(document.getElementById('editSpecialite').value), id_hopital: parseInt(document.getElementById('editHopital').value), id_wilaya: parseInt(document.getElementById('editWilaya').value) };
            const { error } = await supabaseClient.from('medecins').update(data).eq('id_medecin', id);
            if (error) showToast('Erreur lors de la modification', 'error');
            else { showToast('Médecin modifié', 'success'); fermerModal(); chargerMedecins(); }
        }

        document.getElementById('searchInput').addEventListener('input', () => appliquerFiltres());
        document.getElementById('filterSpecialite').addEventListener('change', () => appliquerFiltres());
        document.getElementById('filterHopital').addEventListener('change', () => appliquerFiltres());
        window.onclick = function(event) { if (event.target.classList.contains('modal')) event.target.style.display = 'none'; };

        async function init() { await chargerReferences(); await chargerMedecins(); }
        init();
    </script>
</body>
</html>
