<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un patient - MédiConnex</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-image: url('https://images.pexels.com/photos/5327656/pexels-photo-5327656.jpeg?auto=compress&cs=tinysrgb&w=1600');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
            min-height: 100vh;
            padding: 30px;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 7, 15, 0.75);
            z-index: 0;
        }
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }
        .bg-glow .glow-1 {
            position: absolute;
            top: 20%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.15), transparent);
            border-radius: 50%;
            animation: floatGlow 20s infinite ease-in-out;
        }
        .bg-glow .glow-2 {
            position: absolute;
            bottom: 10%;
            right: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 100, 255, 0.1), transparent);
            border-radius: 50%;
            animation: floatGlow 25s infinite ease-in-out reverse;
        }
        @keyframes floatGlow {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, -50px) scale(1.1); }
            66% { transform: translate(-30px, 40px) scale(0.9); }
        }

        .form-container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(15px);
            border-radius: 32px;
            padding: 35px;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .form-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }
        .form-header h1 {
            color: #00d4ff;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .patient-id {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid #00d4ff;
            border-radius: 40px;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .patient-id strong { color: #00d4ff; font-size: 1.1rem; letter-spacing: 1px; }
        .back-link { color: #94a3b8; text-decoration: none; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .back-link:hover { color: #00d4ff; }

        .doctor-context {
            background: rgba(0, 212, 255, 0.05);
            border-left: 4px solid #00d4ff;
            padding: 15px 20px;
            border-radius: 16px;
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
        }
        .doctor-info { display: flex; align-items: center; gap: 15px; }
        .doctor-avatar {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .doctor-avatar i { font-size: 1.5rem; color: #0a0c10; }
        .doctor-text h3 { color: #00d4ff; font-size: 1rem; }
        .doctor-text p { color: #94a3b8; font-size: 0.8rem; }

        .form-section {
            background: rgba(0, 212, 255, 0.03);
            border: 1px solid rgba(0, 212, 255, 0.15);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .section-title {
            color: #00d4ff;
            font-size: 1.1rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        .form-group.full-width { grid-column: span 2; }
        .form-group label {
            display: block;
            color: #00d4ff;
            font-size: 0.8rem;
            margin-bottom: 6px;
        }
        .input-wrapper { position: relative; }
        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #00d4ff99;
        }
        .input-wrapper input, .input-wrapper select, .input-wrapper textarea {
            width: 100%;
            padding: 12px 12px 12px 42px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 14px;
            color: #fff;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .input-wrapper input:focus, .input-wrapper select:focus, .input-wrapper textarea:focus {
            outline: none;
            border-color: #00d4ff;
        }
        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }
        .checkbox-item {
            background: rgba(0, 212, 255, 0.03);
            padding: 10px 15px;
            border-radius: 12px;
            border: 1px solid rgba(0, 212, 255, 0.15);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .upload-area {
            border: 2px dashed rgba(0, 212, 255, 0.3);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .upload-area:hover { border-color: #00d4ff; background: rgba(0, 212, 255, 0.05); }
        .upload-area i { font-size: 2.5rem; color: #00d4ff; margin-bottom: 10px; }
        .file-list { margin-top: 15px; }
        .file-item {
            background: rgba(0, 212, 255, 0.05);
            border-radius: 10px;
            padding: 10px 15px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 25px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            border: none;
            border-radius: 40px;
            padding: 12px 35px;
            color: #0a0c10;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0, 212, 255, 0.3); }
        .btn-secondary {
            background: transparent;
            border: 1px solid #ef4444;
            border-radius: 40px;
            padding: 12px 35px;
            color: #ef4444;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-secondary:hover { background: rgba(239, 68, 68, 0.1); }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 12px 20px;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.95);
            border-left: 4px solid #00ff88;
            z-index: 1100;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        @media (max-width: 768px) {
            .form-container { padding: 20px; }
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full-width { grid-column: span 1; }
            .form-actions { flex-direction: column; }
            .btn-primary, .btn-secondary { width: 100%; text-align: center; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="bg-glow"><div class="glow-1"></div><div class="glow-2"></div></div>

    <div class="form-container">
        <div class="form-header">
            <h1><i class="fa-solid fa-user-plus"></i> Nouveau patient</h1>
            <div class="patient-id">
                <span>ID National:</span>
                <strong id="patientId">DZ-25-03-001</strong>
                <i class="fa-solid fa-copy" style="color: #00d4ff; cursor: pointer;" onclick="copierId()"></i>
            </div>
            <a href="medecin-patients.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Retour</a>
        </div>

        <div class="doctor-context">
            <div class="doctor-info">
                <div class="doctor-avatar"><i class="fa-solid fa-user-md"></i></div>
                <div class="doctor-text">
                    <h3 id="doctorName">Dr. Ahmed Benali</h3>
                    <p id="doctorSpecialite">Cardiologie</p>
                </div>
            </div>
            <div class="context-badge" style="background: rgba(0,212,255,0.1); padding: 6px 15px; border-radius: 30px; color:#00d4ff;">
                <i class="fa-solid fa-shield"></i> Création dossier patient
            </div>
        </div>

        <form id="ajoutPatientForm">
            <!-- Informations personnelles -->
            <div class="form-section">
                <div class="section-title"><i class="fa-solid fa-user"></i> Informations personnelles</div>
                <div class="form-grid">
                    <div class="form-group"><label>Nom *</label><div class="input-wrapper"><i class="fa-solid fa-user"></i><input type="text" id="nom" placeholder="Benali" required></div></div>
                    <div class="form-group"><label>Prénom *</label><div class="input-wrapper"><i class="fa-solid fa-user"></i><input type="text" id="prenom" placeholder="Sarah" required></div></div>
                    <div class="form-group"><label>Date de naissance</label><div class="input-wrapper"><i class="fa-solid fa-calendar"></i><input type="date" id="dateNaissance"></div></div>
                    <div class="form-group"><label>Genre</label><div class="input-wrapper"><i class="fa-solid fa-venus-mars"></i><select id="genre"><option value="">Sélectionner</option><option value="F">Féminin</option><option value="M">Masculin</option></select></div></div>
                    <div class="form-group"><label>Téléphone</label><div class="input-wrapper"><i class="fa-solid fa-phone"></i><input type="tel" id="telephone" placeholder="0550 12 34 56"></div></div>
                    <div class="form-group"><label>Email *</label><div class="input-wrapper"><i class="fa-solid fa-envelope"></i><input type="email" id="email" placeholder="patient@email.com" required></div></div>
                    <div class="form-group full-width"><label>Adresse</label><div class="input-wrapper"><i class="fa-solid fa-location-dot"></i><input type="text" id="adresse" placeholder="Adresse complète"></div></div>
                    <div class="form-group"><label>Wilaya</label><div class="input-wrapper"><i class="fa-solid fa-map"></i><select id="wilaya"><option value="">Sélectionner</option></select></div></div>
                </div>
            </div>

            <!-- Informations médicales -->
            <div class="form-section">
                <div class="section-title"><i class="fa-solid fa-heart-pulse"></i> Informations médicales</div>
                <div class="form-grid">
                    <div class="form-group"><label>Groupe sanguin</label><div class="input-wrapper"><i class="fa-solid fa-droplet"></i><select id="groupeSanguin"><option value="">Non spécifié</option><option value="A+">A+</option><option value="A-">A-</option><option value="B+">B+</option><option value="B-">B-</option><option value="O+">O+</option><option value="O-">O-</option></select></div></div>
                    <div class="form-group"><label>Taille (cm)</label><div class="input-wrapper"><i class="fa-solid fa-ruler"></i><input type="number" id="taille" placeholder="168"></div></div>
                    <div class="form-group"><label>Poids (kg)</label><div class="input-wrapper"><i class="fa-solid fa-weight-scale"></i><input type="number" id="poids" placeholder="70"></div></div>
                    <div class="form-group"><label>Médecin traitant</label><div class="input-wrapper"><i class="fa-solid fa-user-md"></i><input type="text" id="medecinTraitant" readonly></div></div>
                </div>
            </div>

            <!-- Antécédents -->
            <div class="form-section">
                <div class="section-title"><i class="fa-solid fa-notes-medical"></i> Antécédents</div>
                <div class="checkbox-grid">
                    <div class="checkbox-item"><input type="checkbox" id="diabete"><label>Diabète</label></div>
                    <div class="checkbox-item"><input type="checkbox" id="hypertension"><label>Hypertension</label></div>
                    <div class="checkbox-item"><input type="checkbox" id="asthme"><label>Asthme</label></div>
                    <div class="checkbox-item"><input type="checkbox" id="cardiaque"><label>Cardiaque</label></div>
                </div>
                <div class="form-group full-width"><label>Autres</label><div class="input-wrapper"><i class="fa-solid fa-pen"></i><textarea id="autresAntecedents" rows="2" placeholder="Informations complémentaires..."></textarea></div></div>
            </div>

            <!-- Allergies -->
            <div class="form-section">
                <div class="section-title"><i class="fa-solid fa-triangle-exclamation"></i> Allergies</div>
                <div class="checkbox-grid">
                    <div class="checkbox-item"><input type="checkbox" id="allergieMedicament"><label>Médicaments</label></div>
                    <div class="checkbox-item"><input type="checkbox" id="allergieAliment"><label>Aliments</label></div>
                    <div class="checkbox-item"><input type="checkbox" id="allergiePollens"><label>Pollens</label></div>
                    <div class="checkbox-item"><input type="checkbox" id="allergieAnimaux"><label>Animaux</label></div>
                </div>
                <div class="form-group full-width"><label>Détail</label><div class="input-wrapper"><i class="fa-solid fa-pen"></i><textarea id="detailAllergies" rows="2" placeholder="Ex: Pénicilline, Arachides..."></textarea></div></div>
            </div>

            <!-- Upload documents -->
            <div class="form-section">
                <div class="section-title"><i class="fa-solid fa-file-upload"></i> Documents médicaux</div>
                <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                    <i class="fa-solid fa-cloud-upload-alt"></i>
                    <p>Cliquez pour uploader des fichiers</p>
                    <p style="font-size: 12px; opacity:0.7;">PDF, JPG, PNG</p>
                </div>
                <input type="file" id="fileInput" multiple style="display: none;" accept=".pdf,.jpg,.jpeg,.png" onchange="ajouterFichiers(this)">
                <div class="file-list" id="fileList"></div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-secondary" onclick="window.location.href='medecin-patients.html'">Annuler</button>
                <button type="submit" class="btn-primary" id="submitBtn">Enregistrer</button>
            </div>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://uuhdpvtnfaycqemhrelo.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_C-QCOapZ_QY92foN_Q-VRw_3WSoCos7';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const medecin = JSON.parse(localStorage.getItem('medecin') || '{}');
        const medecinId = medecin.id_medecin || 1;

        if (medecin.nom) {
            document.getElementById('doctorName').innerText = `Dr. ${medecin.prenom || ''} ${medecin.nom || 'Médecin'}`;
            document.getElementById('doctorSpecialite').innerText = medecin.specialite || 'Médecin généraliste';
            document.getElementById('medecinTraitant').value = `Dr. ${medecin.prenom || ''} ${medecin.nom || 'Médecin'}`;
        }

        let fichiers = [];

        function showToast(message, type = 'success') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}" style="color:#00d4ff"></i> ${message}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        function genererIdNational() {
            const date = new Date();
            const annee = date.getFullYear().toString().slice(-2);
            const mois = (date.getMonth() + 1).toString().padStart(2, '0');
            const random = Math.floor(Math.random() * 1000).toString().padStart(3, '0');
            return `DZ-${annee}${mois}-${random}`;
        }

        document.getElementById('patientId').textContent = genererIdNational();
        window.copierId = () => { navigator.clipboard.writeText(document.getElementById('patientId').textContent); showToast('ID copié !', 'info'); };

        window.ajouterFichiers = function(input) {
            const fileList = document.getElementById('fileList');
            for (let i = 0; i < input.files.length; i++) {
                const file = input.files[i];
                fichiers.push(file);
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.innerHTML = `<span><i class="fas fa-file"></i> ${file.name}</span><i class="fas fa-trash" style="color:#ef4444; cursor:pointer;" onclick="this.parentElement.remove(); fichiers = fichiers.filter(f => f.name !== '${file.name}')"></i>`;
                fileList.appendChild(fileItem);
            }
        };

        async function uploadFilesToSupabase(patientId) {
            if (fichiers.length === 0) return [];
            const uploadedFiles = [];
            for (const file of fichiers) {
                const fileName = `${patientId}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.-]/g, '_')}`;
                const { error: uploadError } = await supabaseClient.storage.from('documents').upload(fileName, file);
                if (uploadError) continue;
                const { data: publicUrlData } = supabaseClient.storage.from('documents').getPublicUrl(fileName);
                await supabaseClient.from('documents').insert({
                    id_patient: patientId,
                    nom_fichier: file.name,
                    url: publicUrlData.publicUrl,
                    type_document: file.type.includes('pdf') ? 'PDF' : 'IMAGE',
                    date_upload: new Date().toISOString()
                });
                uploadedFiles.push(file.name);
            }
            return uploadedFiles;
        }

        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        document.getElementById('ajoutPatientForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nom = document.getElementById('nom').value.trim();
            const prenom = document.getElementById('prenom').value.trim();
            const email = document.getElementById('email').value.trim();
            if (!nom || !prenom || !email) { showToast('❌ Nom, prénom et email requis', 'error'); return; }

            const patientId = document.getElementById('patientId').textContent;
            const hashedPassword = await hashPassword(patientId);
            const patientData = {
                id_national: patientId, nom, prenom, email, telephone: document.getElementById('telephone').value.trim() || null,
                date_naissance: document.getElementById('dateNaissance').value || null, sexe: document.getElementById('genre').value || null,
                adresse: document.getElementById('adresse').value.trim() || null, groupe_sanguin: document.getElementById('groupeSanguin').value || null,
                allergies: document.getElementById('detailAllergies').value || null, maladies_chroniques: document.getElementById('autresAntecedents').value || null,
                mot_de_passe: hashedPassword, id_medecin_traitant: medecinId, date_creation: new Date().toISOString()
            };

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enregistrement...';

            try {
                const { data, error } = await supabaseClient.from('patients').insert([patientData]).select();
                if (error) throw error;
                const newPatientId = data?.[0]?.id_patient;
                let uploadedCount = 0;
                if (fichiers.length > 0 && newPatientId) uploadedCount = (await uploadFilesToSupabase(newPatientId)).length;
                showToast(`✅ Patient ajouté avec ${uploadedCount} document(s)`, 'success');
                setTimeout(() => { window.location.href = 'medecin-patients.html'; }, 2000);
            } catch (error) { showToast('❌ Erreur: ' + error.message, 'error'); submitBtn.disabled = false; submitBtn.innerHTML = 'Enregistrer'; }
        });
    </script>
</body>
</html>
