<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau rendez-vous - MédiConnex</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-image: url('https://images.pexels.com/photos/5327656/pexels-photo-5327656.jpeg?auto=compress&cs=tinysrgb&w=1600');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            padding: 30px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 7, 15, 0.75);
            z-index: 0;
        }
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }
        .bg-glow .glow-1 {
            position: absolute;
            top: 20%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.15), transparent);
            border-radius: 50%;
            animation: floatGlow 20s infinite ease-in-out;
        }
        .bg-glow .glow-2 {
            position: absolute;
            bottom: 10%;
            right: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 100, 255, 0.1), transparent);
            border-radius: 50%;
            animation: floatGlow 25s infinite ease-in-out reverse;
        }
        @keyframes floatGlow {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, -50px) scale(1.1); }
            66% { transform: translate(-30px, 40px) scale(0.9); }
        }

        .rdv-container {
            position: relative;
            z-index: 1;
            max-width: 600px;
            width: 100%;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(15px);
            border-radius: 32px;
            padding: 35px;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        h1 { color: #00d4ff; font-size: 1.8rem; display: flex; align-items: center; gap: 15px; margin-bottom: 10px; }
        .subtitle { color: #94a3b8; margin-bottom: 30px; font-size: 0.9rem; border-left: 3px solid #00d4ff; padding-left: 12px; }

        .form-group { margin-bottom: 25px; }
        label { display: block; color: #00d4ff; font-size: 0.8rem; margin-bottom: 8px; }
        input, select { width: 100%; padding: 14px; background: rgba(0,0,0,0.4); border: 1px solid rgba(0,212,255,0.3); border-radius: 16px; color: #fff; font-size: 1rem; }
        input:focus, select:focus { outline: none; border-color: #00d4ff; }

        .btn-submit { width: 100%; padding: 14px; background: linear-gradient(135deg, #00d4ff, #0099cc); border: none; border-radius: 50px; color: #0a0c10; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0,212,255,0.3); }

        .back-link { color: #94a3b8; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px; transition: 0.3s; }
        .back-link:hover { color: #00d4ff; }

        .error-msg { color: #ef4444; font-size: 0.8rem; margin-top: 5px; display: none; }

        .toast { position: fixed; bottom: 30px; right: 30px; padding: 12px 20px; background: rgba(15,23,42,0.95); border-left: 4px solid #00ff88; border-radius: 12px; z-index: 1100; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        @media (max-width: 550px) { .rdv-container { padding: 25px; margin: 15px; } }
    </style>
</head>
<body>
    <div class="bg-glow"><div class="glow-1"></div><div class="glow-2"></div></div>

    <div class="rdv-container">
        <a href="medecin-rendezvous.html" class="back-link"><i class="fas fa-arrow-left"></i> Retour</a>
        <h1><i class="fas fa-calendar-plus"></i> Nouveau rendez-vous</h1>
        <div class="subtitle">Planifiez une consultation avec un patient</div>

        <form id="rdvForm">
            <div class="form-group">
                <label>Patient</label>
                <select id="patientId" required><option value="">Chargement...</option></select>
                <div id="patientError" class="error-msg">Veuillez sélectionner un patient</div>
            </div>
            <div class="form-group">
                <label>Date et heure</label>
                <input type="datetime-local" id="dateRdv" required>
                <div id="dateError" class="error-msg">Veuillez choisir une date</div>
            </div>
            <div class="form-group">
                <label>Motif</label>
                <input type="text" id="motif" placeholder="Ex: Consultation de suivi">
            </div>
            <div class="form-group">
                <label>Statut</label>
                <select id="statut"><option value="en_attente">⏳ En attente</option><option value="confirme">✅ Confirmé</option></select>
            </div>
            <button type="submit" class="btn-submit"><i class="fas fa-save"></i> Enregistrer</button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://uuhdpvtnfaycqemhrelo.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_C-QCOapZ_QY92foN_Q-VRw_3WSoCos7';
        const medecin = JSON.parse(localStorage.getItem('medecin') || '{}');
        const medecinId = medecin.id_medecin || 1;

        function showToast(msg, type) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}" style="color:#00d4ff"></i> ${msg}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        async function chargerPatients() {
            const select = document.getElementById('patientId');
            select.innerHTML = '<option>Chargement...</option>';
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/patients?select=id_patient,nom,prenom&order=nom.asc`, {
                    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
                });
                const patients = await res.json();
                if (patients.length === 0) { select.innerHTML = '<option>⚠️ Aucun patient</option>'; return; }
                select.innerHTML = '<option value="">-- Sélectionnez un patient --</option>';
                patients.forEach(p => { select.innerHTML += `<option value="${p.id_patient}">${p.prenom} ${p.nom}</option>`; });
            } catch (err) { select.innerHTML = '<option>❌ Erreur</option>'; }
        }

        document.getElementById('rdvForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const patientId = document.getElementById('patientId').value;
            const dateRdv = document.getElementById('dateRdv').value;
            let isValid = true;
            if (!patientId) { document.getElementById('patientError').style.display = 'block'; isValid = false; }
            else { document.getElementById('patientError').style.display = 'none'; }
            if (!dateRdv) { document.getElementById('dateError').style.display = 'block'; isValid = false; }
            else { document.getElementById('dateError').style.display = 'none'; }
            if (!isValid) return;

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/rendez_vous`, {
                    method: 'POST',
                    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id_patient: parseInt(patientId), id_medecin: medecinId, date_rdv: new Date(dateRdv).toISOString(), motif: document.getElementById('motif').value, statut: document.getElementById('statut').value })
                });
                if (res.ok) { showToast('✅ Rendez-vous ajouté', 'success'); setTimeout(() => window.location.href = 'medecin-rendezvous.html', 1000); }
                else showToast('❌ Erreur', 'error');
            } catch (err) { showToast('❌ Erreur réseau', 'error'); }
        });

        chargerPatients();
    </script>
</body>
</html>
