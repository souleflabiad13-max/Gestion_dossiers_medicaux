<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau rendez-vous - MédiConnex</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        body {
            background-image: url('https://images.pexels.com/photos/5327656/pexels-photo-5327656.jpeg?auto=compress&cs=tinysrgb&w=1600');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
            display: flex;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 7, 15, 0.75);
            z-index: -1;
        }

        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }
        .bg-glow .glow-1 {
            position: absolute;
            top: 20%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.15), transparent);
            border-radius: 50%;
            animation: floatGlow 20s infinite ease-in-out;
        }
        .bg-glow .glow-2 {
            position: absolute;
            bottom: 10%;
            right: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 100, 255, 0.1), transparent);
            border-radius: 50%;
            animation: floatGlow 25s infinite ease-in-out reverse;
        }
        @keyframes floatGlow {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, -50px) scale(1.1); }
            66% { transform: translate(-30px, 40px) scale(0.9); }
        }

        /* ========== SIDEBAR ========== */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 100;
            width: 280px;
            background: rgba(10, 12, 16, 0.95);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(0, 212, 255, 0.2);
            padding: 30px 20px;
            height: 100vh;
            overflow-y: auto;
            transition: all 0.3s ease;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
        }

        .sidebar-logo i {
            font-size: 2rem;
            color: #00d4ff;
            filter: drop-shadow(0 0 10px rgba(0, 212, 255, 0.4));
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(0, 212, 255, 0.4)); }
            50% { filter: drop-shadow(0 0 15px rgba(0, 212, 255, 0.6)); }
        }

        .sidebar-logo span {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #fff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .sidebar-menu { list-style: none; }
        .sidebar-menu li { margin-bottom: 8px; }
        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: #94a3b8;
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        .sidebar-menu a i { width: 22px; font-size: 1.1rem; color: #00d4ff; }
        .sidebar-menu a:hover, .sidebar-menu .active a {
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            transform: translateX(5px);
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 212, 255, 0.2);
        }
        .sidebar-footer a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: #ff3366;
            text-decoration: none;
            cursor: pointer;
            border-radius: 12px;
            transition: 0.3s;
        }
        .sidebar-footer a:hover {
            background: rgba(255, 51, 102, 0.1);
            transform: translateX(5px);
        }

        /* ========== MAIN CONTENT ========== */
        .main-content {
            position: relative;
            z-index: 1;
            flex: 1;
            margin-left: 280px;
            padding: 25px 35px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ========== HEADER ========== */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 15px 25px;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }
        .page-header h1 {
            color: #00d4ff;
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .doctor-info-mini {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .doctor-avatar-mini {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .doctor-avatar-mini i { font-size: 1.3rem; color: #0a0c10; }
        .doctor-text-mini h3 { font-size: 0.9rem; color: #00d4ff; }
        .doctor-text-mini p { font-size: 0.7rem; color: #94a3b8; }

        /* ========== CARD FORMULAIRE ========== */
        .rdv-container {
            width: 100%;
            max-width: 650px;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(15px);
            border-radius: 32px;
            padding: 35px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        .rdv-container:hover {
            border-color: rgba(0, 212, 255, 0.6);
            box-shadow: 0 30px 60px rgba(0, 212, 255, 0.2);
        }

        .rdv-container h1 { 
            color: #00d4ff; 
            font-size: 1.8rem; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0,212,255,0.3);
        }
        .subtitle { 
            color: #94a3b8; 
            margin-bottom: 30px; 
            font-size: 0.9rem; 
            border-left: 3px solid #00d4ff; 
            padding-left: 12px; 
        }

        .form-group { margin-bottom: 25px; }
        label { 
            display: block; 
            color: #00d4ff; 
            font-size: 0.8rem; 
            margin-bottom: 8px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        label i { margin-right: 8px; }
        
        input, select, textarea { 
            width: 100%; 
            padding: 14px 16px; 
            background: rgba(0,0,0,0.4); 
            border: 1px solid rgba(0,212,255,0.3); 
            border-radius: 16px; 
            color: #fff; 
            font-size: 1rem; 
            transition: all 0.3s ease;
        }
        input:focus, select:focus, textarea:focus { 
            outline: none; 
            border-color: #00d4ff; 
            box-shadow: 0 0 15px rgba(0,212,255,0.2);
            background: rgba(0,212,255,0.05);
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Indicateur de disponibilité */
        .dispo-indicator {
            margin-top: 8px;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            display: none;
            align-items: center;
            gap: 8px;
        }
        .dispo-indicator.available {
            background: rgba(0, 255, 136, 0.1);
            color: #00ff88;
            border-left: 3px solid #00ff88;
            display: flex;
        }
        .dispo-indicator.unavailable {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border-left: 3px solid #ef4444;
            display: flex;
        }
        .dispo-indicator i { font-size: 0.9rem; }

        .btn-submit { 
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(135deg, #00d4ff, #0099cc); 
            border: none; 
            border-radius: 50px; 
            color: #0a0c10; 
            font-size: 1rem; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-submit:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 10px 25px rgba(0,212,255,0.4); 
        }
        .btn-submit:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }

        .back-link { 
            color: #94a3b8; 
            text-decoration: none; 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            margin-bottom: 20px; 
            transition: 0.3s;
            padding: 8px 0;
        }
        .back-link:hover { color: #00d4ff; transform: translateX(-3px); }

        .error-msg { 
            color: #ef4444; 
            font-size: 0.75rem; 
            margin-top: 5px; 
            display: none;
            align-items: center;
            gap: 5px;
        }
        .error-msg i { font-size: 0.7rem; }

        .toast { 
            position: fixed; 
            bottom: 30px; 
            right: 30px; 
            padding: 12px 20px; 
            background: rgba(15,23,42,0.95); 
            border-left: 4px solid #00ff88; 
            border-radius: 12px; 
            z-index: 1100; 
            animation: slideIn 0.3s ease;
            font-size: 0.85rem;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0,212,255,0.2);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .sidebar { width: 80px; }
            .sidebar span, .sidebar-footer span { display: none; }
            .main-content { margin-left: 80px; padding: 20px; }
            .rdv-container { padding: 25px; margin: 15px; }
            .rdv-container h1 { font-size: 1.4rem; }
        }
        @media (max-width: 550px) {
            .rdv-container { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="bg-glow"><div class="glow-1"></div><div class="glow-2"></div></div>
    <div id="loadingOverlay" class="loading-overlay"><div class="loading-spinner"></div></div>

    <!-- ========== SIDEBAR ========== -->
    <div class="sidebar">
        <div class="sidebar-logo">
            <i class="fa-solid fa-staff-snake"></i>
            <span>MédiConnex</span>
        </div>
        <ul class="sidebar-menu">
            <li><a href="medecin-dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
            <li><a href="medecin-patients.html"><i class="fa-solid fa-users"></i> Patients</a></li>
            <li><a href="medecin-ajout-patient.html"><i class="fa-solid fa-user-plus"></i> Ajouter patient</a></li>
            <li><a href="medecin-consultation.html"><i class="fa-solid fa-stethoscope"></i> Consultations</a></li>
            <li class="active"><a href="medecin-rendezvous.html"><i class="fa-solid fa-calendar-check"></i> Rendez-vous</a></li>
            <li><a href="medecin-messagerie.html"><i class="fa-solid fa-comments"></i> Messagerie</a></li>
            <li><a href="medecin-profil.html"><i class="fa-solid fa-user-md"></i> Profil</a></li>
        </ul>
        <div class="sidebar-footer">
            <a onclick="logout()"><i class="fa-solid fa-sign-out-alt"></i> Déconnexion</a>
        </div>
    </div>

    <!-- ========== MAIN CONTENT ========== -->
    <div class="main-content">
        <div class="rdv-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
                <a href="medecin-rendezvous.html" class="back-link"><i class="fas fa-arrow-left"></i> Retour</a>
                <div class="doctor-info-mini">
                    <div class="doctor-avatar-mini">
                        <i class="fa-solid fa-user-md"></i>
                    </div>
                    <div class="doctor-text-mini">
                        <h3 id="doctorName">Dr. Chargement...</h3>
                        <p id="doctorSpecialite">Médecin</p>
                    </div>
                </div>
            </div>

            <h1><i class="fas fa-calendar-plus"></i> Nouveau rendez-vous</h1>
            <div class="subtitle">Planifiez une consultation avec un patient</div>

            <form id="rdvForm">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Patient</label>
                    <select id="patientId" required>
                        <option value="">Chargement des patients...</option>
                    </select>
                    <div id="patientError" class="error-msg"><i class="fas fa-exclamation-circle"></i> Veuillez sélectionner un patient</div>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-calendar-day"></i> Date et heure</label>
                    <input type="datetime-local" id="dateRdv" required>
                    <div id="dateError" class="error-msg"><i class="fas fa-exclamation-circle"></i> Veuillez choisir une date valide</div>
                    <div id="dispoIndicator" class="dispo-indicator"></div>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-stethoscope"></i> Motif</label>
                    <input type="text" id="motif" placeholder="Ex: Consultation de suivi, Urgence, Contrôle...">
                </div>

                <div class="form-group">
                    <label><i class="fas fa-tag"></i> Statut</label>
                    <select id="statut">
                        <option value="en_attente">⏳ En attente</option>
                        <option value="confirme">✅ Confirmé</option>
                    </select>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-pen-alt"></i> Notes (optionnel)</label>
                    <textarea id="notes" placeholder="Informations complémentaires, préparations nécessaires, etc..."></textarea>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <i class="fas fa-save"></i> Planifier le rendez-vous
                </button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://uuhdpvtnfaycqemhrelo.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_C-QCOapZ_QY92foN_Q-VRw_3WSoCos7';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const medecin = JSON.parse(localStorage.getItem('medecin') || '{}');
        const medecinId = medecin.id_medecin || 1;

        // Afficher infos médecin
        document.getElementById('doctorName').innerHTML = `Dr. ${medecin.prenom || ''} ${medecin.nom || 'Médecin'}`;
        document.getElementById('doctorSpecialite').innerHTML = medecin.specialite || 'Médecin généraliste';

        function logout() { 
            localStorage.removeItem('medecin'); 
            window.location.href = '../index.html'; 
        }

        function showToast(msg, type = 'success') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}" style="color:#00d4ff"></i> ${msg}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function showLoading() {
            document.getElementById('loadingOverlay').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        // ✅ VÉRIFICATION DATE PASSÉE
        function isDatePast(dateStr) {
            const selectedDate = new Date(dateStr);
            const now = new Date();
            return selectedDate < now;
        }

        // ✅ VÉRIFICATION CONFLIT DE RENDEZ-VOUS
        async function verifierConflitRendezVous(dateRdv) {
            if (!dateRdv) return false;
            
            const dateDebut = new Date(dateRdv);
            const dateFin = new Date(dateDebut.getTime() + 30 * 60000);
            
            const { data, error } = await supabaseClient
                .from('rendez_vous')
                .select('id_rdv, date_rdv, statut')
                .eq('id_medecin', medecinId)
                .in('statut', ['en_attente', 'confirme']);
            
            if (error || !data) return false;
            
            for (const rdv of data) {
                const rdvDate = new Date(rdv.date_rdv);
                const rdvDateFin = new Date(rdvDate.getTime() + 30 * 60000);
                
                if ((dateDebut < rdvDateFin && dateFin > rdvDate)) {
                    return true;
                }
            }
            return false;
        }

        // ✅ VÉRIFICATION DISPONIBILITÉ EN TEMPS RÉEL
        async function verifierDisponibilite(dateRdv) {
            const dispoDiv = document.getElementById('dispoIndicator');
            const submitBtn = document.getElementById('submitBtn');
            
            if (!dateRdv) {
                dispoDiv.style.display = 'none';
                submitBtn.disabled = false;
                return;
            }
            
            if (isDatePast(dateRdv)) {
                dispoDiv.className = 'dispo-indicator unavailable';
                dispoDiv.innerHTML = '<i class="fas fa-calendar-times"></i> ⚠️ Impossible de programmer dans le passé';
                dispoDiv.style.display = 'flex';
                submitBtn.disabled = true;
                return;
            }
            
            const hasConflict = await verifierConflitRendezVous(dateRdv);
            if (hasConflict) {
                dispoDiv.className = 'dispo-indicator unavailable';
                dispoDiv.innerHTML = '<i class="fas fa-clock"></i> ❌ Créneau déjà occupé (un autre rendez-vous à cette heure)';
                dispoDiv.style.display = 'flex';
                submitBtn.disabled = true;
                return;
            }
            
            dispoDiv.className = 'dispo-indicator available';
            dispoDiv.innerHTML = '<i class="fas fa-check-circle"></i> ✅ Créneau disponible';
            dispoDiv.style.display = 'flex';
            submitBtn.disabled = false;
        }

        async function chargerPatients() {
            const select = document.getElementById('patientId');
            select.innerHTML = '<option>Chargement...</option>';
            try {
                const { data, error } = await supabaseClient
                    .from('patients')
                    .select('id_patient, nom, prenom')
                    .order('nom', { ascending: true });
                
                if (error) throw error;
                
                if (!data || data.length === 0) { 
                    select.innerHTML = '<option>⚠️ Aucun patient</option>'; 
                    return; 
                }
                
                select.innerHTML = '<option value="">-- Sélectionnez un patient --</option>';
                data.forEach(p => { 
                    select.innerHTML += `<option value="${p.id_patient}">${p.prenom || ''} ${p.nom || ''}</option>`; 
                });
            } catch (err) { 
                console.error(err);
                select.innerHTML = '<option>❌ Erreur de chargement</option>'; 
                showToast('Erreur de chargement des patients', 'error');
            }
        }

        let dateCheckTimeout;
        document.getElementById('dateRdv').addEventListener('input', (e) => {
            clearTimeout(dateCheckTimeout);
            dateCheckTimeout = setTimeout(() => {
                verifierDisponibilite(e.target.value);
            }, 500);
        });

        document.getElementById('rdvForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const patientId = document.getElementById('patientId').value;
            const dateRdv = document.getElementById('dateRdv').value;
            const motif = document.getElementById('motif').value;
            const statut = document.getElementById('statut').value;
            const notes = document.getElementById('notes').value;
            
            let isValid = true;
            
            if (!patientId) { 
                document.getElementById('patientError').style.display = 'flex'; 
                isValid = false; 
            } else { 
                document.getElementById('patientError').style.display = 'none'; 
            }
            
            if (!dateRdv) { 
                document.getElementById('dateError').style.display = 'flex'; 
                isValid = false; 
            } else { 
                document.getElementById('dateError').style.display = 'none'; 
            }
            
            if (dateRdv && isDatePast(dateRdv)) {
                showToast('❌ Impossible de programmer un rendez-vous dans le passé', 'error');
                isValid = false;
            }
            
            if (dateRdv && !isDatePast(dateRdv)) {
                const hasConflict = await verifierConflitRendezVous(dateRdv);
                if (hasConflict) {
                    showToast('❌ Ce créneau est déjà occupé par un autre rendez-vous', 'error');
                    isValid = false;
                }
            }
            
            if (!isValid) return;
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Planification...';
            showLoading();
            
            try {
                const { error } = await supabaseClient
                    .from('rendez_vous')
                    .insert({
                        id_patient: parseInt(patientId),
                        id_medecin: medecinId,
                        date_rdv: new Date(dateRdv).toISOString(),
                        motif: motif,
                        statut: statut,
                        notes: notes || null,
                       
                    });
                
                if (error) throw error;
                
                showToast('✅ Rendez-vous planifié avec succès !', 'success');
                setTimeout(() => {
                    window.location.href = 'medecin-rendezvous.html';
                }, 1200);
                
            } catch (err) { 
                console.error(err);
                showToast('❌ Erreur: ' + err.message, 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-save"></i> Planifier le rendez-vous';
            } finally {
                hideLoading();
            }
        });

        chargerPatients();
    </script>
</body>
</html>
