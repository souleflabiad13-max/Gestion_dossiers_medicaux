<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messagerie - MédiConnex</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        body {
            background-image: url('https://images.pexels.com/photos/5327656/pexels-photo-5327656.jpeg?auto=compress&cs=tinysrgb&w=1600');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
            display: flex;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 7, 15, 0.75);
            z-index: -1;
        }

        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }
        .bg-glow .glow-1 {
            position: absolute;
            top: 20%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.15), transparent);
            border-radius: 50%;
            animation: floatGlow 20s infinite ease-in-out;
        }
        .bg-glow .glow-2 {
            position: absolute;
            bottom: 10%;
            right: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 100, 255, 0.1), transparent);
            border-radius: 50%;
            animation: floatGlow 25s infinite ease-in-out reverse;
        }
        @keyframes floatGlow {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, -50px) scale(1.1); }
            66% { transform: translate(-30px, 40px) scale(0.9); }
        }

        /* ========== SIDEBAR ========== */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 100;
            width: 280px;
            background: rgba(10, 12, 16, 0.95);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(0, 212, 255, 0.2);
            padding: 30px 20px;
            height: 100vh;
            overflow-y: auto;
            transition: all 0.3s ease;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
        }

        .sidebar-logo i {
            font-size: 2rem;
            color: #00d4ff;
            filter: drop-shadow(0 0 10px rgba(0, 212, 255, 0.4));
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(0, 212, 255, 0.4)); }
            50% { filter: drop-shadow(0 0 15px rgba(0, 212, 255, 0.6)); }
        }

        .sidebar-logo span {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #fff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .sidebar-menu { list-style: none; }
        .sidebar-menu li { margin-bottom: 8px; }
        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: #94a3b8;
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        .sidebar-menu a i { width: 22px; font-size: 1.1rem; color: #00d4ff; }
        .sidebar-menu a:hover, .sidebar-menu .active a {
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            transform: translateX(5px);
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 212, 255, 0.2);
        }
        .sidebar-footer a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: #ff3366;
            text-decoration: none;
            cursor: pointer;
            border-radius: 12px;
            transition: 0.3s;
        }
        .sidebar-footer a:hover {
            background: rgba(255, 51, 102, 0.1);
            transform: translateX(5px);
        }

        /* ========== MAIN CONTENT ========== */
        .main-content {
            position: relative;
            z-index: 1;
            flex: 1;
            margin-left: 280px;
            padding: 25px 35px;
            min-height: 100vh;
        }

        /* ========== HEADER ========== */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 15px 25px;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }
        .page-header h1 {
            color: #00d4ff;
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .doctor-info-mini {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .doctor-avatar-mini {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .doctor-avatar-mini i { font-size: 1.3rem; color: #0a0c10; }
        .doctor-text-mini h3 { font-size: 0.9rem; color: #00d4ff; }
        .doctor-text-mini p { font-size: 0.7rem; color: #94a3b8; }

        /* ========== BADGE NON LU ========== */
        .badge-unread {
            background: #00d4ff;
            color: #0a0c10;
            border-radius: 20px;
            padding: 2px 8px;
            font-size: 0.7rem;
            font-weight: bold;
            margin-left: 8px;
        }

        /* ========== CONTENEUR MESSAGES ========== */
        .messages-container {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }
        .messages-list {
            flex: 1;
            min-width: 320px;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(0, 212, 255, 0.2);
            max-height: 70vh;
            overflow-y: auto;
        }
        .message-detail {
            flex: 1.5;
            min-width: 380px;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        .section-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .section-header h3 {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #00d4ff;
        }
        .refresh-btn {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .refresh-btn:hover {
            background: #00d4ff;
            color: #0a0c10;
            transform: rotate(180deg);
        }

        /* ========== MESSAGE ITEM ========== */
        .message-item {
            background: rgba(0, 212, 255, 0.05);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid rgba(0, 212, 255, 0.2);
            cursor: pointer;
            transition: 0.3s;
        }
        .message-item:hover {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
            transform: translateX(5px);
        }
        .message-item.unread {
            border-left: 3px solid #00d4ff;
            background: rgba(0, 212, 255, 0.08);
        }
        .message-sujet {
            font-weight: 600;
            color: #00d4ff;
            margin-bottom: 5px;
            font-size: 15px;
        }
        .message-patient {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
        }
        .message-date {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
        }

        /* ========== DÉTAIL MESSAGE ========== */
        .detail-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
        }
        .detail-sujet {
            font-size: 20px;
            font-weight: 600;
            color: #00d4ff;
            margin-bottom: 10px;
        }
        .detail-patient {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 5px;
            font-size: 14px;
        }
        .detail-date {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }
        .detail-contenu {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
            line-height: 1.6;
            color: white;
        }
        .reply-label {
            color: #00d4ff;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .reply-textarea {
            width: 100%;
            padding: 15px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 16px;
            color: white;
            font-size: 14px;
            resize: vertical;
            margin-bottom: 15px;
        }
        .reply-textarea:focus {
            outline: none;
            border-color: #00d4ff;
        }
        .reply-textarea::placeholder {
            color: #94a3b8;
        }
        .btn-send {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #0a0c10;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.3);
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: rgba(255, 255, 255, 0.5);
        }
        .empty-state i {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .loading-spinner {
            text-align: center;
            padding: 40px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 212, 255, 0.2);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 12px 20px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-left: 4px solid #00ff88;
            border-radius: 12px;
            z-index: 1100;
            animation: slideIn 0.3s ease;
            color: white;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .loading-spinner-global {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0,212,255,0.2);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @media (max-width: 768px) {
            .sidebar { width: 80px; }
            .sidebar span, .sidebar-footer span { display: none; }
            .main-content { margin-left: 80px; padding: 15px; }
            .messages-container { flex-direction: column; }
            .messages-list, .message-detail { min-width: auto; }
        }
    </style>
</head>
<body>
    <div class="bg-glow"><div class="glow-1"></div><div class="glow-2"></div></div>
    <div id="loadingOverlay" class="loading-overlay"><div class="loading-spinner-global"></div></div>

    <!-- ========== SIDEBAR ========== -->
    <div class="sidebar">
        <div class="sidebar-logo">
            <i class="fa-solid fa-staff-snake"></i>
            <span>MédiConnex</span>
        </div>
        <ul class="sidebar-menu">
            <li><a href="medecin-dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
            <li><a href="medecin-patients.html"><i class="fa-solid fa-users"></i> Patients</a></li>
            <li><a href="medecin-ajout-patient.html"><i class="fa-solid fa-user-plus"></i> Ajouter patient</a></li>
            <li><a href="medecin-consultation.html"><i class="fa-solid fa-stethoscope"></i> Consultations</a></li>
            <li><a href="medecin-rendezvous.html"><i class="fa-solid fa-calendar-check"></i> Rendez-vous</a></li>
            <li class="active"><a href="medecin-messagerie.html"><i class="fa-solid fa-comments"></i> Messagerie</a></li>
            <li><a href="medecin-profil.html"><i class="fa-solid fa-user-md"></i> Profil</a></li>
        </ul>
        <div class="sidebar-footer">
            <a onclick="logout()"><i class="fa-solid fa-sign-out-alt"></i> Déconnexion</a>
        </div>
    </div>

    <!-- ========== MAIN CONTENT ========== -->
    <div class="main-content">
        <div class="page-header">
            <h1><i class="fa-solid fa-comments"></i> Messagerie</h1>
            <div class="doctor-info-mini">
                <div class="doctor-avatar-mini">
                    <i class="fa-solid fa-user-md"></i>
                </div>
                <div class="doctor-text-mini">
                    <h3 id="doctorName">Dr. Chargement...</h3>
                    <p id="doctorSpecialite">Médecin</p>
                </div>
            </div>
        </div>

        <div class="messages-container">
            <div class="messages-list">
                <div class="section-header">
                    <h3><i class="fas fa-inbox"></i> Messages reçus</h3>
                    <button class="refresh-btn" onclick="refreshMessages()" title="Actualiser">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
                <div id="messagesList">
                    <div class="loading-spinner"><div class="spinner"></div><p>Chargement...</p></div>
                </div>
            </div>
            <div class="message-detail">
                <div id="messageDetail">
                    <div class="empty-state">
                        <i class="fas fa-envelope-open-text"></i>
                        <p>Sélectionnez un message pour lire et répondre</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========== CONFIGURATION ==========
        const SUPABASE_URL = 'https://uuhdpvtnfaycqemhrelo.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_C-QCOapZ_QY92foN_Q-VRw_3WSoCos7';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ========== VÉRIFICATION SESSION ==========
        const medecinData = localStorage.getItem('medecin');
        if (!medecinData) window.location.href = 'medecin-login.html';
        const medecin = JSON.parse(medecinData);
        const currentMedecinId = medecin.id_medecin;

        // ========== AFFICHAGE INFOS MÉDECIN ==========
        document.getElementById('doctorName').innerHTML = `Dr. ${medecin.prenom || ''} ${medecin.nom || 'Médecin'}`;
        document.getElementById('doctorSpecialite').innerHTML = medecin.specialite || 'Médecin généraliste';

        // ========== VARIABLES ==========
        let messagesList = [];
        let patientsCache = {};
        let autoRefreshInterval = null;
        let currentSelectedMessageId = null;

        // ========== DÉCONNEXION ==========
        function logout() { 
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            localStorage.removeItem('medecin'); 
            window.location.href = '../index.html'; 
        }

        // ========== TOAST ==========
        function showToast(message, type = 'success') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}" style="color:#00d4ff"></i> ${message}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // ========== LOADING OVERLAY ==========
        function showLoading() { document.getElementById('loadingOverlay').style.display = 'flex'; }
        function hideLoading() { document.getElementById('loadingOverlay').style.display = 'none'; }

        // ========== ESCAPE HTML ==========
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ========== RÉCUPÉRER NOM PATIENT AVEC CACHE ==========
        async function getPatientName(patientId) {
            if (patientsCache[patientId]) return patientsCache[patientId];
            try {
                const { data, error } = await supabaseClient
                    .from('patients')
                    .select('nom, prenom')
                    .eq('id_patient', patientId)
                    .single();
                if (data && !error) {
                    patientsCache[patientId] = `${data.prenom || ''} ${data.nom || ''}`.trim() || 'Patient';
                    return patientsCache[patientId];
                }
                return 'Patient';
            } catch (err) {
                return 'Patient';
            }
        }

        // ========== JOUER SON DE NOTIFICATION ==========
        function playNotificationSound() {
            try {
                const audio = new Audio('https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3');
                audio.volume = 0.3;
                audio.play().catch(e => console.log('Audio non supporté'));
            } catch(e) { console.log('Erreur audio'); }
        }

        // ========== CHARGER MESSAGES ==========
        async function loadMessages() {
            const container = document.getElementById('messagesList');
            container.innerHTML = '<div class="loading-spinner"><div class="spinner"></div><p>Chargement...</p></div>';
            
            try {
                const { data, error } = await supabaseClient
                    .from('messages')
                    .select('*')
                    .eq('id_medecin', currentMedecinId)
                    .order('date_envoi', { ascending: false });
                
                if (error) throw error;
                
                const oldMessagesCount = messagesList.length;
                const oldUnreadCount = messagesList.filter(m => !m.lu).length;
                
                messagesList = data || [];
                
                // ✅ NOUVEAU : Vérifier les nouveaux messages non lus
                const newUnreadCount = messagesList.filter(m => !m.lu).length;
                if (newUnreadCount > oldUnreadCount) {
                    playNotificationSound();
                    showToast(`📬 Nouveau message reçu ! (${newUnreadCount - oldUnreadCount} non lu(s))`, 'info');
                    
                    // Mettre à jour le badge du titre (optionnel)
                    document.title = newUnreadCount > 0 ? `(${newUnreadCount}) Messagerie - MédiConnex` : 'Messagerie - MédiConnex';
                }
                
                if (messagesList.length === 0) {
                    container.innerHTML = '<div class="empty-state"><i class="fas fa-envelope-open-text"></i><p>Aucun message reçu</p></div>';
                    return;
                }
                
                // Charger les noms des patients
                for (const msg of messagesList) {
                    msg.patientName = await getPatientName(msg.id_patient);
                }
                
                container.innerHTML = messagesList.map(msg => `
                    <div class="message-item ${!msg.lu ? 'unread' : ''}" onclick="selectMessage(${msg.id_message})" data-id="${msg.id_message}">
                        <div class="message-sujet">${escapeHtml(msg.sujet || 'Sans sujet')}</div>
                        <div class="message-patient"><i class="fas fa-user"></i> ${escapeHtml(msg.patientName)}</div>
                        <div class="message-date"><i class="fas fa-clock"></i> ${new Date(msg.date_envoi).toLocaleString('fr-FR')}</div>
                        ${!msg.lu ? '<span class="badge-unread">Nouveau</span>' : ''}
                    </div>
                `).join('');
                
                // Si un message était sélectionné, le re-sélectionner
                if (currentSelectedMessageId) {
                    const stillExists = messagesList.find(m => m.id_message === currentSelectedMessageId);
                    if (stillExists) {
                        selectMessage(currentSelectedMessageId);
                    } else {
                        document.getElementById('messageDetail').innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-envelope-open-text"></i>
                                <p>Sélectionnez un message pour lire et répondre</p>
                            </div>
                        `;
                        currentSelectedMessageId = null;
                    }
                }
                
            } catch (err) {
                console.error(err);
                container.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Erreur de chargement</p></div>';
            }
        }

        // ========== SÉLECTIONNER MESSAGE ==========
        async function selectMessage(messageId) {
            const message = messagesList.find(m => m.id_message === messageId);
            if (!message) return;
            
            currentSelectedMessageId = messageId;
            
            // Marquer comme lu si nécessaire
            if (!message.lu) {
                showLoading();
                const { error } = await supabaseClient
                    .from('messages')
                    .update({ lu: true })
                    .eq('id_message', messageId);
                
                if (!error) {
                    message.lu = true;
                    // Mettre à jour l'affichage dans la liste
                    const msgElement = document.querySelector(`.message-item[data-id="${messageId}"]`);
                    if (msgElement) {
                        msgElement.classList.remove('unread');
                        const badge = msgElement.querySelector('.badge-unread');
                        if (badge) badge.remove();
                    }
                    // Mettre à jour le titre
                    const unreadCount = messagesList.filter(m => !m.lu).length;
                    document.title = unreadCount > 0 ? `(${unreadCount}) Messagerie - MédiConnex` : 'Messagerie - MédiConnex';
                }
                hideLoading();
            }
            
            const patientName = await getPatientName(message.id_patient);
            const hasReponse = message.reponse && message.reponse.trim() !== '';
            
            const detailHtml = `
                <div class="detail-header">
                    <div class="detail-sujet">${escapeHtml(message.sujet || 'Sans sujet')}</div>
                    <div class="detail-patient"><i class="fas fa-user"></i> De: ${escapeHtml(patientName)}</div>
                    <div class="detail-date"><i class="fas fa-calendar"></i> ${new Date(message.date_envoi).toLocaleString('fr-FR')}</div>
                </div>
                <div class="detail-contenu">
                    ${escapeHtml(message.contenu).replace(/\n/g, '<br>')}
                </div>
                ${hasReponse ? `
                    <div style="background: rgba(0, 212, 255, 0.05); border-radius: 12px; padding: 15px; margin-top: 15px;">
                        <strong style="color: #00d4ff;"><i class="fas fa-reply"></i> Votre réponse :</strong>
                        <p style="margin-top: 10px;">${escapeHtml(message.reponse).replace(/\n/g, '<br>')}</p>
                        <small style="color: rgba(255, 255, 255, 0.5);">${new Date(message.date_reponse).toLocaleString('fr-FR')}</small>
                    </div>
                ` : ''}
                <div style="margin-top: 25px;">
                    <div class="reply-label"><i class="fas fa-reply"></i> Répondre</div>
                    <textarea id="replyText" class="reply-textarea" rows="4" placeholder="Écrivez votre réponse ici..."></textarea>
                    <button class="btn-send" onclick="sendReply(${message.id_message})"><i class="fas fa-paper-plane"></i> Envoyer la réponse</button>
                </div>
            `;
            
            document.getElementById('messageDetail').innerHTML = detailHtml;
        }

        // ========== ENVOYER RÉPONSE ==========
        async function sendReply(messageId) {
            const replyText = document.getElementById('replyText')?.value.trim();
            if (!replyText) {
                showToast('Veuillez écrire une réponse', 'error');
                return;
            }
            
            showLoading();
            try {
                const { error } = await supabaseClient
                    .from('messages')
                    .update({ 
                        reponse: replyText, 
                        date_reponse: new Date().toISOString() 
                    })
                    .eq('id_message', messageId);
                
                if (error) throw error;
                
                showToast('✅ Réponse envoyée avec succès', 'success');
                
                // Mettre à jour le message dans la liste
                const message = messagesList.find(m => m.id_message === messageId);
                if (message) {
                    message.reponse = replyText;
                    message.date_reponse = new Date().toISOString();
                }
                
                // Rafraîchir l'affichage du message sélectionné
                selectMessage(messageId);
                
            } catch (error) {
                console.error(error);
                showToast('❌ Erreur: ' + error.message, 'error');
            } finally {
                hideLoading();
            }
        }

        // ========== RAFRAÎCHIR MESSAGES ==========
        function refreshMessages() {
            loadMessages();
            showToast('Messages actualisés', 'success');
        }

        // ========== INITIALISATION ==========
        document.addEventListener('DOMContentLoaded', () => {
            loadMessages();
            
            // ✅ NOUVEAU : Auto-refresh toutes les 10 secondes
            autoRefreshInterval = setInterval(() => {
                loadMessages();
            }, 10000);
        });
        
        // Nettoyer l'intervalle si la page est fermée
        window.addEventListener('beforeunload', () => {
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
        });
        
        window.selectMessage = selectMessage;
        window.sendReply = sendReply;
        window.refreshMessages = refreshMessages;
    </script>
</body>
</html>
