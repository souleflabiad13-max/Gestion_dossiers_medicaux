<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des patients - MédiConnex</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-image: url('https://images.pexels.com/photos/5327656/pexels-photo-5327656.jpeg?auto=compress&cs=tinysrgb&w=1600');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            padding: 30px;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 7, 15, 0.75);
            z-index: 0;
        }
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }
        .bg-glow .glow-1 {
            position: absolute;
            top: 20%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.15), transparent);
            border-radius: 50%;
            animation: floatGlow 20s infinite ease-in-out;
        }
        .bg-glow .glow-2 {
            position: absolute;
            bottom: 10%;
            right: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 100, 255, 0.1), transparent);
            border-radius: 50%;
            animation: floatGlow 25s infinite ease-in-out reverse;
        }
        @keyframes floatGlow {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, -50px) scale(1.1); }
            66% { transform: translate(-30px, 40px) scale(0.9); }
        }

        .patients-wrapper {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(15px);
            border-radius: 32px;
            padding: 30px;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 20px; }
        .page-header h1 { color: #00d4ff; font-size: 1.8rem; display: flex; align-items: center; gap: 15px; }
        .btn-add { background: rgba(0,212,255,0.1); border: 1px solid #00d4ff; border-radius: 40px; padding: 12px 25px; color: #00d4ff; text-decoration: none; font-weight: 600; transition: 0.3s; }
        .btn-add:hover { background: #00d4ff; color: #0a0c10; transform: translateY(-2px); }

        .search-section { background: rgba(0,212,255,0.05); border: 1px solid rgba(0,212,255,0.2); border-radius: 20px; padding: 20px; margin-bottom: 30px; }
        .search-grid { display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: 15px; align-items: end; }
        .search-field label { color: #94a3b8; font-size: 0.8rem; margin-bottom: 5px; display: block; }
        .search-field input { width: 100%; padding: 12px 15px; background: rgba(0,0,0,0.4); border: 1px solid rgba(0,212,255,0.3); border-radius: 12px; color: #fff; }
        .search-btn { background: rgba(0,212,255,0.1); border: 1px solid #00d4ff; border-radius: 40px; padding: 12px 25px; color: #00d4ff; cursor: pointer; }

        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px 10px; color: #00d4ff; border-bottom: 1px solid rgba(0,212,255,0.2); }
        td { padding: 12px 10px; border-bottom: 1px solid rgba(0,212,255,0.1); }
        tr:hover td { background: rgba(0,212,255,0.05); }

        .action-icons { display: flex; gap: 15px; }
        .action-icons i { color: #94a3b8; cursor: pointer; transition: 0.3s; font-size: 1.1rem; }
        .action-icons i:hover { color: #00d4ff; transform: scale(1.1); }

        .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 30px; flex-wrap: wrap; }
        .page-btn { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: rgba(0,212,255,0.1); border: 1px solid rgba(0,212,255,0.3); border-radius: 50%; color: #fff; cursor: pointer; }
        .page-btn.active { background: #00d4ff22; border-color: #00d4ff; color: #00d4ff; }

        .toast { position: fixed; bottom: 30px; right: 30px; padding: 12px 20px; background: rgba(15,23,42,0.95); border-left: 4px solid #00ff88; border-radius: 12px; z-index: 1100; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        @media (max-width: 768px) { .search-grid { grid-template-columns: 1fr; } .patients-wrapper { padding: 20px; } }
    </style>
</head>
<body>
    <div class="bg-glow"><div class="glow-1"></div><div class="glow-2"></div></div>

    <div class="patients-wrapper">
        <div class="page-header">
            <h1><i class="fa-solid fa-users"></i> Liste des patients</h1>
            <a href="medecin-ajout-patient.html" class="btn-add"><i class="fa-solid fa-plus"></i> Ajouter un patient</a>
        </div>

        <div class="search-section">
            <div class="search-grid">
                <div class="search-field"><label>Nom</label><input type="text" id="searchNom" placeholder="Ex: Benali"></div>
                <div class="search-field"><label>ID patient</label><input type="text" id="searchId" placeholder="Ex: DZ-2503-042"></div>
                <div class="search-field"><label>Téléphone</label><input type="text" id="searchTel" placeholder="Ex: 0550 12 34 56"></div>
                <button class="search-btn" onclick="filtrerPatients()">Rechercher</button>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead><tr><th>ID</th><th>Nom</th><th>Prénom</th><th>Téléphone</th><th>Actions</th></tr></thead>
                <tbody id="patientsBody"><tr><td colspan="5" style="text-align:center; padding:40px;">Chargement...</td></tr></tbody>
            </table>
        </div>
        <div id="pagination" class="pagination"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://uuhdpvtnfaycqemhrelo.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_C-QCOapZ_QY92foN_Q-VRw_3WSoCos7';
        const medecin = JSON.parse(localStorage.getItem('medecin') || '{}');
        if (!medecin.id_medecin) window.location.href = 'medecin-login.html';

        let patients = [], filtres = [], currentPage = 1;
        const rowsPerPage = 5;

        function showToast(msg, type) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}" style="color:#00d4ff"></i> ${msg}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        async function chargerPatients() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/patients?select=*`, {
                    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
                });
                patients = await res.json();
                filtres = [...patients];
                afficherPatients();
            } catch (err) { document.getElementById('patientsBody').innerHTML = '<tr><td colspan="5">❌ Erreur de chargement</td></tr>'; }
        }

        function afficherPatients() {
            const start = (currentPage-1)*rowsPerPage, end = start+rowsPerPage;
            const pageData = filtres.slice(start, end);
            const tbody = document.getElementById('patientsBody');
            tbody.innerHTML = '';
            if(!pageData.length) { tbody.innerHTML = '<tr><td colspan="5">Aucun patient</td></tr>'; return; }

            pageData.forEach(p => {
                const row = tbody.insertRow();
                row.insertCell(0).innerText = p.id_national || p.id_patient;
                row.insertCell(1).innerText = p.nom || '';
                row.insertCell(2).innerText = p.prenom || '';
                row.insertCell(3).innerText = p.telephone || '-';
                const actions = row.insertCell(4);
                actions.className = 'action-icons';
                actions.innerHTML = `<i class="fa-solid fa-eye" data-id="${p.id_patient}" data-action="voir"></i><i class="fa-solid fa-trash" data-id="${p.id_patient}" data-action="supprimer"></i>`;
            });

            document.querySelectorAll('.action-icons i').forEach(icon => {
                icon.addEventListener('click', (e) => {
                    const id = icon.dataset.id, action = icon.dataset.action;
                    if(action === 'voir') window.location.href = `medecin-dossier.html?id=${id}`;
                    else if(action === 'supprimer') supprimerPatient(id);
                });
            });
            afficherPagination();
        }

        async function supprimerPatient(id) {
            if(!confirm('🗑️ Supprimer ce patient ?')) return;
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/patients?id_patient=eq.${id}`, { method: 'DELETE', headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } });
                showToast('Patient supprimé', 'success');
                chargerPatients();
            } catch(err) { showToast('Erreur lors de la suppression', 'error'); }
        }

        function afficherPagination() {
            const total = Math.ceil(filtres.length/rowsPerPage);
            const div = document.getElementById('pagination');
            div.innerHTML = '';
            for(let i=1;i<=total;i++) {
                const btn = document.createElement('div');
                btn.className = `page-btn ${i===currentPage ? 'active' : ''}`;
                btn.innerText = i;
                btn.onclick = () => { currentPage = i; afficherPatients(); };
                div.appendChild(btn);
            }
        }

        window.filtrerPatients = function() {
            const nom = document.getElementById('searchNom').value.toLowerCase();
            const id = document.getElementById('searchId').value.toLowerCase();
            const tel = document.getElementById('searchTel').value.toLowerCase();
            filtres = patients.filter(p => (nom === '' || (p.nom && p.nom.toLowerCase().includes(nom))) && (id === '' || (p.id_national && p.id_national.toLowerCase().includes(id))) && (tel === '' || (p.telephone && p.telephone.includes(tel))));
            currentPage = 1;
            afficherPatients();
        };

        chargerPatients();
    </script>
</body>
</html>
