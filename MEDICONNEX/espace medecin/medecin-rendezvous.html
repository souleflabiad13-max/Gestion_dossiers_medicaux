<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion des rendez-vous - MédiConnex</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-image: url('https://images.pexels.com/photos/5327656/pexels-photo-5327656.jpeg?auto=compress&cs=tinysrgb&w=1600');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            padding: 30px;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 7, 15, 0.75);
            z-index: 0;
        }
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }
        .bg-glow .glow-1 {
            position: absolute;
            top: 20%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.15), transparent);
            border-radius: 50%;
            animation: floatGlow 20s infinite ease-in-out;
        }
        .bg-glow .glow-2 {
            position: absolute;
            bottom: 10%;
            right: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 100, 255, 0.1), transparent);
            border-radius: 50%;
            animation: floatGlow 25s infinite ease-in-out reverse;
        }
        @keyframes floatGlow {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, -50px) scale(1.1); }
            66% { transform: translate(-30px, 40px) scale(0.9); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(15px);
            border-radius: 32px;
            padding: 30px;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        h1 { color: #00d4ff; text-align: center; margin-bottom: 30px; font-size: 1.8rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(0,212,255,0.15); }
        th { color: #00d4ff; }

        .statut { padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; display: inline-block; }
        .statut-attente { background: #ffaa3322; color: #ffaa33; border: 1px solid #ffaa33; }
        .statut-confirme { background: #00d4ff22; color: #00d4ff; border: 1px solid #00d4ff; }
        .statut-termine { background: #00ff8822; color: #00ff88; border: 1px solid #00ff88; }

        select { background: rgba(0,0,0,0.4); color: #fff; border: 1px solid rgba(0,212,255,0.3); border-radius: 8px; padding: 5px; cursor: pointer; }

        .btn-add { background: rgba(0,212,255,0.1); border: 1px solid #00d4ff; border-radius: 40px; padding: 10px 20px; color: #00d4ff; text-decoration: none; display: inline-block; transition: 0.3s; }
        .btn-add:hover { background: #00d4ff; color: #0a0c10; transform: translateY(-2px); }
        .back-link { color: #94a3b8; text-decoration: none; display: inline-block; margin-right: 20px; transition: 0.3s; }
        .back-link:hover { color: #00d4ff; }

        .toast { position: fixed; bottom: 30px; right: 30px; padding: 12px 20px; background: rgba(15,23,42,0.95); border-left: 4px solid #00ff88; border-radius: 12px; z-index: 1100; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        @media (max-width: 768px) { .container { padding: 20px; margin: 15px; } }
    </style>
</head>
<body>
    <div class="bg-glow"><div class="glow-1"></div><div class="glow-2"></div></div>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px;">
            <h1><i class="fas fa-calendar-check"></i> Gestion des rendez-vous</h1>
            <div>
                <a href="medecin-dashboard.html" class="back-link"><i class="fas fa-arrow-left"></i> Retour</a>
                <a href="medecin-ajout-rendezvous.html" class="btn-add"><i class="fas fa-plus"></i> Nouveau rendez-vous</a>
            </div>
        </div>

        <div style="overflow-x: auto;">
            <table id="rdvTable">
                <thead><tr><th>Patient</th><th>Date</th><th>Heure</th><th>Motif</th><th>Statut</th></tr></thead>
                <tbody id="rdvBody"><tr><td colspan="5" style="text-align:center; padding:40px;">Chargement...</td></tr></tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://uuhdpvtnfaycqemhrelo.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_C-QCOapZ_QY92foN_Q-VRw_3WSoCos7';
        const medecin = JSON.parse(localStorage.getItem('medecin') || '{}');
        const medecinId = medecin.id_medecin || 1;

        function showToast(msg, type) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}" style="color:#00d4ff"></i> ${msg}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        async function chargerRendezVous() {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/rendez_vous?id_medecin=eq.${medecinId}&select=*,patients(nom,prenom)`, {
                headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
            });
            const rdvs = await res.json();
            const tbody = document.getElementById('rdvBody');
            if (!rdvs.length) { tbody.innerHTML = '<tr><td colspan="5">Aucun rendez-vous</td></tr>'; return; }
            tbody.innerHTML = rdvs.map(rdv => `
                <tr>
                    <td>${rdv.patients?.prenom || ''} ${rdv.patients?.nom || ''}</td>
                    <td>${rdv.date_rdv?.slice(0,10) || ''}</td>
                    <td>${rdv.date_rdv?.slice(11,16) || ''}</td>
                    <td>${rdv.motif || '-'}</td>
                    <td><select class="statut statut-${rdv.statut}" data-id="${rdv.id_rdv}" data-statut="${rdv.statut}" onchange="changerStatut(this)"><option value="en_attente" ${rdv.statut === 'en_attente' ? 'selected' : ''}>⏳ En attente</option><option value="confirme" ${rdv.statut === 'confirme' ? 'selected' : ''}>✅ Confirmé</option><option value="termine" ${rdv.statut === 'termine' ? 'selected' : ''}>✔️ Terminé</option></select></td>
                </tr>
            `).join('');
        }

        window.changerStatut = async function(select) {
            const newStatut = select.value, rdvId = select.dataset.id;
            if (newStatut === select.dataset.statut) return;
            const res = await fetch(`${SUPABASE_URL}/rest/v1/rendez_vous?id_rdv=eq.${rdvId}`, {
                method: 'PATCH',
                headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ statut: newStatut })
            });
            if (res.ok) { select.dataset.statut = newStatut; select.className = `statut statut-${newStatut}`; showToast('Statut mis à jour', 'success'); }
            else showToast('Erreur', 'error');
        };

        chargerRendezVous();
    </script>
</body>
</html>
