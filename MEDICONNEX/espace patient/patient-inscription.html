<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription Patient - MédiConnex</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --patient: #00ff88;
        }
        body {
            margin: 0;
            padding: 0;
            background-image: url('https://images.pexels.com/photos/7579831/pexels-photo-7579831.jpeg?auto=compress&cs=tinysrgb&w=1600');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: -1;
        }
        .register-container {
            max-width: 600px;
            margin: 40px auto;
            background: rgba(26, 26, 46, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 40px;
            border: 2px solid var(--patient);
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.2);
        }
        h2 {
            text-align: center;
            color: var(--patient);
            margin-bottom: 30px;
            font-size: 28px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: var(--patient);
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            transition: 0.3s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--patient);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--patient), #00cc6a);
            border: none;
            border-radius: 50px;
            color: #1a1a2e;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 255, 136, 0.3);
        }
        .login-link {
            text-align: center;
            margin-top: 25px;
        }
        .login-link a {
            color: var(--patient);
            text-decoration: none;
        }
        .error-message, .success-message {
            padding: 12px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
            text-align: center;
        }
        .error-message {
            background: rgba(255, 68, 68, 0.15);
            border-left: 4px solid #ff4444;
            color: #ff4444;
        }
        .success-message {
            background: rgba(0, 255, 136, 0.15);
            border-left: 4px solid var(--patient);
            color: var(--patient);
        }
        @media (max-width: 550px) {
            .register-container { padding: 25px; margin: 20px; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <h2><i class="fa-solid fa-user-plus"></i> Inscription Patient</h2>
        
        <form id="registerForm">
            <div class="form-row">
                <div class="form-group">
                    <label>Nom *</label>
                    <input type="text" id="nom" required>
                </div>
                <div class="form-group">
                    <label>Prénom *</label>
                    <input type="text" id="prenom" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Téléphone</label>
                    <input type="tel" id="telephone">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Date de naissance</label>
                    <input type="date" id="dateNaissance">
                </div>
                <div class="form-group">
                    <label>Sexe</label>
                    <select id="sexe">
                        <option value="">Sélectionner</option>
                        <option value="M">Masculin</option>
                        <option value="F">Féminin</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label>Adresse</label>
                <input type="text" id="adresse">
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Mot de passe *</label>
                    <input type="password" id="motDePasse" required>
                </div>
                <div class="form-group">
                    <label>Confirmer *</label>
                    <input type="password" id="confirmPassword" required>
                </div>
            </div>
            
            <button type="submit" class="btn-submit">
                <i class="fa-solid fa-user-check"></i> S'inscrire
            </button>
            
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
        </form>
        
        <div class="login-link">
            <p>Déjà inscrit ? <a href="patient-login.html">Se connecter</a></p>
        </div>
    </div>
    
    <script>
        const SUPABASE_URL = 'https://uuhdpvtnfaycqemhrelo.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_C-QCOapZ_QY92foN_Q-VRw_3WSoCos7';

        // Fonction de hashage
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex;
        }

        function genererIdNational() {
            const date = new Date();
            const annee = date.getFullYear().toString().slice(-2);
            const mois = (date.getMonth() + 1).toString().padStart(2, '0');
            const random = Math.floor(Math.random() * 1000).toString().padStart(3, '0');
            return `DZ-${annee}${mois}-${random}`;
        }

        function calculerAge(dateNaissance) {
            if (!dateNaissance) return null;
            const today = new Date();
            const birth = new Date(dateNaissance);
            let age = today.getFullYear() - birth.getFullYear();
            const m = today.getMonth() - birth.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
            return age;
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nom = document.getElementById('nom').value.trim();
            const prenom = document.getElementById('prenom').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const telephone = document.getElementById('telephone').value.trim();
            const dateNaissance = document.getElementById('dateNaissance').value;
            const sexe = document.getElementById('sexe').value;
            const adresse = document.getElementById('adresse').value.trim();
            const motDePasse = document.getElementById('motDePasse').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            // Validation
            if (!nom || !prenom || !email || !motDePasse) {
                errorDiv.innerHTML = 'Veuillez remplir tous les champs obligatoires (*)';
                errorDiv.style.display = 'block';
                return;
            }
            
            if (motDePasse !== confirmPassword) {
                errorDiv.innerHTML = 'Les mots de passe ne correspondent pas';
                errorDiv.style.display = 'block';
                return;
            }
            
            if (motDePasse.length < 4) {
                errorDiv.innerHTML = 'Le mot de passe doit contenir au moins 4 caractères';
                errorDiv.style.display = 'block';
                return;
            }
            
            try {
                // Vérifier si l'email existe déjà
                const checkUrl = `${SUPABASE_URL}/rest/v1/patients?select=email&email=eq.${encodeURIComponent(email)}`;
                const checkResponse = await fetch(checkUrl, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                const existing = await checkResponse.json();
                
                if (existing && existing.length > 0) {
                    errorDiv.innerHTML = 'Cet email est déjà utilisé';
                    errorDiv.style.display = 'block';
                    return;
                }
                
                // Hasher le mot de passe
                const hashedPassword = await hashPassword(motDePasse);
                
                // Créer le nouveau patient
                const newPatient = {
                    id_national: genererIdNational(),
                    nom: nom,
                    prenom: prenom,
                    email: email,
                    telephone: telephone || null,
                    date_naissance: dateNaissance || null,
                    age: calculerAge(dateNaissance),
                    sexe: sexe || null,
                    adresse: adresse || null,
                    mot_de_passe: hashedPassword,
                    date_creation: new Date().toISOString()
                };
                
                const createUrl = `${SUPABASE_URL}/rest/v1/patients`;
                const createResponse = await fetch(createUrl, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(newPatient)
                });
                
                if (!createResponse.ok) {
                    const error = await createResponse.text();
                    throw new Error(error);
                }
                
                successDiv.innerHTML = '✅ Inscription réussie ! Redirection vers la connexion...';
                successDiv.style.display = 'block';
                
                setTimeout(() => {
                    window.location.href = 'patient-login.html';
                }, 2000);
                
            } catch (error) {
                console.error(error);
                errorDiv.innerHTML = 'Erreur lors de l\'inscription: ' + error.message;
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
