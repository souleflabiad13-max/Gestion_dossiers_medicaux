<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mon profil | MediConnex</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background-image: url('https://images.pexels.com/photos/7579831/pexels-photo-7579831.jpeg?auto=compress&cs=tinysrgb&w=1600');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #ffffff;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 7, 15, 0.75);
      z-index: 0;
    }

    .bg-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }
    .bg-glow .glow-1 {
      position: absolute;
      top: 20%;
      left: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0, 255, 136, 0.15), transparent);
      border-radius: 50%;
      animation: floatGlow 20s infinite ease-in-out;
    }
    .bg-glow .glow-2 {
      position: absolute;
      bottom: 10%;
      right: -10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(0, 212, 255, 0.1), transparent);
      border-radius: 50%;
      animation: floatGlow 25s infinite ease-in-out reverse;
    }
    @keyframes floatGlow {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(50px, -50px) scale(1.1); }
      66% { transform: translate(-30px, 40px) scale(0.9); }
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 280px;
      height: 100%;
      background: rgba(10, 12, 16, 0.95);
      backdrop-filter: blur(20px);
      padding: 30px 20px;
      border-right: 1px solid rgba(0, 255, 136, 0.2);
      z-index: 100;
      transition: all 0.3s;
      overflow-y: auto;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(0, 255, 136, 0.2);
    }
    .sidebar-header i { font-size: 28px; color: #00ff88; filter: drop-shadow(0 0 10px rgba(0, 255, 136, 0.5)); }
    .sidebar-header h2 {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, #00ff88, #33ff9e);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .sidebar nav ul { list-style: none; }
    .sidebar nav ul li { margin-bottom: 6px; }
    .sidebar nav ul li a {
      color: #8a8f9e;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border-radius: 12px;
      transition: all 0.3s;
      font-weight: 500;
      font-size: 14px;
    }
    .sidebar nav ul li a i { width: 22px; font-size: 18px; }
    .sidebar nav ul li a:hover {
      background: rgba(0, 255, 136, 0.1);
      color: #00ff88;
      transform: translateX(5px);
    }
    .sidebar nav ul li a.active {
      background: linear-gradient(135deg, rgba(0, 255, 136, 0.15), rgba(0, 255, 136, 0.05));
      color: #00ff88;
      border-left: 3px solid #00ff88;
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 20px;
      border-top: 1px solid rgba(0, 255, 136, 0.2);
    }
    .sidebar-footer a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      color: #ef4444;
      text-decoration: none;
      cursor: pointer;
      border-radius: 12px;
      transition: 0.3s;
    }
    .sidebar-footer a:hover {
      background: rgba(239, 68, 68, 0.1);
      transform: translateX(5px);
    }

    .main-content {
      position: relative;
      z-index: 2;
      margin-left: 280px;
      padding: 25px 35px;
      min-height: 100vh;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 15px;
    }
    .greeting h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff, #00ff88);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: titleGlow 3s ease-in-out infinite;
    }
    @keyframes titleGlow {
      0%, 100% { text-shadow: 0 0 5px rgba(0, 255, 136, 0.3); }
      50% { text-shadow: 0 0 15px rgba(0, 255, 136, 0.6); }
    }
    .greeting p { color: rgba(255, 255, 255, 0.6); font-size: 13px; margin-top: 5px; }

    .btn-back {
      background: rgba(0, 255, 136, 0.1);
      border: 1px solid rgba(0, 255, 136, 0.3);
      padding: 10px 20px;
      border-radius: 30px;
      color: #00ff88;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn-back:hover {
      background: #00ff88;
      color: #0a0c10;
      transform: translateY(-2px);
    }

    .section-card {
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 25px;
      border: 1px solid rgba(0, 255, 136, 0.2);
    }
    .section-header {
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(0, 255, 136, 0.15);
    }
    .section-header h3 {
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #00ff88;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }
    .info-item {
      background: rgba(0, 255, 136, 0.05);
      border-radius: 16px;
      padding: 15px;
      border: 1px solid rgba(0, 255, 136, 0.2);
      transition: 0.3s;
    }
    .info-item:hover {
      border-color: rgba(0, 255, 136, 0.5);
      background: rgba(0, 255, 136, 0.08);
    }
    .info-item label {
      font-size: 11px;
      color: #00ff88;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .info-item p {
      font-size: 15px;
      font-weight: 500;
      margin-top: 8px;
    }

    .menu-toggle {
      display: none;
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 101;
      background: #00ff88;
      border: none;
      padding: 12px;
      border-radius: 12px;
      color: #0a0c10;
      cursor: pointer;
      font-size: 18px;
    }

    @media (max-width: 768px) {
      .sidebar { left: -280px; }
      .sidebar.open { left: 0; }
      .main-content { margin-left: 0; padding: 20px; }
      .menu-toggle { display: block; }
    }
  </style>
</head>
<body>

  <div class="bg-glow"><div class="glow-1"></div><div class="glow-2"></div></div>
  <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-header"><i class="fas fa-heartbeat"></i><h2>MediConnex</h2></div>
    <nav>
      <ul>
        <li><a href="patient-dashboard.html"><i class="fas fa-tachometer-alt"></i> Tableau de bord</a></li>
        <li><a href="patient-rendezvous.html"><i class="fas fa-calendar-alt"></i> Mes rendez-vous</a></li>
        <li><a href="patient-dossier.html"><i class="fas fa-folder-medical"></i> Dossier médical</a></li>
        <li><a href="patient-consultations.html"><i class="fas fa-history"></i> Consultations</a></li>
        <li><a href="patient-profil.html" class="active"><i class="fas fa-user"></i> Mon profil</a></li>
        <li><a href="patient-messagerie.html"><i class="fas fa-comments"></i> Messagerie</a></li>
      </ul>
    </nav>
    <div class="sidebar-footer"><a onclick="logout()"><i class="fas fa-sign-out-alt"></i> Déconnexion</a></div>
  </div>

  <div class="main-content">
    <div class="top-bar">
      <div class="greeting"><h1>Mon profil</h1><p>Vos informations personnelles</p></div>
      <button class="btn-back" onclick="window.location.href='patient-dashboard.html'"><i class="fas fa-arrow-left"></i> Retour</button>
    </div>

    <div class="section-card">
      <div class="section-header"><h3><i class="fas fa-id-card"></i> Informations personnelles</h3></div>
      <div class="info-grid" id="profileInfo"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://uuhdpvtnfaycqemhrelo.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_C-QCOapZ_QY92foN_Q-VRw_3WSoCos7';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const patientData = localStorage.getItem('patient');
    if (!patientData) window.location.href = 'patient-login.html';
    const patient = JSON.parse(patientData);

    function logout() { localStorage.removeItem('patient'); window.location.href = 'patient-login.html'; }

    async function loadProfil() {
      const { data: p } = await supabaseClient.from('patients').select('*').eq('id_patient', patient.id_patient).single();
      if (!p) return;
      
      document.getElementById('profileInfo').innerHTML = `
        <div class="info-item"><label>ID Patient</label><p>${p.id_patient || '--'}</p></div>
        <div class="info-item"><label>Nom complet</label><p>${p.prenom || ''} ${p.nom || ''}</p></div>
        <div class="info-item"><label>Date de naissance</label><p>${p.date_naissance || '--'}</p></div>
        <div class="info-item"><label>Âge</label><p>${p.age || '--'} ans</p></div>
        <div class="info-item"><label>Sexe</label><p>${p.sexe === 'M' ? 'Masculin' : (p.sexe === 'F' ? 'Féminin' : '--')}</p></div>
        <div class="info-item"><label>Groupe sanguin</label><p>${p.groupe_sanguin || '--'}</p></div>
        <div class="info-item"><label>Téléphone</label><p>${p.telephone || '--'}</p></div>
        <div class="info-item"><label>Email</label><p>${p.email || '--'}</p></div>
        <div class="info-item"><label>Adresse</label><p>${p.adresse || '--'}</p></div>
      `;
    }
    
    document.addEventListener('DOMContentLoaded', loadProfil);
    document.getElementById('menuToggle')?.addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));
  </script>
</body>
</html>
