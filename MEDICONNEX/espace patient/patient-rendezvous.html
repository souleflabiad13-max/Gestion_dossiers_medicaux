<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mes rendez-vous | MediConnex</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background-image: url('https://images.pexels.com/photos/7579831/pexels-photo-7579831.jpeg?auto=compress&cs=tinysrgb&w=1600');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #ffffff;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 7, 15, 0.75);
      z-index: 0;
    }

    .bg-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }
    .bg-glow .glow-1 {
      position: absolute;
      top: 20%;
      left: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0, 255, 136, 0.15), transparent);
      border-radius: 50%;
      animation: floatGlow 20s infinite ease-in-out;
    }
    .bg-glow .glow-2 {
      position: absolute;
      bottom: 10%;
      right: -10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(0, 212, 255, 0.1), transparent);
      border-radius: 50%;
      animation: floatGlow 25s infinite ease-in-out reverse;
    }
    @keyframes floatGlow {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(50px, -50px) scale(1.1); }
      66% { transform: translate(-30px, 40px) scale(0.9); }
    }

    /* Sidebar */
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 280px;
      height: 100%;
      background: rgba(10, 12, 16, 0.95);
      backdrop-filter: blur(20px);
      padding: 30px 20px;
      border-right: 1px solid rgba(0, 255, 136, 0.2);
      z-index: 100;
      transition: all 0.3s;
      overflow-y: auto;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(0, 255, 136, 0.2);
    }
    .sidebar-header i { font-size: 28px; color: #00ff88; filter: drop-shadow(0 0 10px rgba(0, 255, 136, 0.5)); }
    .sidebar-header h2 {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, #00ff88, #33ff9e);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .sidebar nav ul { list-style: none; }
    .sidebar nav ul li { margin-bottom: 6px; }
    .sidebar nav ul li a {
      color: #8a8f9e;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border-radius: 12px;
      transition: all 0.3s;
      font-weight: 500;
      font-size: 14px;
    }
    .sidebar nav ul li a i { width: 22px; font-size: 18px; }
    .sidebar nav ul li a:hover {
      background: rgba(0, 255, 136, 0.1);
      color: #00ff88;
      transform: translateX(5px);
    }
    .sidebar nav ul li a.active {
      background: linear-gradient(135deg, rgba(0, 255, 136, 0.15), rgba(0, 255, 136, 0.05));
      color: #00ff88;
      border-left: 3px solid #00ff88;
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 20px;
      border-top: 1px solid rgba(0, 255, 136, 0.2);
    }
    .sidebar-footer a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      color: #ef4444;
      text-decoration: none;
      cursor: pointer;
      border-radius: 12px;
      transition: 0.3s;
    }
    .sidebar-footer a:hover {
      background: rgba(239, 68, 68, 0.1);
      transform: translateX(5px);
    }

    /* Main Content */
    .main-content {
      position: relative;
      z-index: 2;
      margin-left: 280px;
      padding: 25px 35px;
      min-height: 100vh;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 15px;
    }
    .greeting h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff, #00ff88);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: titleGlow 3s ease-in-out infinite;
    }
    @keyframes titleGlow {
      0%, 100% { text-shadow: 0 0 5px rgba(0, 255, 136, 0.3), 0 0 10px rgba(0, 255, 136, 0.2); }
      50% { text-shadow: 0 0 15px rgba(0, 255, 136, 0.6), 0 0 25px rgba(0, 255, 136, 0.4); }
    }
    .greeting p { color: rgba(255, 255, 255, 0.6); font-size: 13px; margin-top: 5px; }

    .btn-back {
      background: rgba(0, 255, 136, 0.1);
      border: 1px solid rgba(0, 255, 136, 0.3);
      padding: 10px 20px;
      border-radius: 30px;
      color: #00ff88;
      cursor: pointer;
      transition: 0.3s;
      font-size: 14px;
    }
    .btn-back:hover {
      background: #00ff88;
      color: #0a0c10;
      transform: translateY(-2px);
    }

    /* Section Card */
    .section-card {
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 25px;
      border: 1px solid rgba(0, 255, 136, 0.2);
    }
    .section-header {
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(0, 255, 136, 0.15);
    }
    .section-header h3 {
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #00ff88;
    }

    /* RDV Item */
    .rdv-item {
      background: rgba(0, 255, 136, 0.05);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 15px;
      border: 1px solid rgba(0, 255, 136, 0.2);
      transition: 0.3s;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }
    .rdv-item:hover {
      border-color: #00ff88;
      background: rgba(0, 255, 136, 0.1);
      transform: translateX(5px);
    }
    .rdv-date {
      font-size: 16px;
      font-weight: 600;
      color: #00ff88;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .rdv-medecin, .rdv-motif {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-confirmed { color: #00ff88; font-size: 12px; padding: 4px 12px; background: rgba(0,255,136,0.1); border-radius: 20px; }
    .status-cancelled { color: #ef4444; font-size: 12px; padding: 4px 12px; background: rgba(239,68,68,0.1); border-radius: 20px; }
    .status-pending { color: #f59e0b; font-size: 12px; padding: 4px 12px; background: rgba(245,158,11,0.1); border-radius: 20px; }

    .btn-cancel {
      background: transparent;
      border: 1px solid #ef4444;
      color: #ef4444;
      padding: 8px 16px;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn-cancel:hover {
      background: #ef4444;
      color: white;
    }

    .empty-state {
      text-align: center;
      padding: 60px;
      color: rgba(255, 255, 255, 0.5);
    }
    .empty-state i { font-size: 64px; margin-bottom: 20px; opacity: 0.5; }

    .loading-spinner { text-align: center; padding: 40px; }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(0, 255, 136, 0.2);
      border-top-color: #00ff88;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      padding: 12px 20px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border-left: 4px solid #00ff88;
      border-radius: 12px;
      z-index: 1100;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    .menu-toggle {
      display: none;
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 101;
      background: #00ff88;
      border: none;
      padding: 12px;
      border-radius: 12px;
      color: #0a0c10;
      cursor: pointer;
      font-size: 18px;
    }

    @media (max-width: 768px) {
      .sidebar { left: -280px; }
      .sidebar.open { left: 0; }
      .main-content { margin-left: 0; padding: 20px; }
      .menu-toggle { display: block; }
    }
  </style>
</head>
<body>

  <div class="bg-glow"><div class="glow-1"></div><div class="glow-2"></div></div>
  <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-header"><i class="fas fa-heartbeat"></i><h2>MediConnex</h2></div>
    <nav>
      <ul>
        <li><a href="patient-dashboard.html"><i class="fas fa-tachometer-alt"></i> Tableau de bord</a></li>
        <li><a href="patient-rendezvous.html" class="active"><i class="fas fa-calendar-alt"></i> Mes rendez-vous</a></li>
        <li><a href="patient-dossier.html"><i class="fas fa-folder-medical"></i> Dossier médical</a></li>
        <li><a href="patient-consultations.html"><i class="fas fa-history"></i> Consultations</a></li>
        <li><a href="patient-profil.html"><i class="fas fa-user"></i> Mon profil</a></li>
        <li><a href="patient-messagerie.html"><i class="fas fa-comments"></i> Messagerie</a></li>
      </ul>
    </nav>
    <div class="sidebar-footer"><a onclick="logout()"><i class="fas fa-sign-out-alt"></i> Déconnexion</a></div>
  </div>

  <div class="main-content">
    <div class="top-bar">
      <div class="greeting"><h1>Mes rendez-vous</h1><p>Gérez vos consultations</p></div>
      <button class="btn-back" onclick="window.location.href='patient-dashboard.html'"><i class="fas fa-arrow-left"></i> Retour</button>
    </div>

    <div class="section-card">
      <div class="section-header"><h3><i class="fas fa-calendar-alt"></i> Tous vos rendez-vous</h3></div>
      <div id="rdvListContainer"><div class="loading-spinner"><div class="spinner"></div><p>Chargement...</p></div></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://uuhdpvtnfaycqemhrelo.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_C-QCOapZ_QY92foN_Q-VRw_3WSoCos7';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const patientData = localStorage.getItem('patient');
    if (!patientData) window.location.href = 'patient-login.html';
    const patient = JSON.parse(patientData);
    const currentPatientId = patient.id_patient;

    function showToast(message, type) {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}" style="color:#00ff88"></i> ${message}`;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function logout() { localStorage.removeItem('patient'); window.location.href = 'patient-login.html'; }

    async function loadRendezVous() {
      const { data: rdvs } = await supabaseClient
        .from('rendez_vous')
        .select(`id_rdv, date_rdv, motif, statut, medecins(nom, prenom)`)
        .eq('id_patient', currentPatientId)
        .order('date_rdv', { ascending: false });
      
      const container = document.getElementById('rdvListContainer');
      if (!rdvs || rdvs.length === 0) {
        container.innerHTML = `<div class="empty-state"><i class="fas fa-calendar-times"></i><p>Aucun rendez-vous trouvé</p></div>`;
        return;
      }
      
      container.innerHTML = rdvs.map(rdv => {
        let statusClass = 'status-pending', statusText = 'En attente';
        if (rdv.statut === 'confirme') { statusClass = 'status-confirmed'; statusText = 'Confirmé'; }
        else if (rdv.statut === 'annulé') { statusClass = 'status-cancelled'; statusText = 'Annulé'; }
        const medecinNom = rdv.medecins ? `${rdv.medecins.prenom || ''} ${rdv.medecins.nom || ''}`.trim() : 'Médecin';
        return `
          <div class="rdv-item">
            <div>
              <div class="rdv-date"><i class="fas fa-calendar-day"></i> ${new Date(rdv.date_rdv).toLocaleDateString('fr-FR')} à ${new Date(rdv.date_rdv).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'})}</div>
              <div class="rdv-medecin"><i class="fas fa-user-md"></i> Dr. ${medecinNom}</div>
              <div class="rdv-motif"><i class="fas fa-notes-medical"></i> ${rdv.motif || 'Consultation générale'}</div>
              <span class="${statusClass}"><i class="fas fa-circle"></i> ${statusText}</span>
            </div>
            ${rdv.statut !== 'annulé' ? `<button class="btn-cancel" onclick="annulerRDV(${rdv.id_rdv})"><i class="fas fa-times"></i> Annuler</button>` : ''}
          </div>
        `;
      }).join('');
    }
    
    async function annulerRDV(id) {
      if (confirm('Annuler ce rendez-vous ?')) {
        await supabaseClient.from('rendez_vous').update({ statut: 'annulé' }).eq('id_rdv', id);
        showToast('Rendez-vous annulé', 'success');
        loadRendezVous();
      }
    }
    
    document.addEventListener('DOMContentLoaded', loadRendezVous);
    document.getElementById('menuToggle')?.addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));
  </script>
</body>
</html>
