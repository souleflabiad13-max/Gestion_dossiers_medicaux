<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un hôpital - MédiConnex</title>
    <link rel="stylesheet" href="style-admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="check-session.js"></script>
    <style>
        :root {
            --admin: #ffaa33;
            --admin-light: rgba(255,170,51,0.2);
        }
        .form-wrapper {
            display: flex;
            width: 100%;
            max-width: 1400px;
            min-height: 90vh;
            background: rgba(26,26,46,0.7);
            border: 2px solid var(--admin);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            overflow: hidden;
            box-shadow: 0 0 50px var(--admin);
        }
        .sidebar {
            width: 280px;
            background: rgba(0,0,0,0.3);
            border-right: 2px solid var(--admin);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
        }
        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 40px;
            padding: 0 10px;
        }
        .sidebar-logo i { font-size: 2.5rem; color: var(--admin); filter: drop-shadow(0 0 10px var(--admin)); }
        .sidebar-logo span { font-size: 1.5rem; font-weight: 700; color: var(--admin); letter-spacing: 2px; }
        .sidebar-menu { list-style: none; flex: 1; }
        .sidebar-menu li { margin-bottom: 8px; }
        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 20px;
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            transition: 0.3s;
            font-size: 0.95rem;
        }
        .sidebar-menu a i { width: 25px; color: var(--admin); font-size: 1.2rem; }
        .sidebar-menu a:hover { background: var(--admin-light); border-left: 4px solid var(--admin); }
        .sidebar-menu .active a { background: var(--admin-light); border-left: 4px solid var(--admin); color: var(--admin); }
        .sidebar-footer { margin-top: auto; padding-top: 20px; border-top: 1px solid var(--admin); }
        .sidebar-footer a { display: flex; align-items: center; gap: 15px; padding: 12px 20px; color: #ff3366; text-decoration: none; cursor: pointer; }
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .page-header h1 { color: var(--admin); font-size: 2rem; display: flex; align-items: center; gap: 15px; }
        .back-link { color: #aaa; text-decoration: none; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .back-link:hover { color: var(--admin); }
        .form-container { background: rgba(0,0,0,0.2); border: 1px solid var(--admin); border-radius: 20px; padding: 30px; }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 25px; }
        .form-group { margin-bottom: 15px; }
        .form-group.full-width { grid-column: span 2; }
        .form-group label { color: var(--admin); display: block; margin-bottom: 8px; font-weight: 500; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--admin);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--admin);
            box-shadow: 0 0 15px var(--admin);
        }
        .form-group select option { background: #1a1a2e; color: #fff; }
        .form-group textarea { min-height: 80px; resize: vertical; }
        .form-actions { display: flex; justify-content: flex-end; gap: 15px; margin-top: 30px; }
        .btn {
            padding: 12px 30px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            border: 2px solid;
            background: transparent;
        }
        .btn-primary { border-color: var(--admin); color: var(--admin); }
        .btn-primary:hover { background: var(--admin); color: #1a1a2e; box-shadow: 0 0 30px var(--admin); }
        .btn-secondary { border-color: #ff3366; color: #ff3366; }
        .btn-secondary:hover { background: #ff3366; color: #1a1a2e; box-shadow: 0 0 30px #ff3366; }
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 15px 25px;
            border-radius: 10px;
            font-weight: 600;
            z-index: 1100;
            animation: slideInRight 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast.success { background: #00ff88; color: #1a1a2e; }
        .toast.error { background: #ff3366; color: white; }
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @media (max-width: 768px) {
            .form-wrapper { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 2px solid var(--admin); }
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>
    <div class="form-wrapper">
        <div class="sidebar">
            <div class="sidebar-logo"><i class="fa-solid fa-hospital-user"></i><span>MédiConnex</span></div>
            <ul class="sidebar-menu">
                <li><a href="admin-dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
                <li><a href="admin-medecins.html"><i class="fa-solid fa-user-md"></i> Médecins</a></li>
                <li class="active"><a href="admin-hopitaux.html"><i class="fa-solid fa-hospital"></i> Hôpitaux</a></li>
                <li><a href="admin-specialites.html"><i class="fa-solid fa-stethoscope"></i> Spécialités</a></li>
                <li><a href="admin-patients.html"><i class="fa-solid fa-users"></i> Patients</a></li>
                <li><a href="admin-statistiques.html"><i class="fa-solid fa-chart-line"></i> Statistiques</a></li>
                <li><a href="admin-logs.html"><i class="fa-solid fa-history"></i> Logs</a></li>
                <li><a href="admin-profil.html"><i class="fa-solid fa-user-cog"></i> Profil</a></li>
            </ul>
            <div class="sidebar-footer"><a onclick="logout()"><i class="fa-solid fa-sign-out-alt"></i> Déconnexion</a></div>
        </div>

        <div class="main-content">
            <div class="page-header">
                <h1><i class="fa-solid fa-building"></i> Ajouter un hôpital</h1>
                <a href="admin-hopitaux.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Retour à la liste</a>
            </div>

            <div class="form-container">
                <form id="addHopitalForm">
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label>Nom de l'hôpital</label>
                            <input type="text" id="nom" placeholder="Ex: CHU Mustapha" required>
                        </div>
                        <div class="form-group">
                            <label>Wilaya</label>
                            <select id="wilaya" required>
                                <option value="">Chargement des wilayas...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Téléphone</label>
                            <input type="tel" id="telephone" placeholder="Ex: 023 45 67 89">
                        </div>
                        <div class="form-group full-width">
                            <label>Adresse complète</label>
                            <textarea id="adresse" placeholder="Ex: 15 Rue des Médecins, Alger Centre"></textarea>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="window.location.href='admin-hopitaux.html'">Annuler</button>
                        <button type="submit" class="btn btn-primary">Ajouter l'hôpital</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function chargerWilayas() {
            const { data: wilayas, error } = await supabaseClient.from('wilayas').select('id_wilaya, nom_wilaya').order('nom_wilaya');
            const select = document.getElementById('wilaya');
            if (error) {
                select.innerHTML = '<option value="">Erreur de chargement</option>';
                return;
            }
            select.innerHTML = '<option value="">Sélectionner une wilaya</option>';
            wilayas?.forEach(w => {
                select.innerHTML += `<option value="${w.id_wilaya}">${w.nom_wilaya}</option>`;
            });
        }

        document.getElementById('addHopitalForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nom = document.getElementById('nom').value.trim();
            const wilayaId = document.getElementById('wilaya').value;
            const telephone = document.getElementById('telephone').value.trim();
            const adresse = document.getElementById('adresse').value.trim();

            if (!nom || !wilayaId) {
                showToast('❌ Veuillez remplir le nom et la wilaya', 'error');
                return;
            }

            const { error } = await supabaseClient.from('hopitaux').insert([{
                nom_hopital: nom,
                id_wilaya: parseInt(wilayaId),
                telephone: telephone || null,
                adresse: adresse || null
            }]);

            if (error) {
                showToast('❌ Erreur: ' + error.message, 'error');
            } else {
                showToast('✅ Hôpital ajouté avec succès !', 'success');
                setTimeout(() => {
                    window.location.href = 'admin-hopitaux.html';
                }, 1000);
            }
        });

        chargerWilayas();
    </script>
</body>
</html>
