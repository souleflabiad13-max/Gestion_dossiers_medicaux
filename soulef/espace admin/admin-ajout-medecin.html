<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un médecin - MédiConnex</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --admin: #ffaa33;
            --admin-light: rgba(255,170,51,0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .form-container {
            width: 100%;
            max-width: 700px;
            background: rgba(26, 26, 46, 0.9);
            border: 2px solid var(--admin);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            padding: 40px;
            box-shadow: 0 0 50px rgba(255, 170, 51, 0.3);
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .form-header i {
            font-size: 3rem;
            color: var(--admin);
            margin-bottom: 10px;
        }

        .form-header h1 {
            color: var(--admin);
            font-size: 1.8rem;
        }

        .form-header p {
            color: #aaa;
            margin-top: 5px;
        }

        .back-link {
            position: absolute;
            left: 0;
            top: 10px;
            color: var(--admin);
            text-decoration: none;
            font-size: 1.2rem;
            transition: 0.3s;
        }

        .back-link:hover {
            transform: translateX(-5px);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: var(--admin);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group label i {
            margin-right: 8px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--admin);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--admin);
            box-shadow: 0 0 10px var(--admin);
            background: rgba(255, 255, 255, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--admin), #ffcc66);
            border: none;
            border-radius: 40px;
            color: #1a1a2e;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 170, 51, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        .message.success {
            background: rgba(0, 255, 0, 0.2);
            border: 1px solid #00ff00;
            color: #00ff00;
            display: block;
        }

        .message.error {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff3366;
            color: #ff3366;
            display: block;
        }

        @media (max-width: 768px) {
            .form-container {
                padding: 25px;
            }
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="form-header">
            <a href="admin-medecins.html" class="back-link">
                <i class="fa-solid fa-arrow-left"></i> Retour
            </a>
            <i class="fa-solid fa-user-md"></i>
            <h1>Ajouter un médecin</h1>
            <p>Remplissez le formulaire pour ajouter un nouveau médecin</p>
        </div>

        <form id="ajoutMedecinForm">
            <div class="form-row">
                <div class="form-group">
                    <label><i class="fa-solid fa-user"></i> Nom *</label>
                    <input type="text" id="nom" name="nom" required placeholder="Entrez le nom">
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-user"></i> Prénom *</label>
                    <input type="text" id="prenom" name="prenom" required placeholder="Entrez le prénom">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label><i class="fa-solid fa-envelope"></i> Email</label>
                    <input type="email" id="email" name="email" placeholder="medecin@exemple.com">
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-phone"></i> Téléphone</label>
                    <input type="tel" id="telephone" name="telephone" placeholder="0555 12 34 56">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label><i class="fa-solid fa-stethoscope"></i> Spécialité *</label>
                    <select id="id_specialite" name="id_specialite" required>
                        <option value="">-- Sélectionner une spécialité --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-hospital"></i> Hôpital *</label>
                    <select id="id_hopital" name="id_hopital" required>
                        <option value="">-- Sélectionner un hôpital --</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label><i class="fa-solid fa-map-marker-alt"></i> Wilaya *</label>
                    <select id="id_wilaya" name="id_wilaya" required>
                        <option value="">-- Sélectionner une wilaya --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-calendar"></i> Date d'embauche</label>
                    <input type="date" id="date_embauche" name="date_embauche">
                </div>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-location-dot"></i> Adresse</label>
                <textarea id="adresse" name="adresse" rows="3" placeholder="Adresse complète du médecin"></textarea>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-venus-mars"></i> Genre</label>
                <select id="genre" name="genre">
                    <option value="">-- Sélectionner --</option>
                    <option value="M">Masculin</option>
                    <option value="F">Féminin</option>
                </select>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <i class="fa-solid fa-save"></i> Ajouter le médecin
            </button>
        </form>

        <div id="message" class="message"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Configuration Supabase
        const SUPABASE_URL = 'https://uuhdpvtnfaycqemhrelo.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_C-QCOapZ_QY92foN_Q-VRw_3WSoCos7';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Charger les listes déroulantes
        async function chargerSelects() {
            try {
                // Charger les spécialités
                const { data: specialites, error: errSpec } = await supabase
                    .from('specialites')
                    .select('id_specialite, nom_specialite')
                    .order('nom_specialite');
                
                if (errSpec) throw errSpec;
                
                const selectSpec = document.getElementById('id_specialite');
                specialites.forEach(spec => {
                    const option = document.createElement('option');
                    option.value = spec.id_specialite;
                    option.textContent = spec.nom_specialite;
                    selectSpec.appendChild(option);
                });

                // Charger les hôpitaux
                const { data: hopitaux, error: errHop } = await supabase
                    .from('hopitaux')
                    .select('id_hopital, nom_hopital')
                    .order('nom_hopital');
                
                if (errHop) throw errHop;
                
                const selectHop = document.getElementById('id_hopital');
                hopitaux.forEach(hop => {
                    const option = document.createElement('option');
                    option.value = hop.id_hopital;
                    option.textContent = hop.nom_hopital;
                    selectHop.appendChild(option);
                });

                // Charger les wilayas
                const { data: wilayas, error: errWil } = await supabase
                    .from('wilayas')
                    .select('id_wilaya, nom_wilaya')
                    .order('nom_wilaya');
                
                if (errWil) throw errWil;
                
                const selectWil = document.getElementById('id_wilaya');
                wilayas.forEach(wil => {
                    const option = document.createElement('option');
                    option.value = wil.id_wilaya;
                    option.textContent = wil.nom_wilaya;
                    selectWil.appendChild(option);
                });

            } catch (error) {
                console.error('Erreur chargement:', error);
                afficherMessage('Erreur lors du chargement des données', 'error');
            }
        }

        // Afficher un message
        function afficherMessage(msg, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = msg;
            messageDiv.className = `message ${type}`;
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
                messageDiv.className = 'message';
            }, 5000);
        }

        // Ajouter un médecin
        async function ajouterMedecin(event) {
            event.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Ajout en cours...';

            try {
                const medecinData = {
                    nom: document.getElementById('nom').value,
                    prenom: document.getElementById('prenom').value,
                    email: document.getElementById('email').value || null,
                    telephone: document.getElementById('telephone').value || null,
                    id_specialite: parseInt(document.getElementById('id_specialite').value),
                    id_hopital: parseInt(document.getElementById('id_hopital').value),
                    id_wilaya: parseInt(document.getElementById('id_wilaya').value),
                    date_embauche: document.getElementById('date_embauche').value || null,
                    adresse: document.getElementById('adresse').value || null,
                    genre: document.getElementById('genre').value || null
                };

                // Validation
                if (!medecinData.nom || !medecinData.prenom) {
                    throw new Error('Le nom et prénom sont obligatoires');
                }
                if (!medecinData.id_specialite || !medecinData.id_hopital || !medecinData.id_wilaya) {
                    throw new Error('Veuillez sélectionner une spécialité, un hôpital et une wilaya');
                }

                const { data, error } = await supabase
                    .from('medecins')
                    .insert([medecinData])
                    .select();

                if (error) throw error;

                afficherMessage('✅ Médecin ajouté avec succès !', 'success');
                
                // Réinitialiser le formulaire
                document.getElementById('ajoutMedecinForm').reset();
                
                // Rediriger après 2 secondes
                setTimeout(() => {
                    window.location.href = 'admin-medecins.html';
                }, 2000);

            } catch (error) {
                console.error('Erreur:', error);
                afficherMessage(`❌ Erreur : ${error.message}`, 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-save"></i> Ajouter le médecin';
            }
        }

        // Écouter la soumission du formulaire
        document.getElementById('ajoutMedecinForm').addEventListener('submit', ajouterMedecin);

        // Charger les listes au démarrage
        chargerSelects();
    </script>
</body>
</html>
