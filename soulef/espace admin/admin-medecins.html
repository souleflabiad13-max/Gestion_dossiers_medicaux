<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des médecins - MédiConnex</title>
    <link rel="stylesheet" href="style-admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --admin: #ffaa33;
            --admin-light: rgba(255,170,51,0.2);
        }

        .gestion-wrapper {
            display: flex;
            width: 100%;
            max-width: 1400px;
            min-height: 90vh;
            background: rgba(26,26,46,0.7);
            border: 2px solid var(--admin);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            overflow: hidden;
            box-shadow: 0 0 50px var(--admin);
        }

        .sidebar {
            width: 280px;
            background: rgba(0,0,0,0.3);
            border-right: 2px solid var(--admin);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 40px;
            padding: 0 10px;
        }

        .sidebar-logo i {
            font-size: 2.5rem;
            color: var(--admin);
            filter: drop-shadow(0 0 10px var(--admin));
        }

        .sidebar-logo span {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--admin);
            letter-spacing: 2px;
        }

        .sidebar-menu {
            list-style: none;
            flex: 1;
        }

        .sidebar-menu li {
            margin-bottom: 8px;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 20px;
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            transition: 0.3s;
            font-size: 0.95rem;
        }

        .sidebar-menu a i {
            width: 25px;
            color: var(--admin);
            font-size: 1.2rem;
        }

        .sidebar-menu a:hover {
            background: var(--admin-light);
            border-left: 4px solid var(--admin);
        }

        .sidebar-menu .active a {
            background: var(--admin-light);
            border-left: 4px solid var(--admin);
            color: var(--admin);
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid var(--admin);
        }

        .sidebar-footer a {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 20px;
            color: #ff3366;
            text-decoration: none;
            transition: 0.3s;
        }

        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .page-header h1 {
            color: var(--admin);
            font-size: 2rem;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-add {
            background: rgba(0,0,0,0.2);
            border: 2px solid var(--admin);
            border-radius: 40px;
            padding: 12px 25px;
            color: var(--admin);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }

        .btn-add:hover {
            background: var(--admin);
            color: #1a1a2e;
            box-shadow: 0 0 30px var(--admin);
        }

        .table-container {
            overflow-x: auto;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--admin);
            border-radius: 15px;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            color: var(--admin);
            padding: 15px 10px;
            text-align: left;
            border-bottom: 2px solid var(--admin);
            font-weight: 600;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid rgba(255,170,51,0.2);
        }

        tr:hover td {
            background: var(--admin-light);
        }

        .action-icons {
            display: flex;
            gap: 15px;
        }

        .action-icons i {
            color: #aaa;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1.1rem;
        }

        .action-icons i:hover {
            color: var(--admin);
        }

        .action-icons .fa-trash:hover {
            color: #ff3366;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: linear-gradient(145deg, #16213e, #1a1a2e);
            border: 2px solid var(--admin);
            border-radius: 30px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: var(--admin);
        }

        .close-modal {
            color: #aaa;
            font-size: 2rem;
            cursor: pointer;
        }

        .close-modal:hover {
            color: #ff3366;
        }

        .modal-field {
            margin-bottom: 15px;
        }

        .modal-field label {
            color: var(--admin);
            display: block;
            margin-bottom: 5px;
        }

        .modal-field input,
        .modal-field select {
            width: 100%;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--admin);
            border-radius: 8px;
            color: #fff;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-btn {
            flex: 1;
            padding: 10px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            border: 2px solid;
            background: transparent;
        }

        .modal-btn.save {
            border-color: var(--admin);
            color: var(--admin);
        }

        .modal-btn.save:hover {
            background: var(--admin);
            color: #1a1a2e;
        }

        .modal-btn.cancel {
            border-color: #ff3366;
            color: #ff3366;
        }

        @media (max-width: 768px) {
            .gestion-wrapper {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 2px solid var(--admin);
            }
        }
    </style>
</head>
<body>
    <div class="gestion-wrapper">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-logo">
                <i class="fa-solid fa-hospital-user"></i>
                <span>MédiConnex</span>
            </div>
            <ul class="sidebar-menu">
                <li><a href="admin-dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
                <li class="active"><a href="admin-medecins.html"><i class="fa-solid fa-user-md"></i> Médecins</a></li>
                <li><a href="admin-hopitaux.html"><i class="fa-solid fa-hospital"></i> Hôpitaux</a></li>
                <li><a href="admin-specialites.html"><i class="fa-solid fa-stethoscope"></i> Spécialités</a></li>
                <li><a href="admin-patients.html"><i class="fa-solid fa-users"></i> Patients</a></li>
                <li><a href="admin-statistiques.html"><i class="fa-solid fa-chart-line"></i> Statistiques</a></li>
                <li><a href="admin-logs.html"><i class="fa-solid fa-history"></i> Logs</a></li>
                <li><a href="admin-profil.html"><i class="fa-solid fa-user-cog"></i> Profil</a></li>
            </ul>
            <div class="sidebar-footer">
                <a href="admin-login.html"><i class="fa-solid fa-sign-out-alt"></i> Déconnexion</a>
            </div>
        </div>

        <div class="main-content">
            <div class="page-header">
                <h1><i class="fa-solid fa-user-md"></i> Gestion des médecins</h1>
                <a href="admin-ajout-medecin.html" class="btn-add">
                    <i class="fa-solid fa-plus"></i> Ajouter un médecin
                </a>
            </div>

            <div class="table-container">
                <table id="medecinsTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nom</th>
                            <th>Prénom</th>
                            <th>Spécialité</th>
                            <th>Hôpital</th>
                            <th>Wilaya</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="medecinsBody">
                        <tr><td colspan="7" style="text-align:center;">Chargement...<\/td><\/tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL MODIFICATION -->
    <div id="modalModif" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fa-solid fa-pen"></i> Modifier médecin</h2>
                <span class="close-modal" onclick="fermerModal()">&times;</span>
            </div>
            <div class="modal-field">
                <label>ID</label>
                <input type="text" id="editId" readonly>
            </div>
            <div class="modal-field">
                <label>Nom</label>
                <input type="text" id="editNom">
            </div>
            <div class="modal-field">
                <label>Prénom</label>
                <input type="text" id="editPrenom">
            </div>
            <div class="modal-field">
                <label>Spécialité</label>
                <input type="text" id="editSpecialite">
            </div>
            <div class="modal-field">
                <label>Hôpital</label>
                <input type="text" id="editHopital">
            </div>
            <div class="modal-field">
                <label>Wilaya</label>
                <select id="editWilaya">
                    <option value="Alger (16)">Alger (16)</option>
                    <option value="Oran (31)">Oran (31)</option>
                    <option value="Constantine (25)">Constantine (25)</option>
                    <option value="Annaba (23)">Annaba (23)</option>
                    <option value="Sétif (19)">Sétif (19)</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="modal-btn save" onclick="enregistrerModification()">Enregistrer</button>
                <button class="modal-btn cancel" onclick="fermerModal()">Annuler</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://uuhdpvtnfaycqemhrelo.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_C-QCOapZ_QY92foN_Q-VRw_3WSoCos7';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let ligneEnCours = null;

        async function chargerMedecins() {
            const tbody = document.getElementById('medecinsBody');
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Chargement...<\/td><\/tr>';
            
            const { data: medecins, error: errMed } = await supabaseClient
                .from('medecins')
                .select('*');
            
            if (errMed) {
                tbody.innerHTML = `<tr><td colspan="7">❌ Erreur: ${errMed.message}<\/td><\/tr>`;
                return;
            }
            
            if (!medecins || medecins.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7">Aucun médecin trouvé<\/td><\/tr>';
                return;
            }
            
            const { data: specialites } = await supabaseClient.from('specialites').select('id_specialite, nom_specialite');
            const { data: hopitaux } = await supabaseClient.from('hopitaux').select('id_hopital, nom_hopital');
            const { data: wilayas } = await supabaseClient.from('wilayas').select('id_wilaya, nom_wilaya');
            
            const specialitesMap = new Map();
            const hopitauxMap = new Map();
            const wilayasMap = new Map();
            
            specialites?.forEach(s => specialitesMap.set(s.id_specialite, s.nom_specialite));
            hopitaux?.forEach(h => hopitauxMap.set(h.id_hopital, h.nom_hopital));
            wilayas?.forEach(w => wilayasMap.set(w.id_wilaya, w.nom_wilaya));
            
            tbody.innerHTML = '';
            
            medecins.forEach(m => {
                const ligne = document.createElement('tr');
                ligne.innerHTML = `
                    <td>${m.id_medecin}<\/td>
                    <td>${m.nom || '-'}<\/td>
                    <td>${m.prenom || '-'}<\/td>
                    <td>${specialitesMap.get(m.id_specialite) || 'Non renseignée'}<\/td>
                    <td>${hopitauxMap.get(m.id_hopital) || 'Non renseigné'}<\/td>
                    <td>${wilayasMap.get(m.id_wilaya) || 'Non renseignée'}<\/td>
                    <td class="action-icons">
                        <i class="fa-solid fa-eye" onclick="voirMedecin(${m.id_medecin})"><\/i>
                        <i class="fa-solid fa-pen" onclick="ouvrirModal(this)"><\/i>
                        <i class="fa-solid fa-trash" onclick="supprimerMedecin(${m.id_medecin})"><\/i>
                    <\/td>
                `;
                tbody.appendChild(ligne);
            });
        }

        async function voirMedecin(id) {
            const { data } = await supabaseClient.from('medecins').select('*').eq('id_medecin', id).single();
            alert(`👁️ Médecin: ${data.nom} ${data.prenom}\nID: ${data.id_medecin}`);
        }

        async function supprimerMedecin(id) {
            if (!confirm('🗑️ Supprimer ce médecin ?')) return;
            await supabaseClient.from('medecins').delete().eq('id_medecin', id);
            chargerMedecins();
        }

        function ouvrirModal(icone) {
            const ligne = icone.closest('tr');
            ligneEnCours = ligne;
            document.getElementById('editId').value = ligne.cells[0].innerText;
            document.getElementById('editNom').value = ligne.cells[1].innerText;
            document.getElementById('editPrenom').value = ligne.cells[2].innerText;
            document.getElementById('editSpecialite').value = ligne.cells[3].innerText;
            document.getElementById('editHopital').value = ligne.cells[4].innerText;
            document.getElementById('editWilaya').value = ligne.cells[5].innerText;
            document.getElementById('modalModif').style.display = 'flex';
        }

        function fermerModal() {
            document.getElementById('modalModif').style.display = 'none';
        }

        async function enregistrerModification() {
            const id = document.getElementById('editId').value;
            const data = {
                nom: document.getElementById('editNom').value,
                prenom: document.getElementById('editPrenom').value
            };
            await supabaseClient.from('medecins').update(data).eq('id_medecin', id);
            fermerModal();
            chargerMedecins();
        }

        chargerMedecins();
    </script>
</body>
</html>
