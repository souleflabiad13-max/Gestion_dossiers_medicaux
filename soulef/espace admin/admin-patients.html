<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des patients - MédiConnex</title>
    <link rel="stylesheet" href="style-admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --admin: #ffaa33;
            --admin-light: rgba(255,170,51,0.2);
        }

        .gestion-wrapper {
            display: flex;
            width: 100%;
            max-width: 1400px;
            min-height: 90vh;
            background: rgba(26,26,46,0.7);
            border: 2px solid var(--admin);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            overflow: hidden;
            box-shadow: 0 0 50px var(--admin);
        }

        .sidebar {
            width: 280px;
            background: rgba(0,0,0,0.3);
            border-right: 2px solid var(--admin);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 40px;
            padding: 0 10px;
        }

        .sidebar-logo i {
            font-size: 2.5rem;
            color: var(--admin);
            filter: drop-shadow(0 0 10px var(--admin));
        }

        .sidebar-logo span {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--admin);
            letter-spacing: 2px;
        }

        .sidebar-menu {
            list-style: none;
            flex: 1;
        }

        .sidebar-menu li {
            margin-bottom: 8px;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 20px;
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            transition: 0.3s;
            font-size: 0.95rem;
        }

        .sidebar-menu a i {
            width: 25px;
            color: var(--admin);
            font-size: 1.2rem;
        }

        .sidebar-menu a:hover {
            background: var(--admin-light);
            border-left: 4px solid var(--admin);
        }

        .sidebar-menu .active a {
            background: var(--admin-light);
            border-left: 4px solid var(--admin);
            color: var(--admin);
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid var(--admin);
        }

        .sidebar-footer a {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 20px;
            color: #ff3366;
            text-decoration: none;
            transition: 0.3s;
        }

        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .page-header h1 {
            color: var(--admin);
            font-size: 2rem;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .search-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .search-bar input {
            flex: 1;
            padding: 12px 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--admin);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
        }

        .search-bar input:focus {
            outline: none;
            border-color: var(--admin);
            box-shadow: 0 0 15px var(--admin);
        }

        .search-bar button {
            padding: 12px 25px;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--admin);
            border-radius: 10px;
            color: var(--admin);
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .search-bar button:hover {
            background: var(--admin);
            color: #1a1a2e;
        }

        .table-container {
            overflow-x: auto;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--admin);
            border-radius: 15px;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            color: var(--admin);
            padding: 15px 10px;
            text-align: left;
            border-bottom: 2px solid var(--admin);
            font-weight: 600;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid rgba(255,170,51,0.2);
        }

        tr:hover td {
            background: var(--admin-light);
        }

        .action-icons {
            display: flex;
            gap: 15px;
        }

        .action-icons i {
            color: #aaa;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1.1rem;
        }

        .action-icons i:hover {
            color: var(--admin);
        }

        .action-icons .fa-trash:hover {
            color: #ff3366;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
        }

        .page-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--admin);
            border-radius: 50%;
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
        }

        .page-btn.active {
            background: var(--admin-light);
            border-color: var(--admin);
            color: var(--admin);
        }

        .page-btn:hover {
            border-color: var(--admin);
        }

        @media (max-width: 768px) {
            .gestion-wrapper {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 2px solid var(--admin);
            }
        }
    </style>
</head>
<body>
    <div class="gestion-wrapper">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-logo">
                <i class="fa-solid fa-hospital-user"></i>
                <span>MédiConnex</span>
            </div>

            <ul class="sidebar-menu">
                <li><a href="admin-dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
                <li><a href="admin-medecins.html"><i class="fa-solid fa-user-md"></i> Médecins</a></li>
                <li><a href="admin-hopitaux.html"><i class="fa-solid fa-hospital"></i> Hôpitaux</a></li>
                <li><a href="admin-specialites.html"><i class="fa-solid fa-stethoscope"></i> Spécialités</a></li>
                <li class="active"><a href="#"><i class="fa-solid fa-users"></i> Patients</a></li>
                <li><a href="#"><i class="fa-solid fa-chart-line"></i> Statistiques</a></li>
                <li><a href="#"><i class="fa-solid fa-history"></i> Logs</a></li>
                <li><a href="#"><i class="fa-solid fa-user-cog"></i> Profil</a></li>
            </ul>

            <div class="sidebar-footer">
                <a href="admin-login.html"><i class="fa-solid fa-sign-out-alt"></i> Déconnexion</a>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <div class="page-header">
                <h1>
                    <i class="fa-solid fa-users"></i>
                    Gestion des patients
                </h1>
            </div>

            <!-- Barre de recherche -->
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Rechercher par nom, prénom, ID ou téléphone..." onkeyup="filtrerPatients()">
                <button onclick="filtrerPatients()">Rechercher</button>
            </div>

            <div class="table-container">
                <table id="patientsTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nom</th>
                            <th>Prénom</th>
                            <th>Téléphone</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="patientsBody">
                        <!-- Rempli par JavaScript -->
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <script>
        // Données initiales des patients
        let patientsData = [
            { id: 'DZ-2503-042', nom: 'Benali', prenom: 'Sarah', tel: '0550 12 34 56' },
            { id: 'DZ-2502-156', nom: 'Amine', prenom: 'Mohamed', tel: '0551 23 45 67' },
            { id: 'DZ-2501-234', nom: 'Zahra', prenom: 'Fatima', tel: '0552 34 56 78' },
            { id: 'DZ-2502-089', nom: 'Bensalem', prenom: 'Karim', tel: '0553 45 67 89' },
            { id: 'DZ-2501-178', nom: 'Mansouri', prenom: 'Leila', tel: '0554 56 78 90' }
        ];

        let patientsFiltres = [...patientsData];
        let currentPage = 1;
        const rowsPerPage = 5;

        function afficherPatients(page) {
            const start = (page - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const patientsPage = patientsFiltres.slice(start, end);
            const tbody = document.getElementById('patientsBody');
            tbody.innerHTML = '';

            patientsPage.forEach(p => {
                const ligne = document.createElement('tr');
                ligne.setAttribute('data-id', p.id);
                ligne.innerHTML = `
                    <td>${p.id}</td>
                    <td>${p.nom}</td>
                    <td>${p.prenom}</td>
                    <td>${p.tel}</td>
                    <td class="action-icons">
                        <i class="fa-solid fa-eye" title="Voir dossier" onclick="voirDossier('${p.id}')"></i>
                        <i class="fa-solid fa-trash" title="Supprimer" onclick="supprimerPatient(this)"></i>
                    </td>
                `;
                tbody.appendChild(ligne);
            });

            afficherPagination();
        }

        function afficherPagination() {
            const totalPages = Math.ceil(patientsFiltres.length / rowsPerPage);
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('span');
                btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                btn.innerText = i;
                btn.onclick = () => {
                    currentPage = i;
                    afficherPatients(currentPage);
                };
                pagination.appendChild(btn);
            }
        }

        // Voir dossier
        window.voirDossier = function(id) {
            window.location.href = 'medecin-dossier.html?id=' + id;
        };

        // Supprimer patient
        window.supprimerPatient = function(icone) {
            if (confirm('🗑️ Supprimer ce patient ?')) {
                const ligne = icone.closest('tr');
                const id = ligne.getAttribute('data-id');
                patientsData = patientsData.filter(p => p.id !== id);
                patientsFiltres = patientsFiltres.filter(p => p.id !== id);
                currentPage = 1;
                afficherPatients(currentPage);
            }
        };

        // Filtrer patients
        window.filtrerPatients = function() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            patientsFiltres = patientsData.filter(p =>
                p.nom.toLowerCase().includes(search) ||
                p.prenom.toLowerCase().includes(search) ||
                p.id.toLowerCase().includes(search) ||
                p.tel.includes(search)
            );
            currentPage = 1;
            afficherPatients(currentPage);
        };

        // Initialisation
        afficherPatients(1);
    </script>
</body>
</html>
