<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Admin - MédiConnex</title>
    <link rel="stylesheet" href="style-admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --admin: #ffaa33;
            --admin-light: rgba(255,170,51,0.2);
        }

        .profil-wrapper {
            display: flex;
            width: 100%;
            max-width: 1400px;
            min-height: 90vh;
            background: rgba(26,26,46,0.7);
            border: 2px solid var(--admin);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            overflow: hidden;
            box-shadow: 0 0 50px var(--admin);
        }

        .sidebar {
            width: 280px;
            background: rgba(0,0,0,0.3);
            border-right: 2px solid var(--admin);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 40px;
            padding: 0 10px;
        }

        .sidebar-logo i {
            font-size: 2.5rem;
            color: var(--admin);
            filter: drop-shadow(0 0 10px var(--admin));
        }

        .sidebar-logo span {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--admin);
            letter-spacing: 2px;
        }

        .sidebar-menu {
            list-style: none;
            flex: 1;
        }

        .sidebar-menu li {
            margin-bottom: 8px;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 20px;
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            transition: 0.3s;
            font-size: 0.95rem;
        }

        .sidebar-menu a i {
            width: 25px;
            color: var(--admin);
            font-size: 1.2rem;
        }

        .sidebar-menu a:hover {
            background: var(--admin-light);
            border-left: 4px solid var(--admin);
        }

        .sidebar-menu .active a {
            background: var(--admin-light);
            border-left: 4px solid var(--admin);
            color: var(--admin);
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid var(--admin);
        }

        .sidebar-footer a {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 20px;
            color: #ff3366;
            text-decoration: none;
            transition: 0.3s;
        }

        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            color: var(--admin);
            font-size: 2rem;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .profil-container {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--admin);
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            margin: 0 auto;
        }

        .profil-avatar {
            text-align: center;
            margin-bottom: 30px;
        }

        .profil-avatar i {
            font-size: 5rem;
            color: var(--admin);
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 50%;
            border: 3px solid var(--admin);
        }

        .info-group {
            margin-bottom: 25px;
        }

        .info-group label {
            color: var(--admin);
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .info-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--admin);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
        }

        .info-group input:focus {
            outline: none;
            border-color: var(--admin);
            box-shadow: 0 0 15px var(--admin);
        }

        .info-group input[readonly] {
            background: rgba(255,255,255,0.02);
            cursor: not-allowed;
        }

        .password-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--admin);
        }

        .password-section h3 {
            color: var(--admin);
            margin-bottom: 20px;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 30px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            border: 2px solid;
            background: transparent;
        }

        .btn-primary {
            border-color: var(--admin);
            color: var(--admin);
        }

        .btn-primary:hover {
            background: var(--admin);
            color: #1a1a2e;
            box-shadow: 0 0 30px var(--admin);
        }

        .btn-secondary {
            border-color: #ff3366;
            color: #ff3366;
        }

        .btn-secondary:hover {
            background: #ff3366;
            color: #1a1a2e;
            box-shadow: 0 0 30px #ff3366;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .message.success {
            background: rgba(0,255,0,0.1);
            border: 1px solid #00ff88;
            color: #00ff88;
        }

        .message.error {
            background: rgba(255,0,0,0.1);
            border: 1px solid #ff3366;
            color: #ff3366;
        }

        @media (max-width: 768px) {
            .profil-wrapper {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 2px solid var(--admin);
            }
        }
    </style>
</head>
<body>
    <div class="profil-wrapper">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-logo">
                <i class="fa-solid fa-hospital-user"></i>
                <span>MédiConnex</span>
            </div>

            <ul class="sidebar-menu">
                <li><a href="admin-dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
                <li><a href="admin-medecins.html"><i class="fa-solid fa-user-md"></i> Médecins</a></li>
                <li><a href="admin-hopitaux.html"><i class="fa-solid fa-hospital"></i> Hôpitaux</a></li>
                <li><a href="admin-specialites.html"><i class="fa-solid fa-stethoscope"></i> Spécialités</a></li>
                <li><a href="admin-patients.html"><i class="fa-solid fa-users"></i> Patients</a></li>
                <li><a href="admin-statistiques.html"><i class="fa-solid fa-chart-line"></i> Statistiques</a></li>
                <li><a href="admin-logs.html"><i class="fa-solid fa-history"></i> Logs</a></li>
                <li class="active"><a href="#"><i class="fa-solid fa-user-cog"></i> Profil</a></li>
            </ul>

            <div class="sidebar-footer">
                <a href="admin-login.html"><i class="fa-solid fa-sign-out-alt"></i> Déconnexion</a>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <div class="page-header">
                <h1>
                    <i class="fa-solid fa-user-cog"></i>
                    Profil Administrateur
                </h1>
            </div>

            <div class="profil-container">
                <div class="profil-avatar">
                    <i class="fa-solid fa-user-tie"></i>
                </div>

                <!-- Informations administrateur -->
                <div class="info-group">
                    <label>Nom d'utilisateur</label>
                    <input type="text" id="username" value="admin" readonly>
                </div>

                <div class="info-group">
                    <label>Email</label>
                    <input type="email" id="email" value="admin@mediconnex.dz" readonly>
                </div>

                <!-- Section modification mot de passe -->
                <div class="password-section">
                    <h3><i class="fa-solid fa-lock"></i> Modifier le mot de passe</h3>
                    
                    <div class="info-group">
                        <label>Ancien mot de passe</label>
                        <input type="password" id="oldPassword" placeholder="Entrez l'ancien mot de passe">
                    </div>

                    <div class="info-group">
                        <label>Nouveau mot de passe</label>
                        <input type="password" id="newPassword" placeholder="Entrez le nouveau mot de passe">
                    </div>

                    <div class="info-group">
                        <label>Confirmer le nouveau mot de passe</label>
                        <input type="password" id="confirmPassword" placeholder="Confirmez le nouveau mot de passe">
                    </div>
                </div>

                <!-- Message de retour -->
                <div id="message" class="message"></div>

                <!-- Boutons -->
                <div class="form-actions">
                    <button class="btn btn-secondary" onclick="annulerModification()">Annuler</button>
                    <button class="btn btn-primary" onclick="changerMotDePasse()">Changer le mot de passe</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function changerMotDePasse() {
            const oldPass = document.getElementById('oldPassword').value;
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;
            const messageDiv = document.getElementById('message');

            // Simulation du mot de passe actuel (dans une vraie app, ce serait vérifié en base)
            const currentPassword = "admin123"; // À titre d'exemple

            // Validation
            if (!oldPass || !newPass || !confirmPass) {
                messageDiv.className = 'message error';
                messageDiv.innerText = '❌ Tous les champs sont requis';
                messageDiv.style.display = 'block';
                return;
            }

            if (oldPass !== currentPassword) {
                messageDiv.className = 'message error';
                messageDiv.innerText = '❌ Ancien mot de passe incorrect';
                messageDiv.style.display = 'block';
                return;
            }

            if (newPass !== confirmPass) {
                messageDiv.className = 'message error';
                messageDiv.innerText = '❌ Les nouveaux mots de passe ne correspondent pas';
                messageDiv.style.display = 'block';
                return;
            }

            if (newPass.length < 6) {
                messageDiv.className = 'message error';
                messageDiv.innerText = '❌ Le mot de passe doit contenir au moins 6 caractères';
                messageDiv.style.display = 'block';
                return;
            }

            // Succès
            messageDiv.className = 'message success';
            messageDiv.innerText = '✅ Mot de passe modifié avec succès !';
            messageDiv.style.display = 'block';

            // Réinitialiser les champs
            document.getElementById('oldPassword').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';

            // Masquer le message après 3 secondes
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 3000);
        }

        function annulerModification() {
            document.getElementById('oldPassword').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
            document.getElementById('message').style.display = 'none';
        }
    </script>
</body>
</html>
