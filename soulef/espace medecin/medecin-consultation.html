<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Consultation médicale - MédiConnex</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --primary: #00d4ff; --danger: #ff3366; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #1a1a2e; padding: 30px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        .page-header h1 { color: var(--primary); font-size: 2rem; display: flex; align-items: center; gap: 12px; }
        .back-link { color: #aaa; text-decoration: none; display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.05); padding: 8px 16px; border-radius: 30px; transition: 0.3s; }
        .back-link:hover { color: var(--primary); background: rgba(0,212,255,0.1); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1.5fr; gap: 25px; }
        .card { background: rgba(26,26,46,0.75); backdrop-filter: blur(12px); border: 1px solid rgba(0,212,255,0.25); border-radius: 24px; padding: 25px; margin-bottom: 25px; transition: 0.3s; }
        .card:hover { border-color: var(--primary); box-shadow: 0 0 20px rgba(0,212,255,0.2); }
        .card-title { color: var(--primary); font-size: 1.2rem; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; border-left: 3px solid var(--primary); padding-left: 12px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; color: var(--primary); font-size: 0.8rem; font-weight: 500; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select, textarea { width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(0,212,255,0.3); border-radius: 12px; color: #fff; font-size: 0.9rem; transition: 0.3s; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 15px rgba(0,212,255,0.2); }
        .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .search-patient { display: flex; gap: 12px; margin-bottom: 20px; }
        .search-patient input { flex: 1; }
        .search-patient button { padding: 12px 24px; background: rgba(0,212,255,0.1); border: 1px solid var(--primary); border-radius: 12px; color: var(--primary); cursor: pointer; font-weight: 600; transition: 0.3s; }
        .search-patient button:hover { background: var(--primary); color: #1a1a2e; }
        .btn-add { background: rgba(0,212,255,0.1); border: 1px solid var(--primary); border-radius: 30px; padding: 8px 20px; color: var(--primary); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; }
        .btn-pdf { background: rgba(0,212,255,0.1); border: 1px solid var(--primary); border-radius: 40px; padding: 12px; width: 100%; margin-top: 15px; color: var(--primary); font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: rgba(0,212,255,0.1); border: 2px solid var(--primary); border-radius: 40px; padding: 12px 32px; color: var(--primary); font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-primary:hover { background: var(--primary); color: #1a1a2e; }
        .btn-secondary { background: rgba(255,51,102,0.1); border: 2px solid var(--danger); border-radius: 40px; padding: 12px 32px; color: var(--danger); cursor: pointer; }
        .form-actions { display: flex; justify-content: flex-end; gap: 15px; margin-top: 25px; }
        .med-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; }
        .med-row input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(0,212,255,0.3); border-radius: 10px; padding: 10px; color: #fff; }
        .patient-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .info-label { color: var(--primary); font-size: 0.7rem; text-transform: uppercase; }
        .info-value { color: #fff; font-weight: 500; margin-bottom: 8px; }
        .documents-rapides { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .doc-rapide-btn { background: rgba(0,212,255,0.05); border: 1px solid rgba(0,212,255,0.3); border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .doc-rapide-btn:hover { background: rgba(0,212,255,0.15); border-color: var(--primary); }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } .row-2 { grid-template-columns: 1fr; } .patient-info-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="container">
    <div class="page-header">
        <h1><i class="fas fa-stethoscope"></i> Consultation médicale</h1>
        <a href="medecin-dashboard.html" class="back-link"><i class="fas fa-arrow-left"></i> Retour</a>
    </div>

    <div class="grid-2">
        <!-- COLONNE GAUCHE -->
        <div>
            <!-- Recherche patient -->
            <div class="card">
                <div class="card-title"><i class="fas fa-search"></i> Patient</div>
                <div class="search-patient">
                    <input type="text" id="searchPatient" placeholder="Nom, prénom ou ID...">
                    <button onclick="rechercherPatient()">Rechercher</button>
                </div>
                <div style="text-align: center;">
                    <button class="btn-add" onclick="nouveauPatient()"><i class="fas fa-plus"></i> Nouveau patient</button>
                </div>
            </div>

            <!-- Infos patient -->
            <div class="card">
                <div class="card-title"><i class="fas fa-user"></i> Informations patient</div>
                <div id="patientDetails">Aucun patient sélectionné</div>
            </div>

            <!-- Documents prêts (PDF) -->
            <div class="card">
                <div class="card-title"><i class="fas fa-file-alt"></i> Documents prêts</div>
                <div class="documents-rapides">
                    <div class="doc-rapide-btn" onclick="genererDocumentPDF('analyse')"><i class="fas fa-flask"></i> Analyses</div>
                    <div class="doc-rapide-btn" onclick="genererDocumentPDF('radiographie')"><i class="fas fa-x-ray"></i> Radiographie</div>
                    <div class="doc-rapide-btn" onclick="genererDocumentPDF('certificat')"><i class="fas fa-file-medical"></i> Certificat médical</div>
                    <div class="doc-rapide-btn" onclick="genererDocumentPDF('compte_rendu')"><i class="fas fa-notes-medical"></i> Compte rendu</div>
                </div>
            </div>
        </div>

        <!-- COLONNE DROITE -->
        <div>
            <!-- Consultation -->
            <div class="card">
                <div class="card-title"><i class="fas fa-notes-medical"></i> Détails de la consultation</div>
                <div class="row-2">
                    <div class="form-group"><label>Date</label><input type="date" id="dateConsult" value=""></div>
                    <div class="form-group"><label>Motif</label><input type="text" id="motif" placeholder="Consultation de suivi"></div>
                </div>
                <div class="form-group"><label>Symptômes</label><textarea id="symptomes" rows="2"></textarea></div>
                <div class="row-2">
                    <div class="form-group"><label>Température (°C)</label><input type="text" id="temperature" placeholder="36.5"></div>
                    <div class="form-group"><label>Tension artérielle</label><input type="text" id="tension" placeholder="120/80"></div>
                    <div class="form-group"><label>Fréquence cardiaque</label><input type="text" id="fc" placeholder="72"></div>
                </div>
                <div class="form-group"><label>Diagnostic *</label><textarea id="diagnostic" rows="2" required></textarea></div>
                <div class="form-group"><label>Notes</label><textarea id="notes" rows="2"></textarea></div>
            </div>

            <!-- Ordonnance -->
            <div class="card">
                <div class="card-title"><i class="fas fa-prescription"></i> Ordonnance</div>
                <div id="medicamentsList"></div>
                <button class="btn-add" onclick="ajouterMedicament()"><i class="fas fa-plus"></i> Ajouter médicament</button>
                <button class="btn-pdf" onclick="genererOrdonnancePDF()"><i class="fas fa-file-pdf"></i> Générer ordonnance PDF</button>
            </div>

            <!-- Actions -->
            <div class="form-actions">
                <button class="btn-secondary" onclick="window.location.href='medecin-dashboard.html'">Annuler</button>
                <button class="btn-primary" onclick="enregistrerConsultation()">Enregistrer consultation</button>
            </div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://uuhdpvtnfaycqemhrelo.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_C-QCOapZ_QY92foN_Q-VRw_3WSoCos7'; // ← Ta vraie clé

    let patientActuel = null;
    let medCount = 0;
    const medicamentsSug = ["Doliprane 500mg", "Doliprane 1000mg", "Amoxicilline", "Ibuprofène", "Paracétamol", "Spasfon", "Smecta", "Augmentin"];

    document.getElementById('dateConsult').value = new Date().toISOString().slice(0,10);

    // ==================== PATIENT ====================
    async function rechercherPatient() {
        const searchValue = document.getElementById('searchPatient').value.trim();
        if (!searchValue) { alert('Entrez un nom ou ID'); return; }
        const url = `${SUPABASE_URL}/rest/v1/patients?select=*&or=(nom.ilike.%25${searchValue}%25,prenom.ilike.%25${searchValue}%25,id_national.ilike.%25${searchValue}%25)`;
        try {
            const res = await fetch(url, { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } });
            const patients = await res.json();
            if (!patients.length) { alert('Aucun patient trouvé'); return; }
            patientActuel = patients[0];
            document.getElementById('patientDetails').innerHTML = `
                <div class="patient-info-grid">
                    <div><div class="info-label">ID</div><div class="info-value">${patientActuel.id_national || patientActuel.id_patient}</div></div>
                    <div><div class="info-label">Nom complet</div><div class="info-value">${patientActuel.prenom} ${patientActuel.nom}</div></div>
                    <div><div class="info-label">Âge</div><div class="info-value">${patientActuel.age || '-'} ans</div></div>
                    <div><div class="info-label">Sexe</div><div class="info-value">${patientActuel.sexe === 'M' ? 'Masculin' : 'Féminin'}</div></div>
                    <div><div class="info-label">Téléphone</div><div class="info-value">${patientActuel.telephone || '-'}</div></div>
                    <div><div class="info-label">Adresse</div><div class="info-value">${patientActuel.adresse || '-'}</div></div>
                    <div><div class="info-label">Allergies</div><div class="info-value">${patientActuel.allergies || 'Aucune'}</div></div>
                    <div><div class="info-label">Antécédents</div><div class="info-value">${patientActuel.antecedents || 'Aucun'}</div></div>
                </div>
            `;
        } catch(e) { alert('Erreur recherche'); }
    }

    function nouveauPatient() { window.location.href = 'medecin-ajout-patient.html'; }

    // ==================== ORDONNANCE ====================
    function ajouterMedicament() {
        const div = document.createElement('div');
        div.className = 'med-row';
        div.id = `med-${medCount}`;
        div.innerHTML = `
            <input type="text" list="medList-${medCount}" placeholder="Médicament">
            <datalist id="medList-${medCount}">${medicamentsSug.map(m => `<option value="${m}">`).join('')}</datalist>
            <input type="text" placeholder="Dosage">
            <input type="text" placeholder="Fréquence">
            <input type="text" placeholder="Durée">
            <i class="fas fa-trash" style="color:#ff3366; cursor:pointer" onclick="this.parentElement.remove()"></i>
        `;
        document.getElementById('medicamentsList').appendChild(div);
        medCount++;
    }

 async function genererOrdonnancePDF() {
    if (!patientActuel) return alert('Sélectionnez un patient');
    
    const meds = [];
    document.querySelectorAll('.med-row').forEach(row => {
        const inputs = row.querySelectorAll('input');
        if (inputs[0]?.value) meds.push({
            nom: inputs[0].value,
            dosage: inputs[1]?.value || 'Non spécifié',
            frequence: inputs[2]?.value || 'Non spécifié',
            duree: inputs[3]?.value || 'Non spécifiée'
        });
    });
    
    if (meds.length === 0) return alert('Ajoutez au moins un médicament');
    
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    
    const date = new Date().toLocaleDateString();
    const patientNom = `${patientActuel.prenom} ${patientActuel.nom}`;
    const diagnostic = document.getElementById('diagnostic')?.value || 'Non spécifié';

    // ---- En-tête ----
    doc.setFontSize(22);
    doc.setTextColor(0, 0, 128); // couleur foncée pour le titre
    doc.text('ORDONNANCE MÉDICALE', 20, 20);
    
    doc.setFontSize(12);
    doc.setTextColor(0, 0, 0); // noir pour texte normal
    doc.text(`Dr. Ahmed Benali`, 20, 30);
    doc.text(`Cardiologue - CHU Mustapha`, 20, 37);
    doc.text(`Tel: 023 45 67 89`, 20, 44);
    doc.text(`Patient: ${patientNom}`, 20, 55);
    doc.text(`ID: ${patientActuel.id_national || patientActuel.id_patient}`, 20, 62);
    doc.text(`Date: ${date}`, 20, 69);
    doc.text(`Âge: ${patientActuel.age || '?'} ans`, 20, 76);
    doc.text(`Diagnostic: ${diagnostic}`, 20, 87);
    
    // ---- Médicaments ----
    let y = 97;
    meds.forEach((m, i) => {
        doc.setFont(undefined, 'bold');
        doc.text(`${i+1}. ${m.nom}`, 20, y);
        doc.setFont(undefined, 'normal');
        doc.text(`Dosage: ${m.dosage}`, 25, y + 6);
        doc.text(`Fréquence: ${m.frequence}`, 25, y + 12);
        doc.text(`Durée: ${m.duree}`, 25, y + 18);
        y += 30;
    });

    // ---- Signature ----
    doc.text('_________________________', 20, y);
    doc.text('Signature du médecin', 20, y + 8);
    
    // ---- Sauvegarde ----
    doc.save(`ordonnance_${patientNom}.pdf`);
}


    // ==================== DOCUMENTS PRÊTS (PDF) ====================
 async function genererDocumentPDF(type) {
    if (!patientActuel) return alert('Sélectionnez un patient');
    
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const date = new Date().toLocaleDateString();
    const medecin = "Dr. Ahmed Benali";
    const patient = `${patientActuel.prenom} ${patientActuel.nom}`;
    const diagnostic = document.getElementById('diagnostic')?.value || 'Non spécifié';
    const motif = document.getElementById('motif')?.value || 'Consultation';
    const symptomes = document.getElementById('symptomes')?.value || 'Non renseignés';
    const notes = document.getElementById('notes')?.value || 'Non spécifié';
    
    let titre = '';
    let contenu = '';
    
    switch(type) {
        case 'analyse':
            titre = "DEMANDE D'ANALYSE";
            contenu = `Date: ${date}\nPatient: ${patient}\nID: ${patientActuel.id_national || patientActuel.id_patient}\n\nAnalyses demandées:\n- Bilan sanguin complet\n- Glycémie\n- Cholestérol\n- CRP\n\nMédecin prescripteur: ${medecin}`;
            break;
        case 'radiographie':
            titre = 'DEMANDE DE RADIOGRAPHIE';
            contenu = `Date: ${date}\nPatient: ${patient}\nID: ${patientActuel.id_national || patientActuel.id_patient}\n\nExamen demandé: Radiographie thoracique\nMotif: ${motif}\n\nMédecin prescripteur: ${medecin}`;
            break;
        case 'certificat':
            titre = 'CERTIFICAT MÉDICAL';
            contenu = `Je soussigné ${medecin}, certifie avoir examiné le patient ${patient} (ID: ${patientActuel.id_national || patientActuel.id_patient}) le ${date}.\n\nDiagnostic: ${diagnostic}\n\nCertificat délivré pour servir et valoir ce que de droit.`;
            break;
        case 'compte_rendu':
            titre = 'COMPTE RENDU MÉDICAL';
            contenu = `Date: ${date}\nPatient: ${patient}\nID: ${patientActuel.id_national || patientActuel.id_patient}\n\nMotif: ${motif}\nSymptômes: ${symptomes}\nDiagnostic: ${diagnostic}\nTraitement: ${notes}\n\nMédecin: ${medecin}`;
            break;
    }
    
    // Titre
    doc.setFontSize(18);
    doc.setTextColor(0, 0, 128); // لون غامق للعنوان
    doc.text(titre, 20, 20);

    // Contenu
    doc.setFontSize(12);
    doc.setTextColor(0, 0, 0); // أسود للنص
    doc.splitTextToSize(contenu, 170).forEach((line, i) => {
        doc.text(line, 20, 40 + i * 7); // 7 وحدة بين الأسطر
    });

    // Signature
    doc.text('_________________________', 20, 150);
    doc.text('Signature du médecin', 20, 158);

    // Sauvegarde PDF
    doc.save(`${type}_${patient}.pdf`);
}

    function enregistrerConsultation() {
        if (!patientActuel) return alert('Sélectionnez un patient');
        const diag = document.getElementById('diagnostic').value;
        if (!diag) return alert('Diagnostic requis');
        alert('✅ Consultation enregistrée (simulation)');
        window.location.href = 'medecin-dashboard.html';
    }
</script>
</body>
</html>
