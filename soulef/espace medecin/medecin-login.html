<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Médecin - MédiConnex</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Aucun style ajouté, tout est dans style.css */
        .login-container {
            max-width: 900px;
            width: 100%;
        }

        .forgot-link {
            text-align: right;
            margin-top: 5px;
            font-size: 0.9rem;
        }

        .forgot-link a {
            color: #00d4ff;
            text-decoration: none;
            transition: 0.3s;
        }

        .forgot-link a:hover {
            text-decoration: underline;
            text-shadow: 0 0 8px #00d4ff;
        }
    </style>
</head>
<body>
    <div class="auth-wrapper login-container">
        <div class="background-shape"></div>
        <div class="secondary-shape"></div>

        <!-- Panneau de connexion (gauche) -->
        <div class="credentials-panel signin">
            <h2 class="slide-element">Connexion Médecin</h2>

            <form onsubmit="event.preventDefault(); window.location.href='medecin-dashboard.html'">
                <!-- ID Médecin -->
                <div class="field-wrapper slide-element">
                    <input type="text" required>
                    <label>ID Médecin</label>
                    <i class="fa-solid fa-id-card"></i>
                </div>

                <!-- Nom -->
                <div class="field-wrapper slide-element">
                    <input type="text" required>
                    <label>Nom</label>
                    <i class="fa-solid fa-user"></i>
                </div>

                <!-- Mot de passe -->
                <div class="field-wrapper slide-element">
                    <input type="password" required>
                    <label>Mot de passe</label>
                    <i class="fa-solid fa-lock"></i>
                </div>

                <!-- Lien mot de passe oublié -->
                <div class="forgot-link slide-element">
                    <a href="#">Mot de passe oublié ?</a>
                </div>

                <!-- Bouton de connexion -->
                <div class="field-wrapper slide-element">
                    <button class="submit-button" type="submit">Se connecter</button>
                </div>
            </form>
        </div>

        <!-- Panneau d'accueil (droite) -->
        <div class="welcome-section signin">
            <h2 class="slide-element">ESPACE MÉDECIN</h2>
            <p class="slide-element">Accès sécurisé à vos patients et dossiers</p>
        </div>
    </div>
</body>
</html>
