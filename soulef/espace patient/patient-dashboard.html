<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Patient - MédiConnex</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --patient: #00ff88;
        }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard-container {
            max-width: 900px;
            width: 100%;
            background: rgba(26,26,46,0.7);
            border: 2px solid var(--patient);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            padding: 30px;
            box-shadow: 0 0 50px var(--patient);
        }

        .patient-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--patient);
        }

        .patient-avatar {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--patient), #1a1a2e);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--patient);
        }

        .patient-avatar i {
            font-size: 2.5rem;
            color: #fff;
        }

        .patient-info h1 {
            color: var(--patient);
            margin-bottom: 5px;
        }

        .last-consult {
            background: rgba(0,255,136,0.1);
            border: 1px solid var(--patient);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--patient);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .card:hover {
            background: rgba(0,255,136,0.1);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,255,136,0.3);
        }

        .card i {
            font-size: 3rem;
            color: var(--patient);
            margin-bottom: 15px;
        }

        .card h3 {
            color: var(--patient);
            margin-bottom: 10px;
        }

        .btn {
            background: rgba(0,255,136,0.1);
            border: 2px solid var(--patient);
            border-radius: 40px;
            padding: 12px 30px;
            color: var(--patient);
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            transition: 0.3s;
        }

        .btn:hover {
            background: var(--patient);
            color: #1a1a2e;
            box-shadow: 0 0 30px var(--patient);
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="patient-header">
            <div class="patient-avatar">
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="patient-info">
                <h1>Sarah Benali</h1>
                <p>ID: DZ-2503-042</p>
            </div>
        </div>

        <div class="last-consult">
            <div>
                <strong style="color: var(--patient);">Dernière consultation</strong>
                <p>10 Mars 2025 - Dr. Benali (Cardiologie)</p>
            </div>
            <a href="patient-dossier.html" class="btn">Voir mon dossier</a>
        </div>

        <div class="cards-grid">
            <div class="card" onclick="window.location.href='patient-dossier.html'">
                <i class="fa-solid fa-folder-open"></i>
                <h3>Mon dossier médical</h3>
                <p>Consultez vos informations</p>
            </div>
            <div class="card" onclick="window.location.href='patient-rendezvous.html'">
                <i class="fa-solid fa-calendar-check"></i>
                <h3>Mes rendez-vous</h3>
                <p>Voir vos rendez-vous passés et à venir</p>
            </div>
            <div class="card" onclick="window.location.href='patient-analyses.html'">
                <i class="fa-solid fa-flask"></i>
                <h3>Mes analyses</h3>
                <p>Consultez vos résultats</p>
            </div>
        </div>
    </div>
</body>
</html>
