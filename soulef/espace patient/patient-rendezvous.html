<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes rendez-vous - MédiConnex</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --patient: #00ff88;
        }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .rdv-container {
            max-width: 900px;
            width: 100%;
            background: rgba(26,26,46,0.7);
            border: 2px solid var(--patient);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            padding: 30px;
            box-shadow: 0 0 50px var(--patient);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: var(--patient);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-link {
            color: #aaa;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            color: var(--patient);
            padding: 15px 10px;
            text-align: left;
            border-bottom: 2px solid var(--patient);
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid rgba(0,255,136,0.2);
        }

        tr:hover td {
            background: rgba(0,255,136,0.05);
        }

        .badge {
            background: rgba(0,255,136,0.2);
            color: var(--patient);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            border: 1px solid var(--patient);
        }
    </style>
</head>
<body>
    <div class="rdv-container">
        <div class="header">
            <h1><i class="fa-solid fa-calendar-check"></i> Mes rendez-vous</h1>
            <a href="patient-dashboard.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Retour</a>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Médecin</th>
                    <th>Hôpital</th>
                    <th>Statut</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>15/03/2025 à 10:30</td>
                    <td>Dr. Ahmed Benali</td>
                    <td>CHU Mustapha</td>
                    <td><span class="badge">Confirmé</span></td>
                </tr>
                <tr>
                    <td>22/03/2025 à 14:00</td>
                    <td>Dr. Karim Amine</td>
                    <td>CHU Mustapha</td>
                    <td><span class="badge">En attente</span></td>
                </tr>
                <tr>
                    <td>10/03/2025 à 09:00</td>
                    <td>Dr. Ahmed Benali</td>
                    <td>CHU Mustapha</td>
                    <td><span class="badge">Terminé</span></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
